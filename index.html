 led:[["Une LED s’allume…","dans un seul sens de branchement",["dans les deux sens","jamais avec une pile","seulement avec 230 V"],"La LED est une diode : elle laisse passer le courant dans un seul sens."],["La patte la plus longue d’une LED se branche du côté…","+ de la pile",["− de la pile","peu importe","de la terre"],"Patte longue = anode (+), patte courte = cathode (−)."],["Pourquoi ajoute-t-on une résistance avec une LED ?","pour limiter le courant et ne pas la griller",["pour qu’elle change de couleur","pour qu’elle clignote","pour augmenter la tension"],"Sans résistance, trop de courant traverse la LED."],["Que veut dire DEL (LED en anglais) ?","diode électroluminescente",["lampe électrique durable","lumière extra douce","ligne électrique directe"],"Une diode qui produit de la lumière."]],
 algo:[["Un algorithme, c’est…","une suite d’instructions précises, dans l’ordre",["un robot","un ordinateur","un jeu vidéo"],"Comme une recette de cuisine."],["Si on inverse deux instructions, le résultat…","peut changer",["ne change jamais","efface le programme","va plus vite"],"L’ordre des instructions compte."],["« Tourner à droite » fait…","pivoter le robot sur place",["avancer le robot d’une case","reculer le robot","arrêter le programme"],"Le robot change de direction sans changer de case."]],
 loop:[["À quoi sert une boucle « répéter » ?","à refaire plusieurs fois les mêmes instructions",["à arrêter le programme","à choisir entre deux actions","à effacer le dessin"],"Elle évite d’écrire 10 fois la même chose."],["« répéter 4 fois : avancer, tourner à droite » dessine…","un carré",["un triangle","une ligne droite","un cercle"],"4 côtés et 4 virages d’un quart de tour."],["Dans « répéter 3 fois : avancer, avancer », combien de fois le robot avance-t-il ?","6",["3","2","5"],"3 tours × 2 = 6."]],
 cond2:[["Quel bloc permet au programme de choisir ?","si … sinon",["répéter 5 fois","avancer","afficher"],"La condition teste une situation et choisit quoi faire."],["« si il pleut : prendre un parapluie, sinon : prendre une casquette ». Il fait beau. Je prends…","une casquette",["un parapluie","les deux","rien"],"La condition « il pleut » est fausse : on fait la partie « sinon »."],["Une condition est toujours…","vraie ou fausse",["un nombre","une couleur","un mot au hasard"],"En informatique, on appelle ça un booléen."]],
 vars:[["Une variable, c’est…","une boîte avec un nom qui garde une valeur",["un nombre qui ne change jamais","un robot","une couleur"],"Sa valeur peut changer pendant le programme."],["score ← 5 puis score ← score + 3. Que vaut score ?","8",["5","3","53"],"On prend l’ancienne valeur (5) et on ajoute 3."],["Que fait « afficher score » ?","il montre la valeur de score à l’écran",["il efface score","il met score à 0","il double score"],"Afficher ne change pas la variable."]],
 py1:[["En Python, quelle instruction affiche un texte à l’écran ?","print",["show","echo","display"],"print(\"Bonjour\") affiche Bonjour."],["En Python, que fait age = 10 ?","il range 10 dans la variable age",["il compare age et 10","il affiche 10","il efface age"],"Le signe = range une valeur ; pour comparer, on écrit ==."],["Qu’affiche print(\"2 + 3\") ?","2 + 3",["5","23","rien"],"Entre guillemets, c’est un texte : Python ne calcule pas."]],
 py2:[["Combien de tours fait for i in range(5) ?","5",["4","6","1"],"range(5) donne 0, 1, 2, 3, 4."],["Pourquoi certaines lignes sont-elles décalées (indentées) en Python ?","elles font partie du bloc de la boucle ou du if",["pour faire joli","pour aller plus vite","c’est une erreur"],"Python utilise le décalage pour savoir ce qui est dans la boucle."]]
};
const ELESS=[
 {id:"e_circ",sub:"elec",lvl:"CM2",title:"Le circuit électrique",desc:"Pile, lampe, interrupteur, boucle fermée",bank:EB.circ,steps:[
  {t:"Allumer une lampe",h:`<p>Appuie sur l’interrupteur et regarde le courant circuler dans les fils.</p>`+circuitSimple("st1"),say:"Voici un circuit électrique. Il y a une pile, une lampe, un interrupteur et des fils. Appuie sur le bouton pour fermer l’interrupteur. Le courant se met à circuler dans la boucle, et la lampe s’allume. Appuie encore : le circuit s’ouvre, le courant s’arrête, la lampe s’éteint."},
  {t:"Les éléments du circuit",h:ltab([["Élément","Rôle","Symbole"],["la pile","donne l’énergie (le générateur)","un grand trait + et un petit trait −"],["la lampe","transforme l’énergie en lumière","un cercle avec une croix"],["l’interrupteur","ouvre ou ferme le circuit","un trait qui se lève"],["les fils","relient les éléments","des traits"]]),say:"Chaque élément a un rôle. La pile est le générateur : elle fournit l’énergie. La lampe est un récepteur : elle transforme l’énergie en lumière. L’interrupteur permet d’ouvrir ou de fermer le circuit. Et les fils relient le tout. Les ingénieurs dessinent les circuits avec des symboles : c’est un schéma électrique."},
  {t:"Circuit ouvert, circuit fermé",h:circuitSimple("st1b")+KEY("Le courant ne circule que dans une boucle <b>fermée</b>, qui part d’une borne de la pile et revient à l’autre."),say:"Retiens bien : pour que le courant circule, il faut une boucle fermée, sans interruption, qui part de la borne plus de la pile et revient à la borne moins. Si un fil est débranché, ou si l’interrupteur est ouvert, le circuit est ouvert : plus rien ne marche."},
  {t:"Le sens du courant",h:`<p>À l’extérieur de la pile, le courant va de la borne <b>+</b> vers la borne <b>−</b>. C’est le sens que montrent les petits points qui avancent.</p>`+KEY("Une pile a deux bornes : + et −. Le courant sort par le + et rentre par le −."),say:"Le courant a un sens. À l’extérieur de la pile, il part de la borne plus, traverse la lampe, et revient par la borne moins. Les petits points qui avancent dans l’animation montrent ce sens."}]},
 {id:"e_cond",sub:"elec",lvl:"CM2",title:"Conducteurs et isolants",desc:"Teste des objets dans le circuit",bank:EB.cond,steps:[
  {t:"Le testeur de conducteurs",h:`<p>Pose un objet dans la pince : si la lampe s’allume, l’objet laisse passer le courant.</p>`+circuitTest("st2"),say:"Ce circuit est un testeur. On pose un objet entre les deux pinces. Si la lampe s’allume, c’est que l’objet laisse passer le courant : c’est un conducteur. Essaie le trombone, la pièce, la règle en plastique, le bâton de bois et la gomme."},
  {t:"Conducteurs et isolants",h:ltab([["Conducteurs (le courant passe)","Isolants (le courant ne passe pas)"],["fer, cuivre, aluminium, or…","plastique, caoutchouc, verre, bois sec, air"],["l’eau, le corps humain !","papier, tissu sec"]])+KEY("Les métaux sont conducteurs. Le plastique et le caoutchouc sont isolants."),say:"Les métaux, comme le fer, le cuivre ou l’aluminium, sont des conducteurs. Le plastique, le caoutchouc, le verre ou le bois sec sont des isolants. Attention : l’eau et le corps humain sont conducteurs. C’est pour cela que l’électricité est dangereuse avec de l’eau."},
  {t:"À quoi servent les isolants ?",h:`<p>Un fil électrique a un cœur en <b>cuivre</b> (conducteur) entouré d’une gaine en <b>plastique</b> (isolant).</p>`+KEY("La gaine isolante nous protège : on ne touche jamais un fil dénudé ni un appareil avec les mains mouillées."),say:"Un fil électrique a un cœur en cuivre, qui conduit le courant, entouré d’une gaine en plastique, qui est isolante. Cette gaine nous protège. Ne touche jamais un fil dont le cuivre est visible, et jamais un appareil électrique avec les mains mouillées."}]},
 {id:"e_serie",sub:"elec",lvl:"5e",title:"Série ou dérivation",desc:"Deux façons de brancher deux lampes",bank:EB.serie,steps:[
  {t:"Le circuit en série",h:`<p>Les deux lampes sont l’une après l’autre, dans <b>une seule boucle</b>.</p>`+circuitSeries("st3"),say:"Dans un circuit en série, les lampes sont branchées l’une après l’autre, dans une seule boucle. Dévisse la lampe numéro deux : la boucle est coupée, et les deux lampes s’éteignent."},
  {t:"Le circuit en dérivation",h:`<p>Chaque lampe a <b>sa propre boucle</b> avec la pile.</p>`+circuitPar("st3b"),say:"Dans un circuit en dérivation, chaque lampe a sa propre boucle avec la pile. Dévisse la lampe numéro deux : la première lampe reste allumée, car sa boucle n’est pas coupée."},
  {t:"Et dans la maison ?",h:KEY("Toutes les prises et les lampes de la maison sont branchées <b>en dérivation</b> : on peut éteindre une lampe sans éteindre le frigo.")+`<p>Les guirlandes de Noël anciennes étaient en série : une ampoule grillée, et toute la guirlande s’éteignait !</p>`,say:"Dans une maison, tout est branché en dérivation. C’est pratique : quand tu éteins ta lampe, le frigo continue de fonctionner. Les vieilles guirlandes de Noël étaient en série : une seule ampoule grillée, et toute la guirlande s’éteignait !"}]},
 {id:"e_court",sub:"elec",lvl:"CM2",title:"Court-circuit et sécurité",desc:"Les dangers de l’électricité",bank:EB.court,steps:[
  {t:"Le court-circuit",h:`<p>Ajoute un fil qui relie les deux côtés de la lampe.</p>`+circuitShort("st4"),say:"Ajoute un fil qui relie les deux côtés de la lampe. Le courant prend le chemin le plus facile : il passe par le fil au lieu de la lampe. La lampe s’éteint, le courant devient très fort, et la pile chauffe. C’est un court-circuit. Avec de gros courants, cela peut provoquer un incendie."},
  {t:"La prise de courant : danger !",h:`<p class="warn">Une prise de courant délivre 230 volts. C’est 150 fois plus qu’une pile de 1,5 V, et cela peut tuer.</p>`+KEY("Jamais d’objet dans une prise. Jamais d’appareil électrique près de l’eau. Jamais de fil abîmé. Les expériences se font uniquement avec des piles."),say:"Attention, c’est très important. Une prise de courant délivre deux cent trente volts. C’est cent cinquante fois plus qu’une petite pile, et cela peut tuer. On ne met jamais d’objet dans une prise. On n’utilise jamais un appareil électrique près de l’eau. On ne touche jamais un fil abîmé. Les expériences se font seulement avec des piles."},
  {t:"Les protections de la maison",h:ltab([["Protection","À quoi ça sert"],["le disjoncteur","coupe le courant en cas de court-circuit ou de surcharge"],["le différentiel 30 mA","coupe le courant si une personne touche un fil sous tension"],["la prise de terre","évacue le courant de fuite vers le sol"]]),say:"Dans le tableau électrique de la maison, il y a des protections. Le disjoncteur coupe le courant en cas de court-circuit. Le différentiel trente milliampères coupe le courant très vite si une personne touche un fil sous tension. Et la prise de terre évacue les fuites de courant vers le sol. Les électriciens et les ingénieurs dimensionnent ces protections pour que tout le monde soit en sécurité."}]},
 {id:"e_unit",sub:"elec",lvl:"4e",title:"Tension et intensité",desc:"Volts, ampères et le réservoir d’eau",bank:EB.unit,steps:[
  {t:"Comme de l’eau dans des tuyaux",h:`<p>Remplis le réservoir : l’eau pousse plus fort et la roue tourne plus vite.</p>`+waterStage("st5"),say:"Pour comprendre l’électricité, imagine de l’eau dans des tuyaux. La hauteur de l’eau dans le réservoir, c’est la tension : plus elle est haute, plus elle pousse fort. La quantité d’eau qui passe chaque seconde, c’est l’intensité. Remplis le réservoir : l’eau pousse plus fort, et la roue tourne plus vite."},
  {t:"Les deux grandeurs",h:ltab([["Grandeur","Lettre","Unité","Appareil de mesure","Branchement"],["la tension","U","le volt (V)","le voltmètre","en dérivation"],["l’intensité","I","l’ampère (A)","l’ampèremètre","en série"]])+KEY("Pile ronde : 1,5 V. Pile plate : 4,5 V. Prise de la maison : 230 V."),say:"La tension se note U et se mesure en volts, avec un voltmètre branché en dérivation, c’est-à-dire à côté de l’appareil. L’intensité se note I et se mesure en ampères, avec un ampèremètre branché en série, dans la boucle. Une pile ronde fait un virgule cinq volt, une pile plate quatre virgule cinq volts, et la prise de la maison deux cent trente volts."},
  {t:"Le multimètre",h:`<p>Le multimètre est un appareil qui mesure à la fois la tension (position V) et l’intensité (position A). C’est l’outil favori des électriciens !</p>`+KEY("On choisit toujours le bon calibre avant de mesurer, et on commence par le plus grand."),say:"Le multimètre est l’outil préféré des électriciens. Il peut mesurer la tension, en position V, et l’intensité, en position A. Avant de mesurer, on choisit toujours le bon calibre, en commençant par le plus grand pour ne pas abîmer l’appareil."}]},
 {id:"e_ohm",sub:"elec",lvl:"4e",title:"La loi d’Ohm",desc:"U = R × I, avec un curseur à manipuler",gen:G.ohm,bank:EB.ohm,steps:[
  {t:"La résistance freine le courant",h:`<p>Fais glisser le curseur : plus la résistance est grande, plus le courant ralentit.</p>`+ohmStage("st6"),say:"Une résistance est un composant qui freine le courant. Fais glisser le curseur. Plus la résistance est grande, plus le courant est faible : les points avancent plus lentement. La pile, elle, donne toujours six volts."},
  {t:"La formule",h:`<p class="bignum small">U = R × I</p>`+ltab([["U","R","I"],["tension en volts (V)","résistance en ohms (Ω)","intensité en ampères (A)"]])+KEY("On peut aussi écrire I = U ÷ R et R = U ÷ I."),say:"La loi d’Ohm s’écrit U égale R fois I. U est la tension en volts, R la résistance en ohms, et I l’intensité en ampères. On peut la retourner : I égale U divisé par R, et R égale U divisé par I."},
  {t:"Un exemple",h:EX(CALC("Pile : U = 6 V   Résistance : R = 30 Ω\nI = U ÷ R = 6 ÷ 30 = 0,2 A"))+`<p>Si on double la résistance (60 Ω), l’intensité est divisée par deux : 0,1 A.</p>`,say:"Prenons un exemple. Une pile de six volts et une résistance de trente ohms. L’intensité vaut six divisé par trente, soit zéro virgule deux ampère. Si on double la résistance, l’intensité est divisée par deux : zéro virgule un ampère."}]},
 {id:"e_led",sub:"elec",lvl:"5e",title:"La LED",desc:"Une lampe qui n’aime qu’un seul sens",bank:EB.led,steps:[
  {t:"Une diode qui éclaire",h:`<p>Retourne la LED : elle ne s’allume que dans un sens.</p>`+ledStage("st7"),say:"Une LED, ou diode électroluminescente, est une petite lampe très économe. Mais elle a une particularité : elle ne laisse passer le courant que dans un seul sens. Retourne-la : le courant est bloqué et elle s’éteint."},
  {t:"Les pattes de la LED",h:ltab([["Patte","Nom","Se branche vers"],["longue","anode","le + de la pile"],["courte","cathode","le − de la pile"]])+KEY("Avec une LED, on met toujours une résistance pour limiter le courant."),say:"Une LED a deux pattes. La patte longue s’appelle l’anode : elle se branche du côté plus. La patte courte, la cathode, se branche du côté moins. Et on ajoute toujours une résistance, sinon trop de courant la traverse et elle grille."},
  {t:"Partout autour de toi",h:`<p>Écrans, feux de circulation, phares de voiture, lampes de la maison : les LED consomment environ 5 fois moins qu’une ampoule classique et durent beaucoup plus longtemps.</p>`,say:"Les LED sont partout : dans les écrans, les feux de circulation, les phares de voiture et les lampes de la maison. Elles consomment environ cinq fois moins d’énergie qu’une vieille ampoule, et durent beaucoup plus longtemps."}]}
];
const PLESS=[
 {id:"p_algo",sub:"prog",lvl:"CM2",title:"Qu’est-ce qu’un algorithme ?",desc:"Guider un robot pas à pas",gen:G.robot,bank:EB.algo,steps:[
  {t:"Un robot qui obéit",h:`<p>Le robot suit les instructions <b>une par une, dans l’ordre</b>. Regarde-le aller jusqu’au drapeau.</p>`+robotDemo("rb1",{w:6,h:4,start:[0,3,1],goal:[4,0],prog:[{op:"F"},{op:"F"},{op:"L"},{op:"F"},{op:"F"},{op:"F"},{op:"R"},{op:"F"},{op:"F"}]}),say:"Un ordinateur ne réfléchit pas tout seul : il suit exactement les instructions qu’on lui donne, une par une, dans l’ordre. Regarde le robot : il avance, il tourne, et il arrive au drapeau. La liste d’instructions s’appelle un algorithme."},
  {t:"Un algorithme, c’est une recette",h:KEY("Un algorithme est une suite d’instructions précises, dans un ordre précis, pour résoudre un problème.")+EX(`<p>Recette de la pâte à crêpes : 1. verser la farine, 2. ajouter les œufs, 3. mélanger, 4. ajouter le lait petit à petit.</p>`),say:"Un algorithme, c’est comme une recette de cuisine : des instructions précises, dans un ordre précis. Si tu mets le lait avant la farine, la pâte rate. En programmation, c’est pareil : l’ordre compte."},
  {t:"Tourner, c’est sur place",h:`<p>« tourner à gauche » et « tourner à droite » font pivoter le robot <b>sans changer de case</b>. La flèche montre où il regarde.</p>`,say:"Attention à un piège : quand le robot tourne, il pivote sur place, sans changer de case. Seule l’instruction avancer le fait bouger. Pour ne pas te tromper, regarde la flèche du robot : elle montre la direction dans laquelle il va avancer."}]},
 {id:"p_loop",sub:"prog",lvl:"CM2",title:"Les boucles",desc:"Répéter sans tout réécrire",gen:G.robot,bank:EB.loop,steps:[
  {t:"Dessiner un carré",h:`<p>Au lieu d’écrire 16 instructions, on utilise une <b>boucle</b>.</p>`+robotDemo("rb2",{w:5,h:5,start:[1,4,0],trail:true,prog:[{rep:4,body:[{op:"F"},{op:"F"},{op:"F"},{op:"R"}]}]}),say:"Le robot doit dessiner un carré. Sans boucle, il faudrait écrire seize instructions. Avec une boucle répéter quatre fois, on écrit seulement quatre instructions, et l’ordinateur les répète. Regarde le robot tracer son carré."},
  {t:"Compter les tours",h:EX(CALC("répéter 3 fois :\n    avancer\n    avancer\n\n→ le robot avance 3 × 2 = 6 fois"))+KEY("Une boucle répète un bloc d’instructions un nombre de fois choisi."),say:"Pour savoir ce que fait une boucle, on multiplie. Répéter trois fois avancer, avancer : le robot avance trois fois deux, soit six fois. Les instructions décalées vers la droite font partie de la boucle."}]},
 {id:"p_cond",sub:"prog",lvl:"6e",title:"Les conditions",desc:"Si… sinon : le robot décide",gen:G.robot,bank:EB.cond2,steps:[
  {t:"Le robot dans le labyrinthe",h:`<p>Le robot ne connaît pas le chemin. À chaque pas, il <b>teste</b> s’il y a un mur devant lui.</p>`+robotDemo("rb3",{w:5,h:5,start:[0,4,1],goal:[1,1],walls:[[0,0],[1,0],[2,0],[3,0],[4,0],[0,1],[0,2],[1,2],[2,2],[3,2],[0,3],[1,3],[2,3],[3,3]],prog:[{until:true,body:[{ifw:true,then:[{op:"L"}],else:[{op:"F"}]}]}]}),say:"Cette fois, le robot ne connaît pas le chemin. Son programme est très court : tant qu’il n’est pas sur le drapeau, s’il y a un mur devant lui, il tourne à gauche, sinon, il avance. Regarde : il trouve son chemin tout seul. C’est la force des conditions."},
  {t:"Si… sinon",h:CALC("si il pleut :\n    prendre un parapluie\nsinon :\n    prendre une casquette")+KEY("Une condition est vraie ou fausse. Si elle est vraie, on fait le premier bloc, sinon le second."),say:"Une condition, c’est une question dont la réponse est vrai ou faux. Si il pleut, je prends un parapluie, sinon, je prends une casquette. L’ordinateur exécute un seul des deux blocs, selon la réponse."}]},
 {id:"p_vars",sub:"prog",lvl:"6e",title:"Les variables",desc:"Des boîtes qui gardent des valeurs",gen:G.pseudo,bank:EB.vars,steps:[
  {t:"Une boîte avec une étiquette",h:`<p>Avance instruction par instruction et regarde les boîtes changer.</p>`+traceDemo("tv1",{lines:["score ← 0","vies ← 3","score ← score + 10","vies ← vies − 1","score ← score × 2","afficher score"],steps:[{l:0,vars:{score:0}},{l:1,vars:{score:0,vies:3}},{l:2,vars:{score:10,vies:3},note:"On prend l’ancienne valeur 0 et on ajoute 10."},{l:3,vars:{score:10,vies:2},note:"3 − 1 = 2 vies."},{l:4,vars:{score:20,vies:2},note:"10 × 2 = 20."},{l:5,vars:{score:20,vies:2},out:"20"}]}),say:"Une variable est comme une boîte avec une étiquette. On y range une valeur, qui peut changer pendant le programme. Dans un jeu vidéo, le score et le nombre de vies sont des variables. Appuie sur instruction suivante, et regarde les boîtes changer."},
  {t:"Lire une affectation",h:CALC("score ← score + 10")+`<p>On lit de droite à gauche : on calcule <b>score + 10</b> avec l’ancienne valeur, puis on range le résultat dans <b>score</b>.</p>`,say:"Comment lire score reçoit score plus dix ? On calcule d’abord la partie de droite, avec l’ancienne valeur du score. Puis on range le résultat dans la boîte score. L’ancienne valeur est remplacée."}]},
 {id:"p_py1",sub:"prog",lvl:"5e",title:"Premiers pas en Python",desc:"print, variables et if",gen:G.py,bank:[...EB.py1,...B.python.slice(0,3)],steps:[
  {t:"Le langage Python",h:`<p>Python est un vrai langage de programmation, utilisé par les ingénieurs, les scientifiques… et par les élèves de collège !</p>`+traceDemo("tp1",{py:true,lines:["age = 10","age = age + 1",'message = "J’ai " + str(age) + " ans"',"print(message)","if age > 10:",'    print("Bienvenue au collège !")'],steps:[{l:0,vars:{age:10},note:"= range 10 dans la variable age."},{l:1,vars:{age:11}},{l:2,vars:{age:11,message:"\"J’ai 11 ans\""},note:"str() transforme le nombre en texte pour le coller."},{l:3,vars:{age:11,message:"\"J’ai 11 ans\""},out:"J’ai 11 ans"},{l:4,vars:{age:11,message:"\"J’ai 11 ans\""},note:"11 > 10 est vrai : on entre dans le bloc."},{l:5,vars:{age:11,message:"\"J’ai 11 ans\""},out:"Bienvenue au collège !"}]}),say:"Python est un vrai langage, utilisé par les ingénieurs et les scientifiques. En Python, le signe égal range une valeur dans une variable. print affiche à l’écran. Et if permet de tester une condition. Avance ligne par ligne pour voir ce que fait l’ordinateur."},

/* ================= physique-chimie ================= */
const pfig=(inner,label,h=200)=>`<svg class="efig pfig" viewBox="0 0 320 ${h}" role="img" aria-label="${label}">${inner}</svg>`;
/* --- états de la matière : particules + thermomètre --- */
const PC_POS={
 solide:[...Array(16)].map((_,i)=>[127+(i%4)*22,168-Math.floor(i/4)*22]),
 liquide:[[74,169],[96,167],[119,170],[141,168],[164,170],[186,167],[209,169],[232,168],[85,148],[108,150],[130,147],[153,149],[176,147],[198,150],[221,148],[243,150]],
 gaz:[[82,44],[150,38],[214,52],[244,96],[118,80],[180,92],[86,124],[148,128],[226,140],[110,166],[196,164],[240,170],[168,58],[128,110],[206,118],[76,170]]};
const pcEtat=t=>t<0?"solide":t<100?"liquide":"gaz";
const PC_ETXT={solide:"de la <b>glace</b> (solide) : les particules sont rangées, serrées, elles vibrent sur place",liquide:"de l’<b>eau liquide</b> : les particules sont serrées mais en désordre, elles glissent les unes sur les autres",gaz:"de la <b>vapeur d’eau</b> (gaz) : les particules sont très écartées et bougent vite dans tout le récipient"};
function pcEtatOut(t){const e=pcEtat(t);return `${fmt(t)} °C → ${t===0?"<b>palier de fusion</b> : la glace fond, la température reste à 0 °C. Juste en dessous, ":t===100?"<b>palier d’ébullition</b> : l’eau bout, la température reste à 100 °C. Juste au-dessus, ":""}c’est ${PC_ETXT[t===0?"solide":e]}.`}
function etatStage(id,t0=20){const e=pcEtat(t0),h=Math.round((t0+20)/140*130);
  return `<div class="stage pcstage" id="${id}" data-etat="${e}">${pfig(`<g transform="translate(20,0)"><rect class="pbox" x="60" y="20" width="200" height="164" rx="6"/>`+
   PC_POS[e].map((p,i)=>`<g class="pt" style="transform:translate(${p[0]}px,${p[1]}px)"><circle class="pmol" r="10" style="animation-delay:-${(i*0.13).toFixed(2)}s"/></g>`).join("")+`</g>`+
   `<rect class="thermo" x="10" y="30" width="14" height="140" rx="7"/><rect class="thermo-in" x="13" y="${167-h}" width="8" height="${h}" rx="4"/><circle class="thermo-b" cx="17" cy="176" r="11"/>`+
   `<path class="ptick" d="M24,56 H30 M24,148 H30"/><text class="cap" x="32" y="60">100 °C</text><text class="cap" x="32" y="152">0 °C</text><text class="cap pnom" x="180" y="14" text-anchor="middle">${{solide:"glace",liquide:"eau liquide",gaz:"vapeur d’eau"}[e]}</text>`,"Particules d’eau dans un récipient",196)}</div>
  <div class="ohm-ctl"><label for="${id}-t"><b>Température</b></label><input type="range" id="${id}-t" data-pc="etat:${id}" min="-20" max="120" step="1" value="${t0}"><p class="ohm-out" id="${id}-o">${pcEtatOut(t0)}</p></div>`}
function pcEtatSet(id,t){const st=document.getElementById(id);if(!st)return;const e=pcEtat(t);st.dataset.etat=e;
  st.querySelectorAll(".pt").forEach((g,i)=>{const p=PC_POS[e][i];g.style.transform=`translate(${p[0]}px,${p[1]}px)`});
  const h=Math.round((t+20)/140*130),th=st.querySelector(".thermo-in");th.setAttribute("y",167-h);th.setAttribute("height",h);
  st.querySelector(".pnom").textContent={solide:"glace",liquide:"eau liquide",gaz:"vapeur d’eau"}[e];
  document.getElementById(id+"-o").innerHTML=pcEtatOut(t)}

  `<rect class="pobj" x="140" y="0" width="40" height="30" rx="5"/>`+`<rect class="pwater2" x="62" y="80" width="196" height="102" rx="4"/>`+cap(160,198,"eau : 1 g/cm³")+`<text class="cap mlab ml-none" x="160" y="24" text-anchor="middle">choisis un objet ci-dessous</text>`+
  PC_OBJ.map(([k,l,r])=>`<text class="cap mlab ml-${k}" x="160" y="24" text-anchor="middle">${l} : ${fmt(r)} g/cm³ ${r<1?"&lt; 1 → il flotte":"&gt; 1 → il coule"}</text>`).join(""),"Objet posé dans de l’eau",204),
  PC_OBJ.map(([k,l])=>sbtn(id,"obj",l,k)).join(""))}

const PH_EX=["acide de batterie","suc gastrique (estomac)","jus de citron","vinaigre, soda","jus de tomate","café noir","lait","eau pure","eau de mer","bicarbonate dans l’eau","eau savonneuse","ammoniaque ménagère","eau de Javel","déboucheur","soude concentrée"];
const phOut=v=>`pH ${v} → <b>${v<7?"acide":v===7?"neutre":"basique"}</b> · exemple : ${PH_EX[v]}${v<=2||v>=12?` · <span class="warn">dangereux : lunettes et gants !</span>`:""}`;

  `<text class="cap" x="60" y="146" text-anchor="middle">← acide</text><text class="cap" x="160" y="146" text-anchor="middle">neutre</text><text class="cap" x="262" y="146" text-anchor="middle">basique →</text>`+
  `<polygon class="phm" id="${id}-m" points="${20+v0*20-9},18 ${20+v0*20+9},18 ${20+v0*20},36"/>`,"Échelle de pH de 0 à 14",160)}</div>
  <div class="ohm-ctl"><label for="${id}-r"><b>pH de la solution</b></label><input type="range" id="${id}-r" data-pc="ph:${id}" min="0" max="14" step="1" value="${v0}"><p class="ohm-out" id="${id}-o">${phOut(v0)}</p></div>`}

const orOut=t=>`${t} s entre l’éclair et le tonnerre → d = 340 × ${t} = <b>${fmt(340*t)} m</b>, soit environ ${fmt(r3(340*t/1000))} km${t<=3?` · <span class="warn">orage tout proche : on se met à l’abri !</span>`:""}`;
function orageStage(id,t0=3){return `<div class="stage">${pfig(`<ellipse class="cloud" cx="70" cy="40" rx="50" ry="22"/><ellipse class="cloud" cx="105" cy="32" rx="34" ry="20"/><polyline class="bolt" points="78,58 66,92 84,92 70,132"/>`+
  `<line class="pground" x1="10" y1="170" x2="310" y2="170"/><circle class="phead" cx="270" cy="128" r="9"/><path class="pbody" d="M270,137 V156 M270,142 l-10,8 M270,142 l10,8 M270,156 l-8,13 M270,156 l8,13"/>`+
  `<path class="parrow" d="M76,152 H258 M250,146 l8,6 l-8,6 M84,146 l-8,6 l8,6"/><text class="cap" x="160" y="190" text-anchor="middle">lumière : quasi instantanée · son : 340 m/s</text>`,"Éclair et tonnerre",198)}</div>
  <div class="ohm-ctl"><label for="${id}-r"><b>Secondes comptées entre l’éclair et le tonnerre</b></label><input type="range" id="${id}-r" data-pc="orage:${id}" min="1" max="12" step="1" value="${t0}"><p class="ohm-out" id="${id}-o">${orOut(t0)}</p></div>`}
/* --- molécules (modèles éclatés) --- */
const AT={H:["ah",8],O:["ao",13],C:["ac",13],N:["an",13]};
const atom=(x,y,e)=>`<circle class="${AT[e][0]}" cx="${x}" cy="${y}" r="${AT[e][1]}"/><text class="atl ${e==="H"?"dk":""}" x="${x}" y="${y+4}" text-anchor="middle">${e}</text>`;
const mcap=(x,y,f,n)=>`<text class="cap pnom" x="${x}" y="${y}" text-anchor="middle">${f}</text>`+cap(x,y+16,n);
const molFig=()=>pfig(atom(55,44,"O")+atom(38,60,"H")+atom(72,60,"H")+mcap(55,92,"H₂O","eau")+
  atom(135,52,"O")+atom(160,52,"C")+atom(185,52,"O")+mcap(160,92,"CO₂","dioxyde de carbone")+
  atom(253,52,"O")+atom(278,52,"O")+mcap(265,92,"O₂","dioxygène")+
  atom(105,162,"C")+atom(105,140,"H")+atom(105,184,"H")+atom(83,162,"H")+atom(127,162,"H")+mcap(105,214,"CH₄","méthane")+

/* ---------- générateurs ---------- */
G.etat=()=>{const t=R(1,3);
  if(t===1){const T=pick([-18,-6,-2,4,12,25,37,60,85,98,105,120,150]),e=pcEtat(T);
    return mcq(`À ${fmt(T)} °C, sous la pression normale, l’eau pure est…`,{solide:"solide (glace)",liquide:"liquide",gaz:"gazeuse (vapeur)"}[e],["solide (glace)","liquide","gazeuse (vapeur)"],`La glace fond à 0 °C et l’eau bout à 100 °C. À ${fmt(T)} °C, l’eau est donc ${e==="gaz"?"gazeuse":e}.`,{sig:"et"+T})}
  if(t===2){const m=pick([50,120,250,300,500,750]);return inp(`On fait fondre ${m} g de glace. Quelle est la masse de l’eau liquide obtenue (en g) ?`,m,`Lors d’un changement d’état, la masse se conserve : ${m} g de glace donnent ${m} g d’eau.`,{unit:"g"})}
  const m=pick([100,200,500,1000]),v=r3(m/0.92);return mcq(`On congèle ${m} g d’eau liquide (${m} cm³). Que devient le volume ?`,"il augmente un peu",["il diminue","il ne change pas","il est divisé par deux"],`La masse reste ${m} g, mais la glace prend plus de place : environ ${fmt(Math.round(v))} cm³. C’est pour ça qu’une bouteille pleine éclate au congélateur !`)};
G.dissol=()=>{const t=R(1,2);
  if(t===1){const s=pick([5,10,15,20,25,30]),e=pick([100,150,200,250]);return inp(`On dissout ${s} g de sel dans ${e} g d’eau. Quelle est la masse de l’eau salée obtenue (en g) ?`,s+e,`Le sel a disparu à l’œil, mais il est toujours là : la masse se conserve. ${e} + ${s} = ${s+e} g.`,{unit:"g"})}
  const V=pick([0.5,1,2,3]),m=r3(360*V);return inp(`On peut dissoudre au maximum environ 360 g de sel dans 1 L d’eau. Combien peut-on en dissoudre au maximum dans ${fmt(V)} L (en g) ?`,m,`C’est proportionnel : 360 × ${fmt(V)} = ${fmt(m)} g. Au-delà, la solution est saturée et le sel tombe au fond.`,{unit:"g",tol:.5})};
const RHO_MAT=[["aluminium",2.7],["fer",7.9],["cuivre",8.9],["verre",2.5],["plomb",11.3],["or",19.3],["liège",0.24],["huile",0.92],["glace",0.92]];
G.rho=()=>{const t=R(1,4),[n,r]=pick(RHO_MAT),V=pick([10,20,50,100,200]),m=r3(r*V);
  if(t===1)return inp(`Un objet en ${n} a une masse de ${fmt(m)} g et un volume de ${V} cm³. Quelle est sa masse volumique (en g/cm³) ?`,r,`ρ = m ÷ V = ${fmt(m)} ÷ ${V} = ${fmt(r)} g/cm³.`,{unit:"g/cm³",tol:.01});
  if(t===2)return inp(`La masse volumique du ${n} est ${fmt(r)} g/cm³. Quelle est la masse de ${V} cm³ de ${n} (en g) ?`,m,`m = ρ × V = ${fmt(r)} × ${V} = ${fmt(m)} g.`,{unit:"g",tol:.01});
  if(t===3){const L=pick([1.5,2,5,10,25]);return inp(`Quelle est la masse de ${fmt(L)} L d’eau (en kg) ?`,L,`1 L d’eau a une masse de 1 kg. Donc ${fmt(L)} L pèsent ${fmt(L)} kg.`,{unit:"kg",tol:.01})}
  return mcq(`Un objet de ${fmt(m)} g occupe ${V} cm³. Posé dans l’eau, il…`,r<1?"flotte":"coule",[r<1?"coule":"flotte","fond comme de la glace","s’évapore"],`ρ = ${fmt(m)} ÷ ${V} = ${fmt(r)} g/cm³. L’eau fait 1 g/cm³ : ${r<1?"plus léger que l’eau à volume égal, il flotte":"plus lourd que l’eau à volume égal, il coule"}.`)};
G.vit=()=>{const t=R(1,4);
  if(t===1){const v=pick([40,60,80,90,120]),h=pick([1,2,3]);return inp(`Une voiture roule ${v*h} km en ${h} h. Quelle est sa vitesse moyenne (en km/h) ?`,v,`v = d ÷ t = ${v*h} ÷ ${h} = ${v} km/h.`,{unit:"km/h"})}
  if(t===2){const s=R(2,9);return inp(`Tu comptes ${s} secondes entre l’éclair et le tonnerre. À quelle distance est l’orage (en m) ? (son : 340 m/s)`,340*s,`d = v × t = 340 × ${s} = ${fmt(340*s)} m.`,{unit:"m"})}
  if(t===3){const v=pick([18,36,54,72,90,108]);return inp(`Un ballon frappé part à ${v} km/h. Quelle est sa vitesse en m/s ?`,v/3.6,`Pour passer des km/h aux m/s, on divise par 3,6 : ${v} ÷ 3,6 = ${fmt(v/3.6)} m/s.`,{unit:"m/s",tol:.01})}
  const v=pick([5,6,8,9]),s=pick([10,12,15,20]);return inp(`Un joueur court à ${v} m/s pendant ${s} s. Quelle distance parcourt-il (en m) ?`,v*s,`d = v × t = ${v} × ${s} = ${v*s} m.`,{unit:"m"})};

 etats:[["Quel état a une forme propre ?","le solide",["le liquide","le gaz","aucun"],"Un solide garde sa forme : un caillou reste un caillou, quel que soit le récipient."],["Un liquide prend…","la forme du récipient",["toujours la forme d’une boule","tout le volume disponible","une forme fixe"],"Un liquide a un volume propre, mais pas de forme propre."],["Un gaz occupe…","tout l’espace disponible",["seulement le fond du récipient","la moitié du récipient","aucune place"],"Les particules de gaz s’écartent et remplissent tout le récipient."],["La surface d’un liquide au repos est…","plane et horizontale",["toujours penchée","en forme de vague","verticale"],"Même si on penche le verre, la surface reste horizontale."],["Peut-on comprimer (écraser) un gaz ?","oui, ses particules sont très écartées",["non, jamais","seulement s’il est chaud","seulement l’air du frigo"],"Pense à une seringue bouchée remplie d’air : on peut pousser le piston."],["L’air a-t-il une masse ?","oui, environ 1,2 g par litre",["non, il est vide","seulement quand il y a du vent","seulement en hiver"],"Un ballon gonflé est un tout petit peu plus lourd qu’un ballon dégonflé."],["Dans un solide, les particules sont…","serrées et rangées",["écartées et rapides","serrées et en désordre","absentes"],"Elles vibrent sur place sans changer de place."]],
 chgt:[["Comment s’appelle le passage de solide à liquide ?","la fusion",["la solidification","la vaporisation","la liquéfaction"],"La glace fond : c’est la fusion."],["Comment s’appelle le passage de liquide à gaz ?","la vaporisation",["la fusion","la solidification","la liquéfaction"],"Elle peut se faire par ébullition (l’eau bout) ou par évaporation (le linge sèche)."],["La buée sur un miroir après la douche, c’est…","de la vapeur d’eau qui redevient liquide",["de la glace","de la fumée","du savon"],"Ce passage de gaz à liquide s’appelle la liquéfaction."],["À quelle température la glace fond-elle ?","0 °C",["100 °C","−10 °C","37 °C"],"Sous la pression normale, l’eau pure fond à 0 °C."],["À quelle température l’eau pure bout-elle ?","100 °C",["0 °C","50 °C","200 °C"],"Sous la pression normale. En haut de l’Everest, elle bout vers 70 °C !"],["Pendant que l’eau bout, sa température…","reste à 100 °C",["monte sans arrêt","baisse","monte de 10 °C par minute"],"C’est un palier : toute l’énergie sert à transformer le liquide en gaz."],["Quand de l’eau gèle, sa masse…","ne change pas",["augmente","diminue","double"],"La masse se conserve, mais le volume augmente un peu."],["Pourquoi un glaçon flotte-t-il ?","la glace est moins dense que l’eau liquide",["il contient de l’air","il est froid","il est vide à l’intérieur"],"La glace (0,92 g/cm³) est plus légère que l’eau (1 g/cm³) à volume égal."]],
 mel:[["Le sel mis dans l’eau disparaît : on dit qu’il est…","dissous",["fondu","évaporé","détruit"],"Il est toujours là, en tout petits morceaux invisibles : goûte l’eau, elle est salée !"],["L’eau et l’huile sont…","non miscibles : elles ne se mélangent pas",["miscibles","solubles","identiques"],"L’huile, moins dense, reste au-dessus de l’eau."],["Une eau boueuse qu’on laisse reposer : la terre tombe au fond. C’est…","la décantation",["la filtration","la distillation","la fusion"],"Les particules lourdes se déposent au fond."],["Pour séparer le sable de l’eau, on peut…","filtrer avec un filtre en papier",["ajouter du sel","chauffer à 0 °C","secouer très fort"],"Le filtre retient le sable, l’eau passe : c’est la filtration."],["Peut-on récupérer le sel dissous dans de l’eau salée ?","oui, en faisant évaporer l’eau",["non, il a disparu pour toujours","oui, en filtrant","oui, en congelant"],"C’est ce qu’on fait dans les marais salants."],["Une solution saturée, c’est…","une solution qui ne peut plus dissoudre de soluté",["une solution très froide","de l’eau pure","un mélange d’eau et d’huile"],"Le sel en trop reste au fond du verre."],["Dans l’eau salée, l’eau est…","le solvant",["le soluté","le filtre","le précipité"],"Le soluté (le sel) se dissout dans le solvant (l’eau)."],["Pour obtenir de l’eau très pure à partir d’eau salée, on fait…","une distillation",["une décantation","une filtration","une dissolution"],"On fait bouillir, puis on refroidit la vapeur : elle redevient de l’eau pure."]],
 rho:[["Quelle est la masse d’1 litre d’eau ?","1 kg",["1 g","10 kg","100 g"],"1 L = 1 000 cm³, et chaque cm³ d’eau a une masse de 1 g."],["La masse volumique, c’est…","la masse d’un volume donné de matière",["le volume d’un objet","la taille d’un objet","la vitesse d’un objet"],"ρ = m ÷ V, souvent en g/cm³ ou en kg/m³."],["Un objet flotte sur l’eau si sa masse volumique est…","inférieure à 1 g/cm³",["supérieure à 1 g/cm³","égale à 10 g/cm³","n’importe laquelle"],"L’eau fait 1 g/cm³ : ce qui est moins dense flotte."],["Qu’est-ce qui est le plus lourd : 1 kg de plumes ou 1 kg de plomb ?","ils ont la même masse",["le plomb","les plumes","ça dépend du vent"],"Le piège ! 1 kg reste 1 kg ; mais les plumes prennent beaucoup plus de place."],["Avec quel instrument mesure-t-on une masse ?","une balance",["une éprouvette graduée","un thermomètre","un chronomètre"],"Le volume d’un liquide se mesure avec une éprouvette graduée."],["Comment mesurer le volume d’un caillou ?","le plonger dans une éprouvette et lire la hausse du niveau",["le peser","mesurer sa température","le couper en deux"],"Le volume d’eau déplacée est égal au volume du caillou."],["Un énorme bateau en acier flotte parce que…","il est creux : en moyenne il est moins dense que l’eau",["l’acier est plus léger que l’eau","l’eau de mer est solide","il a un moteur"],"La coque contient beaucoup d’air : la masse volumique moyenne du bateau est inférieure à celle de l’eau."]],
 atom:[["Toute la matière est faite de…","atomes",["cellules","pixels","cailloux"],"Les atomes sont si petits qu’il en faut des millions alignés pour faire 1 mm."],["La molécule d’eau H₂O contient…","2 atomes d’hydrogène et 1 atome d’oxygène",["2 atomes d’oxygène et 1 d’hydrogène","3 atomes de carbone","1 seul atome"],"Le 2 en petit indique deux atomes H."],["Quel gaz est le plus abondant dans l’air ?","le diazote N₂ (environ 78 %)",["le dioxygène O₂","le dioxyde de carbone CO₂","l’hélium"],"L’air contient environ 78 % de diazote et 21 % de dioxygène."],["Quelle est la formule du dioxyde de carbone ?","CO₂",["H₂O","O₂","CH₄"],"1 atome de carbone et 2 atomes d’oxygène."],["Le symbole O représente l’atome…","d’oxygène",["d’or","d’hydrogène","de carbone"],"L’or a pour symbole Au (du latin aurum)."],["Pour qu’un feu brûle, il faut…","un combustible, un comburant (le dioxygène) et une source de chaleur",["seulement du bois","de l’eau et du sable","du dioxyde de carbone"],"C’est le triangle du feu : retire un côté et le feu s’éteint."],["Quand le carbone brûle, il se forme…","du dioxyde de carbone",["de l’eau pure","du dioxygène","de l’or"],"C + O₂ → CO₂ : les atomes se réarrangent."],["Pendant une transformation chimique, les atomes…","se réarrangent, aucun ne disparaît",["disparaissent","se multiplient","changent tous de couleur"],"Rien ne se perd, rien ne se crée, tout se transforme (Lavoisier)."],["Comment reconnaît-on le dioxyde de carbone ?","il trouble l’eau de chaux",["il colore l’eau en bleu","il sent la rose","il fait briller une allumette"],"Le test à l’eau de chaux est le test classique du CO₂."]],
 ph:[["Une solution de pH 3 est…","acide",["neutre","basique","salée"],"pH inférieur à 7 : acide."],["L’eau pure a un pH de…","7",["0","14","1"],"7 : c’est neutre, ni acide ni basique."],["L’eau de Javel est…","basique",["acide","neutre","sucrée"],"Son pH est d’environ 12 : très basique et dangereuse."],["Plus une solution est acide, plus son pH est…","petit",["grand","proche de 7","égal à 14"],"Le jus de citron (pH 2) est plus acide que le vinaigre (pH 3)."],["Si on ajoute beaucoup d’eau à du vinaigre, son pH…","se rapproche de 7",["descend vers 0","monte jusqu’à 14","ne change pas"],"Diluer un acide le rend moins acide."],["Avec quoi peut-on mesurer un pH ?","du papier pH",["un thermomètre","une balance","un aimant"],"Le papier pH change de couleur selon l’acidité."],["Pourquoi ne faut-il jamais mélanger eau de Javel et produit acide ?","cela dégage un gaz toxique (le chlore)",["cela fait de la mousse inoffensive","cela devient neutre","cela sent bon"],"C’est une vraie cause d’accidents domestiques : jamais de mélange de produits ménagers."],["Le jus de citron est…","acide",["basique","neutre","un métal"],"Son pH est d’environ 2."]],
 vit:[["La formule de la vitesse est…","v = d ÷ t",["v = d × t","v = t ÷ d","v = d + t"],"La vitesse, c’est la distance parcourue divisée par la durée."],["Qu’est-ce qui va le plus vite ?","la lumière",["le son","un avion de chasse","une fusée"],"La lumière parcourt environ 300 000 km chaque seconde."],["Dans l’air, le son se déplace à environ…","340 m/s",["300 000 km/s","3 m/s","34 km/s"],"C’est environ 1 km toutes les 3 secondes."],["Pourquoi voit-on l’éclair avant d’entendre le tonnerre ?","la lumière va beaucoup plus vite que le son",["l’éclair arrive en premier dans le ciel","le tonnerre est plus loin","nos oreilles sont lentes"],"Les deux partent en même temps, mais le son est un million de fois plus lent."],["Le son peut-il se propager dans le vide de l’espace ?","non, il a besoin de matière",["oui, encore plus vite","oui, mais moins fort","seulement la nuit"],"Dans l’espace, une explosion serait silencieuse."],["Combien de temps met la lumière du Soleil pour arriver sur Terre ?","environ 8 minutes",["1 seconde","1 jour","1 an"],"Le Soleil est à 150 millions de km : 150 000 000 ÷ 300 000 ≈ 500 s."],["Pour passer des km/h aux m/s, on…","divise par 3,6",["multiplie par 3,6","divise par 60","multiplie par 1 000"],"1 km/h = 1 000 m ÷ 3 600 s."],["Un sprinteur fait 100 m en 10 s. Sa vitesse est…","10 m/s",["100 m/s","1 m/s","1 000 m/s"],"v = 100 ÷ 10 = 10 m/s, soit 36 km/h."]]
};

const PCLESS=[
 {id:"pc_etats",sub:"pc",lvl:"CM2",title:"Les trois états de la matière",desc:"Solide, liquide, gaz : chauffe et regarde",gen:G.etat,bank:PB.etats,steps:[
  {t:"Chauffe l’eau !",h:`<p>Fais glisser la température et regarde les particules d’eau.</p>`+etatStage("pc1",-10),say:"Toute la matière est faite de minuscules particules. Ici, ce sont des particules d’eau. Fais glisser la température. En dessous de zéro degré, elles sont rangées et serrées : c’est de la glace. Entre zéro et cent degrés, elles restent serrées mais glissent en désordre : c’est de l’eau liquide. Au-dessus de cent degrés, elles s’écartent et filent partout : c’est de la vapeur."},
  {t:"Les trois états",h:ltab([["État","Forme propre ?","Volume propre ?","Particules"],["solide","oui","oui","serrées, rangées"],["liquide","non : prend la forme du récipient","oui","serrées, en désordre"],["gaz","non","non : occupe tout l’espace","écartées, très rapides"]])+KEY("La surface d’un liquide au repos est toujours <b>plane et horizontale</b>. Un gaz se comprime, un liquide presque pas."),say:"Un solide a une forme propre et un volume propre. Un liquide a un volume propre, mais il prend la forme de son récipient, et sa surface au repos est toujours plane et horizontale. Un gaz n’a ni forme ni volume propre : il occupe tout l’espace. Et comme ses particules sont écartées, on peut le comprimer, comme l’air dans une pompe à vélo."},
  {t:"L’air est de la matière",h:`<p>Un ballon de foot gonflé est un peu plus lourd que dégonflé : <b>1 litre d’air pèse environ 1,2 g</b>.</p>`+KEY("Un gaz est invisible, mais c’est de la matière : il a une masse et il occupe de la place."),say:"Même invisible, l’air est de la matière. Un litre d’air a une masse d’environ un virgule deux gramme. Pèse un ballon de foot dégonflé, puis gonflé : il est un tout petit peu plus lourd. L’air a une masse, et il prend de la place."}]},
 {id:"pc_chgt",sub:"pc",lvl:"6e",title:"Les changements d’état",desc:"Fusion, ébullition, paliers et buée",gen:G.etat,bank:PB.chgt,steps:[
  {t:"Les noms des passages",h:ltab([["Passage","Nom","Exemple"],["solide → liquide","fusion","le glaçon fond"],["liquide → solide","solidification","l’eau gèle"],["liquide → gaz","vaporisation","l’eau bout, le linge sèche"],["gaz → liquide","liquéfaction","la buée sur le miroir"],["solide → gaz","sublimation","la neige disparaît au soleil très froid"]]),say:"Chaque changement d’état a un nom. Solide vers liquide, c’est la fusion. Liquide vers solide, la solidification. Liquide vers gaz, la vaporisation, par ébullition ou par évaporation. Gaz vers liquide, la liquéfaction : c’est la buée sur le miroir après la douche."},
  {t:"Le palier de température",h:etatStage("pc2",95)+KEY("Pour un corps pur comme l’eau, la température <b>reste constante</b> pendant le changement d’état : 0 °C pour la fusion, 100 °C pour l’ébullition."),say:"Mets le curseur exactement à cent degrés. Pendant que l’eau bout, sa température ne monte plus : elle reste à cent degrés tant qu’il reste du liquide. On appelle cela un palier. Toute l’énergie du feu sert à transformer le liquide en vapeur. C’est pareil à zéro degré, pendant que la glace fond."},
  {t:"Masse et volume",h:EX(CALC("500 g d’eau liquide  →  congélateur  →  500 g de glace\nvolume : 500 cm³  →  environ 543 cm³"))+KEY("Pendant un changement d’état, la <b>masse se conserve</b>. Le volume, lui, peut changer : l’eau qui gèle prend plus de place."),say:"Pendant un changement d’état, la masse ne change pas : cinq cents grammes d’eau donnent cinq cents grammes de glace. Mais le volume change : l’eau qui gèle prend un peu plus de place. C’est pour ça qu’une bouteille d’eau pleine éclate au congélateur, et que les glaçons flottent."}]},
 {id:"pc_mel",sub:"pc",lvl:"5e",title:"Mélanges et solutions",desc:"Dissoudre, filtrer, distiller",gen:G.dissol,bank:PB.mel,steps:[
  {t:"Dissoudre",h:`<p>Le sel versé dans l’eau semble disparaître : il est <b>dissous</b>. Le sel est le <b>soluté</b>, l’eau le <b>solvant</b>, l’eau salée la <b>solution</b>.</p>`+EX(CALC("10 g de sel + 200 g d’eau = 210 g d’eau salée"))+KEY("Lors d’une dissolution, la masse totale se conserve."),say:"Verse du sel dans l’eau et remue : il semble disparaître. En réalité, il s’est dissous en minuscules morceaux invisibles. Le sel est le soluté, l’eau est le solvant, et le mélange obtenu est une solution. La preuve que le sel est toujours là : la masse se conserve. Dix grammes de sel plus deux cents grammes d’eau donnent deux cent dix grammes d’eau salée."},
  {t:"Saturation et miscibilité",h:ltab([["Situation","Ce qu’on observe"],["trop de sel (plus de 360 g par litre)","la solution est <b>saturée</b> : le sel en trop reste au fond"],["eau + sirop","<b>miscibles</b> : un seul liquide"],["eau + huile","<b>non miscibles</b> : l’huile reste au-dessus"]]),say:"On ne peut pas dissoudre une quantité infinie de sel : environ trois cent soixante grammes par litre d’eau, pas plus. Au-delà, la solution est saturée et le sel tombe au fond. Pour les liquides, on parle de miscibilité : l’eau et le sirop se mélangent, ils sont miscibles. L’eau et l’huile, non : l’huile reste au-dessus."},
  {t:"Séparer un mélange",h:ltab([["Technique","Ce qu’elle sépare"],["décantation","on laisse reposer : le solide lourd tombe au fond"],["filtration","un filtre retient les grains solides, le liquide passe"],["évaporation","on récupère le solide dissous (marais salants)"],["distillation","on chauffe, puis on refroidit la vapeur : on obtient de l’eau pure"]])+KEY("Une eau limpide n’est pas forcément pure : elle peut contenir des choses dissoutes."),say:"Pour séparer un mélange, on a plusieurs techniques. La décantation : on laisse reposer, le solide tombe au fond. La filtration : le filtre retient les grains. L’évaporation : on fait partir l’eau pour récupérer le sel, comme dans les marais salants. Et la distillation : on fait bouillir, puis on refroidit la vapeur, et on obtient de l’eau pure. Attention : une eau limpide n’est pas forcément pure."}]},
 {id:"pc_rho",sub:"pc",lvl:"4e",title:"Masse volumique : flotte ou coule ?",desc:"ρ = m ÷ V, et pourquoi un bateau flotte",gen:G.rho,bank:PB.rho,steps:[
  {t:"Flotte ou coule ?",h:`<p>Pose un objet dans l’eau.</p>`+rhoStage("pc3"),say:"Pose les objets un par un dans l’eau. Le liège et le bois flottent. Le glaçon flotte aussi, mais presque entièrement sous l’eau. La pierre et le clou coulent. Ce qui compte, ce n’est pas la taille de l’objet, mais sa masse volumique, comparée à celle de l’eau : un gramme par centimètre cube."},
  {t:"La formule",h:`<p class="bignum small">ρ = m ÷ V</p>`+ltab([["ρ (rho)","m","V"],["masse volumique en g/cm³","masse en g","volume en cm³"]])+ltab([["Matière","ρ (g/cm³)"],["liège","0,24"],["glace","0,92"],["eau","1"],["aluminium","2,7"],["fer","7,9"],["or","19,3"]])+KEY("1 L d’eau = 1 000 cm³ = <b>1 kg</b>. Un objet flotte si sa masse volumique est inférieure à celle du liquide."),say:"La masse volumique se note rho, une lettre grecque. C’est la masse divisée par le volume. Pour l’eau, elle vaut un gramme par centimètre cube : un litre d’eau a donc une masse d’un kilogramme. Le fer fait sept virgule neuf, il coule. Le liège fait zéro virgule vingt-quatre, il flotte."},
  {t:"Le paquebot en acier",h:EX(`<p>Un paquebot pèse des milliers de tonnes, et l’acier (7,9 g/cm³) coule. Mais la coque est <b>creuse et pleine d’air</b> : la masse volumique <b>moyenne</b> du bateau est plus petite que celle de l’eau.</p>`)+CALC("Pierre : m = 52 g, V = 20 cm³\nρ = 52 ÷ 20 = 2,6 g/cm³  > 1  → elle coule"),say:"Comment un énorme bateau en acier peut-il flotter ? Parce que sa coque est creuse et remplie d’air. Si on calcule sa masse totale divisée par tout son volume, on trouve moins d’un gramme par centimètre cube. Pour un caillou de cinquante-deux grammes et vingt centimètres cubes, on trouve deux virgule six : il coule."}]},
 {id:"pc_atomes",sub:"pc",lvl:"4e",title:"Atomes et molécules",desc:"H₂O, CO₂ et le triangle du feu",bank:PB.atom,steps:[
  {t:"Les briques de la matière",h:molFig()+ltab([["Atome","Symbole","Couleur du modèle"],["hydrogène","H","blanc"],["carbone","C","noir"],["oxygène","O","rouge"],["azote","N","bleu"]]),say:"Toute la matière est faite d’atomes, des briques minuscules. Chaque atome a un symbole : H pour l’hydrogène, C pour le carbone, O pour l’oxygène, N pour l’azote. En s’assemblant, ils forment des molécules. La molécule d’eau, H deux O, contient deux atomes d’hydrogène et un atome d’oxygène."},
  {t:"L’air qu’on respire",h:ltab([["Gaz de l’air","Formule","Proportion"],["diazote","N₂","environ 78 %"],["dioxygène","O₂","environ 21 %"],["autres (argon, CO₂…)","—","environ 1 %"]])+KEY("Le petit chiffre en bas indique le nombre d’atomes : CO₂ = 1 carbone + 2 oxygènes."),say:"L’air est un mélange de gaz. Environ soixante-dix-huit pour cent de diazote, et vingt et un pour cent de dioxygène, celui que nous respirons. Dans une formule, le petit chiffre en bas indique le nombre d’atomes : C O deux, c’est un carbone et deux oxygènes."},
  {t:"La combustion",h:KEY("Triangle du feu : <b>combustible</b> + <b>comburant</b> (le dioxygène) + <b>chaleur</b>. Retire un côté, le feu s’éteint.")+EX(CALC("carbone + dioxygène → dioxyde de carbone\n   C    +    O₂     →        CO₂"))+`<p>Les atomes se <b>réarrangent</b>, aucun ne disparaît. « Rien ne se perd, rien ne se crée, tout se transforme » (Lavoisier). Le CO₂ se reconnaît car il <b>trouble l’eau de chaux</b>.</p>`,say:"Pour faire du feu, il faut trois choses : un combustible, comme le bois ou le charbon, un comburant, le dioxygène de l’air, et de la chaleur pour démarrer. C’est le triangle du feu. Quand le carbone brûle, il réagit avec le dioxygène et forme du dioxyde de carbone. Les atomes se réarrangent, mais aucun ne disparaît. Comme disait Lavoisier : rien ne se perd, rien ne se crée, tout se transforme."}]},
 {id:"pc_ph",sub:"pc",lvl:"4e",title:"Acides et bases : le pH",desc:"De 0 à 14, du citron à l’eau de Javel",bank:PB.ph,steps:[
  {t:"L’échelle de pH",h:`<p>Fais glisser le curseur de 0 à 14.</p>`+phStage("pc4",7),say:"Le pH mesure si une solution est acide ou basique. L’échelle va de zéro à quatorze. Au milieu, sept, c’est neutre, comme l’eau pure. En dessous de sept, c’est acide : le citron, le vinaigre, le soda. Au-dessus de sept, c’est basique : l’eau savonneuse, l’eau de Javel. Plus on s’éloigne de sept, plus la solution est dangereuse."},
  {t:"Mesurer et diluer",h:ltab([["pH","Nature","Exemples"],["0 à 6","acide","citron (2), vinaigre (3), café (5)"],["7","neutre","eau pure"],["8 à 14","basique","eau de mer (8), savon (10), Javel (12)"]])+KEY("On mesure le pH avec du <b>papier pH</b>. Si on dilue un acide dans l’eau, son pH <b>se rapproche de 7</b>."),say:"On mesure le pH avec du papier pH, qui change de couleur. Si on verse un acide dans beaucoup d’eau, on le dilue : il devient moins acide et son pH se rapproche de sept."},
  {t:"Sécurité !",h:`<p class="warn">Lunettes et gants pour manipuler les acides et les bases concentrés.</p>`+KEY("Ne <b>jamais</b> mélanger l’eau de Javel avec un produit acide (détartrant, vinaigre) : il se dégage un gaz toxique, le chlore."),say:"Attention, c’est important. Les acides et les bases très concentrés brûlent la peau et les yeux : on porte des lunettes et des gants. Et on ne mélange jamais l’eau de Javel avec un produit acide, comme un détartrant : cela dégage du chlore, un gaz toxique."}]},
 {id:"pc_vit",sub:"pc",lvl:"5e",title:"Vitesse, lumière et son",desc:"v = d ÷ t et la distance de l’orage",gen:G.vit,bank:PB.vit,steps:[
  {t:"La vitesse",h:`<p class="bignum small">v = d ÷ t</p>`+EX(CALC("Un sprinteur fait 100 m en 10 s\nv = 100 ÷ 10 = 10 m/s\n10 m/s × 3,6 = 36 km/h"))+KEY("Pour passer des m/s aux km/h, on multiplie par 3,6. Dans l’autre sens, on divise par 3,6."),say:"La vitesse, c’est la distance parcourue divisée par la durée. Un sprinteur qui fait cent mètres en dix secondes court à dix mètres par seconde. Pour convertir en kilomètres par heure, on multiplie par trois virgule six : trente-six kilomètres par heure. C’est à peu près la pointe de vitesse d’un attaquant rapide sur un terrain de foot."},

const S11=5.7,TPX=x=>20+x*S11,TPY=y=>20+y*S11;
const mir11=o=>Object.fromEntries(Object.entries(o).map(([k,[x,y]])=>["b"+k.slice(1),[105-x,68-y]]));
const OFF=ids=>Object.fromEntries(ids.map(k=>[k,null]));
const T433={a1:[4,34],a3:[22,8],a5:[17,25],a4:[17,43],a2:[22,60],a6:[30,34],a8:[40,23],a10:[40,45],a11:[50,8],a9:[52,34],a7:[50,60]};
const B442={b1:[101,34],b2:[84,10],b5:[86,26],b4:[86,42],b3:[84,58],b7:[72,12],b8:[71,27],b6:[71,41],b11:[72,56],b10:[60,29],b9:[60,39]};
const P235={a1:[12,34],a5:[42,25],a4:[42,43],a3:[53,24],a6:[52,34],a2:[53,44],a11:[78,4],a8:[79,19],a9:[84,34],a10:[79,49],a7:[78,64]};
const LANES=[[0,13.84,"couloir"],[13.84,11,"demi-espace"],[24.84,18.32,"axe"],[43.16,11,"demi-espace"],[54.16,13.84,"couloir"]];
const laneZ=(hs)=>LANES.map(([y,h,t],i)=>({r:[0,y,105,h],k:(i===1||i===3)?"good":"info",t:hs&&!(i===1||i===3)?"":t}));
function tacPitch(id){let s="";const W=105*S11,H=68*S11;for(let i=0;i<7;i++)s+=`<rect x="${20+i*W/7}" y="20" width="${W/7+.5}" height="${H}" fill="${i%2?"#2f9e44":"#37b24d"}"/>`;
  const L=`stroke="#fff" stroke-width="2.2" fill="none" opacity=".9"`,X=TPX,Y=TPY;
  s+=`<rect x="20" y="20" width="${W}" height="${H}" ${L}/><line x1="${X(52.5)}" y1="20" x2="${X(52.5)}" y2="${20+H}" ${L}/><circle cx="${X(52.5)}" cy="${Y(34)}" r="${9.15*S11}" ${L}/><circle cx="${X(52.5)}" cy="${Y(34)}" r="3" fill="#fff"/>`;
  for(const [g,d] of [[0,1],[105,-1]]){s+=`<path d="M${X(g)},${Y(13.84)} H${X(g+d*16.5)} V${Y(54.16)} H${X(g)}" ${L}/><path d="M${X(g)},${Y(24.84)} H${X(g+d*5.5)} V${Y(43.16)} H${X(g)}" ${L}/><circle cx="${X(g+d*11)}" cy="${Y(34)}" r="2.6" fill="#fff"/>`;
    s+=`<path d="M${X(g+d*16.5)},${Y(26.69)} A${9.15*S11},${9.15*S11} 0 0 ${d>0?1:0} ${X(g+d*16.5)},${Y(41.31)}" ${L}/>`;
    s+=`<rect x="${d>0?X(g)-11:X(g)}" y="${Y(30.34)}" width="11" height="${7.32*S11}" fill="#fff" opacity=".85"/>`}
  s+=`<defs>${[["p","#ffe14d"],["r","#ffffff"],["x","#ff6b6b"]].map(([k,c])=>`<marker id="tm${k}-${id}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker>`).join("")}</defs>`;
  return s}
function tacBoard(id,cfg){const ids=[...new Set(cfg.frames.flatMap(f=>Object.keys(f.p||{})))];let cur=OFF(ids),ball=[52.5,34];
  const frames=cfg.frames.map(f=>{cur={...cur,...(f.p||{})};if(f.b!==undefined)ball=f.b;return {...f,P:{...cur},B:ball}});
  DEMOS[id]={...cfg,frames,ids,i:-1};
  const pl=ids.map(k=>`<g class="pl ${k[0]} ${k.slice(1)==="1"?"gk":""}" data-pl="${k}"><circle r="11"/><text>${(cfg.lab&&cfg.lab[k])||k.slice(1)}</text></g>`).join("");
  const btns=cfg.btns?cfg.btns.map(([k,l])=>`<button class="btn small ${k?"ghost":""}" data-tacgo="${id}:${k}">${l}</button>`).join(""):
    `<button class="btn small" data-tacplay="${id}">▶ Jouer l’action</button><button class="btn ghost small" data-tacnext="${id}">Image suivante</button>`;
  return `<div class="tac inst" id="tac-${id}"><svg class="tfig" viewBox="0 0 639 428" role="img" aria-label="${esc(cfg.alt||"Terrain de football vu du ciel")}">${tacPitch(id)}<g class="tz"></g><g class="ta"></g>${pl}<g class="tball"><circle r="5.5"/></g><text class="tgoal" x="320" y="226" text-anchor="middle">BUT !</text></svg><p class="tacnote" aria-live="polite"></p></div><div class="tools stage-tools">${btns}</div>`}
function tacPos(F,r){if(typeof r==="string"){const p=F.P[r];return p?[p[0],p[1]]:null}return r}
function tacBallPos(F){if(typeof F.B==="string"){const p=F.P[F.B];return p?[p[0]+1.6,p[1]+1.3]:[52.5,34]}return F.B}
function tacShow(id,k,inst){const D=DEMOS[id],root=document.getElementById("tac-"+id);if(!D||!root)return;const F=D.frames[k];if(!F)return;D.i=k;
  root.classList.toggle("inst",!!inst);root.style.setProperty("--td",(F.d||900)+"ms");
  root.querySelectorAll(".pl").forEach(g=>{const p=F.P[g.dataset.pl];g.classList.toggle("off",!p);g.classList.toggle("hi",(F.h||[]).includes(g.dataset.pl));if(p)g.style.transform=`translate(${TPX(p[0])}px,${TPY(p[1])}px)`});
  const bp=tacBallPos(F),tb=root.querySelector(".tball");tb.style.transform=`translate(${TPX(bp[0])}px,${TPY(bp[1])}px)`;tb.classList.toggle("off",!!F.nob);
  let z="";for(const o of F.z||[]){
    if(o.r){const [x,y,w,h]=o.r;z+=`<rect class="zn ${o.k||"info"}" x="${TPX(x)}" y="${TPY(y)}" width="${w*S11}" height="${h*S11}" rx="6"/>`;if(o.t)z+=`<text class="zt ${o.sm?"sm":""}" x="${TPX(x+w/2)}" y="${TPY(y+h/2)+6}" text-anchor="middle">${o.t}</text>`}
    if(o.vl!=null){z+=`<line class="vl ${o.k||""}" x1="${TPX(o.vl)}" y1="20" x2="${TPX(o.vl)}" y2="${TPY(68)}"/>`;if(o.t)z+=`<text class="zt sm" x="${TPX(o.vl)}" y="${TPY(o.ty??3)}" text-anchor="middle">${o.t}</text>`}
    if(o.tri){const pts=o.tri.map(r=>tacPos(F,r)).filter(Boolean);z+=`<polygon class="tri" points="${pts.map(p=>TPX(p[0])+","+TPY(p[1])).join(" ")}"/>`}
    if(o.ln){const [r1,r2,w]=o.ln,p=tacPos(F,r1),q=tacPos(F,r2);if(p&&q)z+=`<line class="net" x1="${TPX(p[0])}" y1="${TPY(p[1])}" x2="${TPX(q[0])}" y2="${TPY(q[1])}" style="stroke-width:${w}px"/>`}
    if(o.lab){const [r,dx,dy,t,c]=o.lab,p=tacPos(F,r);if(p)z+=`<text class="zt sm ${c||""}" x="${TPX(p[0]+dx)}" y="${TPY(p[1]+dy)}" text-anchor="middle">${t}</text>`}}
  root.querySelector(".tz").innerHTML=z;
  let a="";for(const [f,t,kind] of F.a||[]){const p=tacPos(F,f),q=tacPos(F,t);if(!p||!q)continue;const x1=TPX(p[0]),y1=TPY(p[1]),x2=TPX(q[0]),y2=TPY(q[1]),L=Math.hypot(x2-x1,y2-y1)||1,s1=14/L,s2=(typeof t==="string"?16:4)/L;
    const ax=x1+(x2-x1)*s1,ay=y1+(y2-y1)*s1,bx=x2-(x2-x1)*s2,by=y2-(y2-y1)*s2,k=kind||"pass",m=k==="run"?"r":k==="block"?"x":"p";
    a+=`<line class="ar ${k}" x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" marker-end="url(#tm${m}-${id})"/>`;
    if(k==="block"){const mx=(x1+x2)/2,my=(y1+y2)/2;a+=`<path class="ar blockx" d="M${mx-8},${my-8} L${mx+8},${my+8} M${mx+8},${my-8} L${mx-8},${my+8}"/>`}}
  root.querySelector(".ta").innerHTML=a;
  root.querySelector(".tacnote").innerHTML=F.n?`<b>${k+1}/${D.frames.length}</b> ${F.n}`:"";
  const g=root.querySelector(".tgoal");g.classList.remove("on");if(F.goal&&!inst){void g.getBoundingClientRect();g.classList.add("on");beep([[523,0,.12],[659,.12,.12],[784,.24,.3]])}
  const nb=document.querySelector(`[data-tacnext="${id}"]`);if(nb)nb.textContent=k>=D.frames.length-1?"Revoir depuis le début":"Image suivante";
  document.querySelectorAll(`[data-tacgo^="${id}:"]`).forEach(b=>b.classList.toggle("ghost",+b.dataset.tacgo.split(":")[1]!==k))}
function tacPlay(id){const D=DEMOS[id];if(!D)return;clearDemos();tacShow(id,0,true);let t=1800;
  D.frames.forEach((F,k)=>{if(!k)return;demoTimers.push(setTimeout(()=>tacShow(id,k),t));t+=(F.d||900)+(F.w||2100)})}
function tacNext(id){const D=DEMOS[id];if(!D)return;clearDemos();if(D.i>=D.frames.length-1)return tacShow(id,0,true);tacShow(id,D.i+1)}

/* ---------- xG : carte des tirs interactive ---------- */
/* modèle simplifié : logistique sur l’angle de tir (vers les poteaux) et la distance au centre du but */
function shotAngle(lat,d){return Math.abs(Math.atan2(lat+3.66,d)-Math.atan2(lat-3.66,d))}
function xgOf(lat,d){if(d<=0)return 0;const z=-3.43+4.2*shotAngle(lat,d)-.0384*Math.hypot(lat,d);return Math.min(.75,1/(1+Math.exp(-z)))}
const XS=8,XX=l=>20+l*XS,XY=d=>24+d*XS;
const XGS={};
function xgMap(id){XGS[id]=[];const L=`stroke="#fff" stroke-width="2.2" fill="none" opacity=".9"`;
  let s=`<rect x="20" y="24" width="${68*XS}" height="${40*XS}" fill="#37b24d"/>`;for(let i=0;i<5;i++)if(i%2)s+=`<rect x="20" y="${24+i*8*XS}" width="${68*XS}" height="${8*XS}" fill="#2f9e44"/>`;
  s+=`<line x1="20" y1="24" x2="${XX(68)}" y2="24" ${L}/><path d="M${XX(13.84)},24 V${XY(16.5)} H${XX(54.16)} V24" ${L}/><path d="M${XX(24.84)},24 V${XY(5.5)} H${XX(43.16)} V24" ${L}/><circle cx="${XX(34)}" cy="${XY(11)}" r="3" fill="#fff"/><path d="M${XX(26.69)},${XY(16.5)} A${9.15*XS},${9.15*XS} 0 0 0 ${XX(41.31)},${XY(16.5)}" ${L}/><rect x="${XX(30.34)}" y="8" width="${7.32*XS}" height="16" fill="#fff" opacity=".9"/>`;
  return `<div class="xgw" id="xg-${id}"><svg class="xgsvg" data-xg="${id}" viewBox="0 0 584 368" role="img" aria-label="Moitié de terrain : touche pour placer un tir">${s}<g class="xgshots"></g><g class="xgcur"></g></svg>
  <p class="xgout" id="xgout-${id}"><b>Touche le terrain</b> pour placer un tir : je calcule ses chances de but.</p></div>
  <div class="tools stage-tools"><button class="btn ghost small" data-xgreset="${id}">Effacer les tirs</button></div>`}
function xgColor(x){return x>=.3?"#ffe14d":x>=.1?"#ffa94d":"#ff6b6b"}
function xgTap(svg,e){const id=svg.dataset.xg,pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());
  const lat=(q.x-20)/XS,d=(q.y-24)/XS;if(lat<0||lat>68||d<.5||d>40)return;const off=lat-34,x=xgOf(off,d),dist=Math.hypot(off,d),ang=shotAngle(off,d)*180/Math.PI;
  XGS[id].push(x);const tot=XGS[id].reduce((a,b)=>a+b,0);
  svg.querySelector(".xgcur").innerHTML=`<polygon points="${XX(lat)},${XY(d)} ${XX(30.34)},24 ${XX(37.66)},24" fill="rgba(255,225,77,.28)" stroke="#ffe14d" stroke-width="1.5"/>`;
  svg.querySelector(".xgshots").insertAdjacentHTML("beforeend",`<g><circle cx="${XX(lat)}" cy="${XY(d)}" r="${6+x*26}" fill="${xgColor(x)}" fill-opacity=".8" stroke="#1b1b1b" stroke-width="1.5"/><text class="xgt" x="${XX(lat)}" y="${XY(d)-10-x*26}" text-anchor="middle">${fmt(Math.round(x*100)/100)}</text></g>`);
  document.getElementById("xgout-"+id).innerHTML=`Distance <b>${Math.round(dist)} m</b> · angle de tir <b>${Math.round(ang)}°</b> · xG <b>${fmt(Math.round(x*100)/100)}</b> : environ <b>${Math.round(x*100)} buts sur 100</b> tirs comme celui-là.<br><span class="muted">Tes ${XGS[id].length} tir${XGS[id].length>1?"s":""} : xG total = <b>${fmt(Math.round(tot*100)/100)}</b> but${tot>=2?"s":""} attendu${tot>=2?"s":""}.</span>`;
  beep([[300+x*900,0,.08]])}

/* ---------- probabilités : loi de Poisson et simulation de matchs ---------- */
const POI={};
const fact=n=>n<2?1:n*fact(n-1);
const poisP=(l,k)=>Math.exp(-l)*l**k/fact(k);
function poisSample(l){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1}
function poisOutcome(a,b){let w=0,dr=0,lo=0;for(let i=0;i<=10;i++)for(let j=0;j<=10;j++){const p=poisP(a,i)*poisP(b,j);if(i>j)w+=p;else if(i===j)dr+=p;else lo+=p}return [w,dr,lo]}
function poisWidget(id,a,b){POI[id]={a,b,tally:[0,0,0],n:0};
  const sl=(k,v,c)=>`<label class="pl-sl"><span><b style="color:${c}">xG ${k==="a"?"bleus":"rouges"}</b> <span id="pv-${id}-${k}">${fmt(v)}</span></span><input type="range" min="0.2" max="3.5" step="0.1" value="${v}" data-pois="${id}:${k}"></label>`;
  return `<div class="poi" id="poi-${id}">${sl("a",a,"#1c7ed6")}${sl("b",b,"#e03131")}
   <div class="poibars" id="pb-${id}"></div>
   <div class="poitab" id="pt-${id}"></div>
   <div class="poisim"><div class="poiscore" id="ps-${id}">– : –</div><p class="muted" id="pn-${id}">Lance des matchs pour voir le hasard en action.</p></div></div>
  <div class="tools stage-tools"><button class="btn small" data-poisim="${id}:1">Jouer 1 match</button><button class="btn ghost small" data-poisim="${id}:100">Jouer 100 matchs</button><button class="btn ghost small" data-poisim="${id}:1000">Jouer 1000 matchs</button></div>`}
function poisRender(id){const S=POI[id];if(!S||!document.getElementById("poi-"+id))return;const [w,d,l]=poisOutcome(S.a,S.b),pc=x=>Math.round(x*100);
  document.getElementById("pb-"+id).innerHTML=[["Victoire bleue",w,"#1c7ed6"],["Match nul",d,"#868e96"],["Victoire rouge",l,"#e03131"]].map(([t,p,c])=>`<div class="pbar"><span>${t}</span><i><b style="width:${pc(p)}%;background:${c}"></b></i><em>${pc(p)} %</em></div>`).join("");
  document.getElementById("pt-"+id).innerHTML=`<table class="ltab"><tr><th>Buts</th>${[0,1,2,3,4].map(k=>`<th>${k}</th>`).join("")}</tr><tr><td>bleus</td>${[0,1,2,3,4].map(k=>`<td>${pc(poisP(S.a,k))} %</td>`).join("")}</tr><tr><td>rouges</td>${[0,1,2,3,4].map(k=>`<td>${pc(poisP(S.b,k))} %</td>`).join("")}</tr></table>`}
function poisSim(id,n){const S=POI[id];if(!S)return;let last;for(let i=0;i<n;i++){const x=poisSample(S.a),y=poisSample(S.b);last=[x,y];S.tally[x>y?0:x===y?1:2]++;S.n++}
  document.getElementById("ps-"+id).innerHTML=`<span style="color:#1c7ed6">${last[0]}</span> : <span style="color:#e03131">${last[1]}</span>`;
  const [v,d,l]=S.tally,pc=x=>Math.round(x/S.n*100);
  document.getElementById("pn-"+id).innerHTML=`Sur <b>${S.n}</b> match${S.n>1?"s":""} : bleus gagnent <b>${v}</b> (${pc(v)} %), nuls <b>${d}</b> (${pc(d)} %), rouges gagnent <b>${l}</b> (${pc(l)} %).`;
  beep([[n>1?700:500,0,.08]])}

document.addEventListener("click",e=>{const sv=e.target.closest&&e.target.closest(".xgsvg");if(sv)return xgTap(sv,e);
  const r=e.target.closest&&e.target.closest("[data-xgreset]");if(r){const id=r.dataset.xgreset;XGS[id]=[];const w=document.getElementById("xg-"+id);w.querySelector(".xgshots").innerHTML="";w.querySelector(".xgcur").innerHTML="";document.getElementById("xgout-"+id).innerHTML="<b>Touche le terrain</b> pour placer un tir.";return}
  const s=e.target.closest&&e.target.closest("[data-poisim]");if(s){const [id,n]=s.dataset.poisim.split(":");return poisSim(id,+n)}});
document.addEventListener("input",e=>{const d=e.target.dataset&&e.target.dataset.pois;if(!d)return;const [id,k]=d.split(":"),S=POI[id];if(!S)return;S[k]=+e.target.value;S.tally=[0,0,0];S.n=0;
  document.getElementById(`pv-${id}-${k}`).textContent=fmt(S[k]);document.getElementById("pn-"+id).textContent="Nouveaux réglages : relance des matchs.";poisRender(id)});
{const _is=initStep;initStep=function(){_is();document.querySelectorAll(".lesson .tac").forEach(el=>{const id=el.id.slice(4),D=DEMOS[id];if(!D)return;tacShow(id,0,true);if(!D.btns)demoTimers.push(setTimeout(()=>tacPlay(id),700))});
  document.querySelectorAll(".lesson .poi").forEach(el=>{const id=el.id.slice(4);const S=POI[id];if(S){S.tally=[0,0,0];S.n=0}poisRender(id)});
  document.querySelectorAll(".lesson .xgw").forEach(el=>{XGS[el.id.slice(3)]=[]})}}

function xgSumGen(){const n=R(3,4),xs=Array.from({length:n},()=>pick([.05,.08,.1,.12,.15,.2,.25,.3,.4,.76])),tot=Math.round(xs.reduce((a,b)=>a+b,0)*100)/100;
  return inp(`Une équipe a tiré ${n} fois, avec des xG de ${xs.map(fmt).join(" ; ")}. Quel est son xG total ?`,tot,`On additionne : ${xs.map(fmt).join(" + ")} = ${fmt(tot)}.`,{tol:.011})}
function penPairGen(){const [p,q,t]=pick([[3,4,"3 sur 4"],[4,5,"4 sur 5"],[1,2,"1 sur 2"]]),good=`${p*p}/${q*q}`;
  return mcq(`Un tireur marque ${t} de ses penalties. Quelle est la probabilité qu’il marque les 2 prochains ?`,good,[`${p}/${q}`,`${2*p}/${q}`,`${p}/${q*q}`],`On multiplie : ${p}/${q} × ${p}/${q} = ${good}.`)}
function ppdaGen(){const d=R(8,20),k=pick([6,8,10,12,15]),pa=d*k;return inp(`L’adversaire fait ${pa} passes dans sa moitié de terrain, et ton équipe fait ${d} actions défensives (tacles, interceptions, fautes) dans cette zone. Calcule le PPDA.`,k,`PPDA = ${pa} ÷ ${d} = ${k}. Plus il est petit, plus le pressing est fort.`)}
const mathGen=()=>pick([xgSumGen,penPairGen,ppdaGen])();
