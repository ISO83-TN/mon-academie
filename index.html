document.addEventListener("input",e=>{if(e.target.id!=="ohm-r")return;const R_=+e.target.value,I=6/R_,st=e.target.closest(".lbody").querySelector(".stage");
  if(st)st.style.setProperty("--dur",(R_/30).toFixed(2)+"s");document.getElementById("ohm-out").innerHTML=`R = ${R_} Ω → I = U ÷ R = 6 ÷ ${R_} = <b>${fmt(r3(I))} A</b>${R_>=80?" : le courant passe difficilement":R_<=20?" : le courant passe facilement":""}`});

/* ---------- générateurs d’exercices ---------- */
function robotStaticQ(w,h,sx,sy,sd,labels){return robotSvg(w,h,{x:sx,y:sy,d:sd},{labels})}
G.robot=()=>{for(let g=0;g<300;g++){const W=5,H=5;let x=R(0,4),y=R(0,4),d=R(0,3);const sx=x,sy=y,sd=d,ops=[],n=R(4,7);let ok=true;
    for(let i=0;i<n;i++){const op=pick(["F","F","F","L","R"]);if(op==="F"){const nx=x+DIRS[d][0],ny=y+DIRS[d][1];if(nx<0||ny<0||nx>=W||ny>=H){ok=false;break}x=nx;y=ny}else d=op==="L"?(d+3)%4:(d+1)%4;ops.push(op)}
    if(!ok||(x===sx&&y===sy)||ops.filter(o=>o==="F").length<2)continue;
    const cands=[[x,y]];while(cands.length<4){const c=[R(0,4),R(0,4)];if(!cands.some(z=>z[0]===c[0]&&z[1]===c[1])&&!(c[0]===sx&&c[1]===sy))cands.push(c)}
    const sh=shuffle(cands),L="ABCD",good="Case "+L[sh.findIndex(c=>c[0]===x&&c[1]===y)];
    return mcq("Le robot (le rond avec la flèche) exécute ce programme. Sur quelle case arrive-t-il ?",good,["Case A","Case B","Case C","Case D"].filter(z=>z!==good),`Pas à pas : ${ops.map(o=>OPL[o]).join(", ")}. Attention : « tourner » se fait sur place, dans le sens de la flèche du robot.`,{svg:robotStaticQ(W,H,sx,sy,sd,sh.map((c,i)=>[c[0],c[1],L[i]])),code:ops.map(o=>OPL[o]).join("\n"),sig:ops.join("")+sx+sy+sd})}
  return G.pseudo()};
G.pseudo=()=>{const a=R(1,9),b=R(2,9),c=R(2,3),t=R(1,2);
  if(t===1)return inp("Que vaut score à la fin ?",(a+b)*c,`score vaut ${a}, puis ${a} + ${b} = ${a+b}, puis ${a+b} × ${c} = ${(a+b)*c}.`,{code:`score ← ${a}\nscore ← score + ${b}\nscore ← score × ${c}`});
  const v=R(3,6),k=R(1,2);return inp("Que vaut vies à la fin ?",v-2*k,`vies part de ${v}, et on enlève ${k} deux fois : ${v} − ${k} − ${k} = ${v-2*k}.`,{code:`vies ← ${v}\nvies ← vies − ${k}\nvies ← vies − ${k}`})};
G.py=()=>{const t=R(1,4);
  if(t===1){const a=R(2,9),b=R(2,9);return inp("Qu’affiche ce programme ?",(a+b)*2,`x vaut ${a}, puis ${a} + ${b} = ${a+b}. On affiche ${a+b} × 2 = ${(a+b)*2}.`,{code:`x = ${a}\ny = ${b}\nx = x + y\nprint(x * 2)`})}
  if(t===2){const n=R(2,6),k=R(2,9);return inp("Qu’affiche ce programme ?",n*k,`La boucle tourne ${n} fois et ajoute ${k} à chaque tour : ${n} × ${k} = ${n*k}.`,{code:`s = 0\nfor i in range(${n}):\n    s = s + ${k}\nprint(s)`})}
  if(t===3){const a=R(1,5),b=a+R(2,5);return inp("Combien de nombres ce programme affiche-t-il ?",b-a,`range(${a}, ${b}) donne ${Array.from({length:b-a},(_,i)=>a+i).join(", ")} : ${b-a} nombres, on s’arrête avant ${b}.`,{code:`for i in range(${a}, ${b}):\n    print(i)`})}
  const a=R(1,20),lim=R(5,15),g=a>lim?"grand":"petit";return mcq("Qu’affiche ce programme ?",g,["grand","petit",String(a),"rien"],`${a} > ${lim} est ${a>lim?"vrai":"faux"}, donc on exécute ${a>lim?"le bloc du if":"le bloc du else"}.`,{code:`n = ${a}\nif n > ${lim}:\n    print("grand")\nelse:\n    print("petit")`})};
G.ohm=()=>{const t=R(1,3),Rv=pick([10,20,30,50,100,200]),I=pick([.05,.1,.2,.3,.5]),U=r3(Rv*I);
  if(t===1)return inp(`Une résistance de ${Rv} Ω est traversée par un courant de ${fmt(I)} A. Quelle est la tension à ses bornes (en V) ?`,U,`U = R × I = ${Rv} × ${fmt(I)} = ${fmt(U)} V.`,{unit:"V",tol:.01});
  if(t===2)return inp(`On applique ${fmt(U)} V à une résistance de ${Rv} Ω. Quelle est l’intensité du courant (en A) ?`,I,`I = U ÷ R = ${fmt(U)} ÷ ${Rv} = ${fmt(I)} A.`,{unit:"A",tol:.001});
  return inp(`Une tension de ${fmt(U)} V fait passer ${fmt(I)} A dans une résistance. Quelle est sa valeur (en Ω) ?`,Rv,`R = U ÷ I = ${fmt(U)} ÷ ${fmt(I)} = ${Rv} Ω.`,{unit:"Ω",tol:.01})};

 unit:[["En quelle unité mesure-t-on la tension ?","le volt (V)",["l’ampère (A)","l’ohm (Ω)","le mètre (m)"],"La tension se mesure en volts, avec un voltmètre."],["En quelle unité mesure-t-on l’intensité du courant ?","l’ampère (A)",["le volt (V)","le mètre (m)","le kilogramme (kg)"],"L’intensité se mesure en ampères, avec un ampèremètre."],["Comment branche-t-on un voltmètre ?","en dérivation, aux bornes de l’appareil",["en série, dans la boucle","à la place de la pile","sans fil"],"Voltmètre en dérivation, ampèremètre en série."],["Dans l’image du réservoir d’eau, la tension ressemble à…","la hauteur de l’eau qui pousse",["le nombre de tuyaux","la couleur de l’eau","la taille de la roue"],"Plus l’eau est haute, plus elle pousse fort."],["Une pile ronde classique (type AA) délivre…","1,5 V",["230 V","15 V","0 V"],"Une pile plate de lampe de poche fait 4,5 V."]],
 ohm:[["Que dit la loi d’Ohm U = R × I ?","la tension égale la résistance fois l’intensité",["l’intensité égale la tension fois la résistance","la résistance égale la tension plus l’intensité","la tension ne dépend de rien"],"U en volts, R en ohms, I en ampères."],["Avec la même pile, si la résistance augmente, l’intensité…","diminue",["augmente","ne change pas","double toujours"],"I = U ÷ R : plus R est grand, plus I est petit."],["Dans quelle unité s’exprime une résistance ?","l’ohm (Ω)",["le volt (V)","l’ampère (A)","le hertz (Hz)"],"Le symbole Ω est la lettre grecque oméga."]],
 led:[["Une LED s’allume…","dans un seul sens de branchement",["dans les deux sens","jamais avec une pile","seulement avec 230 V"],"La LED est une diode : elle laisse passer le courant dans un seul sens."],["La patte la plus longue d’une LED se branche du côté…","+ de la pile",["− de la pile","peu importe","de la terre"],"Patte longue = anode (+), patte courte = cathode (−)."],["Pourquoi ajoute-t-on une résistance avec une LED ?","pour limiter le courant et ne pas la griller",["pour qu’elle change de couleur","pour qu’elle clignote","pour augmenter la tension"],"Sans résistance, trop de courant traverse la LED."],["Que veut dire DEL (LED en anglais) ?","diode électroluminescente",["lampe électrique durable","lumière extra douce","ligne électrique directe"],"Une diode qui produit de la lumière."]],
 algo:[["Un algorithme, c’est…","une suite d’instructions précises, dans l’ordre",["un robot","un ordinateur","un jeu vidéo"],"Comme une recette de cuisine."],["Si on inverse deux instructions, le résultat…","peut changer",["ne change jamais","efface le programme","va plus vite"],"L’ordre des instructions compte."],["« Tourner à droite » fait…","pivoter le robot sur place",["avancer le robot d’une case","reculer le robot","arrêter le programme"],"Le robot change de direction sans changer de case."]],
 loop:[["À quoi sert une boucle « répéter » ?","à refaire plusieurs fois les mêmes instructions",["à arrêter le programme","à choisir entre deux actions","à effacer le dessin"],"Elle évite d’écrire 10 fois la même chose."],["« répéter 4 fois : avancer, tourner à droite » dessine…","un carré",["un triangle","une ligne droite","un cercle"],"4 côtés et 4 virages d’un quart de tour."],["Dans « répéter 3 fois : avancer, avancer », combien de fois le robot avance-t-il ?","6",["3","2","5"],"3 tours × 2 = 6."]],
 cond2:[["Quel bloc permet au programme de choisir ?","si … sinon",["répéter 5 fois","avancer","afficher"],"La condition teste une situation et choisit quoi faire."],["« si il pleut : prendre un parapluie, sinon : prendre une casquette ». Il fait beau. Je prends…","une casquette",["un parapluie","les deux","rien"],"La condition « il pleut » est fausse : on fait la partie « sinon »."],["Une condition est toujours…","vraie ou fausse",["un nombre","une couleur","un mot au hasard"],"En informatique, on appelle ça un booléen."]],
 vars:[["Une variable, c’est…","une boîte avec un nom qui garde une valeur",["un nombre qui ne change jamais","un robot","une couleur"],"Sa valeur peut changer pendant le programme."],["score ← 5 puis score ← score + 3. Que vaut score ?","8",["5","3","53"],"On prend l’ancienne valeur (5) et on ajoute 3."],["Que fait « afficher score » ?","il montre la valeur de score à l’écran",["il efface score","il met score à 0","il double score"],"Afficher ne change pas la variable."]],
 py1:[["En Python, quelle instruction affiche un texte à l’écran ?","print",["show","echo","display"],"print(\"Bonjour\") affiche Bonjour."],["En Python, que fait age = 10 ?","il range 10 dans la variable age",["il compare age et 10","il affiche 10","il efface age"],"Le signe = range une valeur ; pour comparer, on écrit ==."],["Qu’affiche print(\"2 + 3\") ?","2 + 3",["5","23","rien"],"Entre guillemets, c’est un texte : Python ne calcule pas."]],
 py2:[["Combien de tours fait for i in range(5) ?","5",["4","6","1"],"range(5) donne 0, 1, 2, 3, 4."],["Pourquoi certaines lignes sont-elles décalées (indentées) en Python ?","elles font partie du bloc de la boucle ou du if",["pour faire joli","pour aller plus vite","c’est une erreur"],"Python utilise le décalage pour savoir ce qui est dans la boucle."]]
};
const ELESS=[
 {id:"e_circ",sub:"elec",lvl:"CM2",title:"Le circuit électrique",desc:"Pile, lampe, interrupteur, boucle fermée",bank:EB.circ,steps:[
  {t:"Allumer une lampe",h:`<p>Appuie sur l’interrupteur et regarde le courant circuler dans les fils.</p>`+circuitSimple("st1"),say:"Voici un circuit électrique. Il y a une pile, une lampe, un interrupteur et des fils. Appuie sur le bouton pour fermer l’interrupteur. Le courant se met à circuler dans la boucle, et la lampe s’allume. Appuie encore : le circuit s’ouvre, le courant s’arrête, la lampe s’éteint."},
  {t:"Les éléments du circuit",h:ltab([["Élément","Rôle","Symbole"],["la pile","donne l’énergie (le générateur)","un grand trait + et un petit trait −"],["la lampe","transforme l’énergie en lumière","un cercle avec une croix"],["l’interrupteur","ouvre ou ferme le circuit","un trait qui se lève"],["les fils","relient les éléments","des traits"]]),say:"Chaque élément a un rôle. La pile est le générateur : elle fournit l’énergie. La lampe est un récepteur : elle transforme l’énergie en lumière. L’interrupteur permet d’ouvrir ou de fermer le circuit. Et les fils relient le tout. Les ingénieurs dessinent les circuits avec des symboles : c’est un schéma électrique."},
  {t:"Circuit ouvert, circuit fermé",h:circuitSimple("st1b")+KEY("Le courant ne circule que dans une boucle <b>fermée</b>, qui part d’une borne de la pile et revient à l’autre."),say:"Retiens bien : pour que le courant circule, il faut une boucle fermée, sans interruption, qui part de la borne plus de la pile et revient à la borne moins. Si un fil est débranché, ou si l’interrupteur est ouvert, le circuit est ouvert : plus rien ne marche."},
  {t:"Le sens du courant",h:`<p>À l’extérieur de la pile, le courant va de la borne <b>+</b> vers la borne <b>−</b>. C’est le sens que montrent les petits points qui avancent.</p>`+KEY("Une pile a deux bornes : + et −. Le courant sort par le + et rentre par le −."),say:"Le courant a un sens. À l’extérieur de la pile, il part de la borne plus, traverse la lampe, et revient par la borne moins. Les petits points qui avancent dans l’animation montrent ce sens."}]},
 {id:"e_cond",sub:"elec",lvl:"CM2",title:"Conducteurs et isolants",desc:"Teste des objets dans le circuit",bank:EB.cond,steps:[
  {t:"Le testeur de conducteurs",h:`<p>Pose un objet dans la pince : si la lampe s’allume, l’objet laisse passer le courant.</p>`+circuitTest("st2"),say:"Ce circuit est un testeur. On pose un objet entre les deux pinces. Si la lampe s’allume, c’est que l’objet laisse passer le courant : c’est un conducteur. Essaie le trombone, la pièce, la règle en plastique, le bâton de bois et la gomme."},
  {t:"Conducteurs et isolants",h:ltab([["Conducteurs (le courant passe)","Isolants (le courant ne passe pas)"],["fer, cuivre, aluminium, or…","plastique, caoutchouc, verre, bois sec, air"],["l’eau, le corps humain !","papier, tissu sec"]])+KEY("Les métaux sont conducteurs. Le plastique et le caoutchouc sont isolants."),say:"Les métaux, comme le fer, le cuivre ou l’aluminium, sont des conducteurs. Le plastique, le caoutchouc, le verre ou le bois sec sont des isolants. Attention : l’eau et le corps humain sont conducteurs. C’est pour cela que l’électricité est dangereuse avec de l’eau."},
  {t:"À quoi servent les isolants ?",h:`<p>Un fil électrique a un cœur en <b>cuivre</b> (conducteur) entouré d’une gaine en <b>plastique</b> (isolant).</p>`+KEY("La gaine isolante nous protège : on ne touche jamais un fil dénudé ni un appareil avec les mains mouillées."),say:"Un fil électrique a un cœur en cuivre, qui conduit le courant, entouré d’une gaine en plastique, qui est isolante. Cette gaine nous protège. Ne touche jamais un fil dont le cuivre est visible, et jamais un appareil électrique avec les mains mouillées."}]},
 {id:"e_serie",sub:"elec",lvl:"5e",title:"Série ou dérivation",desc:"Deux façons de brancher deux lampes",bank:EB.serie,steps:[
  {t:"Le circuit en série",h:`<p>Les deux lampes sont l’une après l’autre, dans <b>une seule boucle</b>.</p>`+circuitSeries("st3"),say:"Dans un circuit en série, les lampes sont branchées l’une après l’autre, dans une seule boucle. Dévisse la lampe numéro deux : la boucle est coupée, et les deux lampes s’éteignent."},
  {t:"Le circuit en dérivation",h:`<p>Chaque lampe a <b>sa propre boucle</b> avec la pile.</p>`+circuitPar("st3b"),say:"Dans un circuit en dérivation, chaque lampe a sa propre boucle avec la pile. Dévisse la lampe numéro deux : la première lampe reste allumée, car sa boucle n’est pas coupée."},
  {t:"Et dans la maison ?",h:KEY("Toutes les prises et les lampes de la maison sont branchées <b>en dérivation</b> : on peut éteindre une lampe sans éteindre le frigo.")+`<p>Les guirlandes de Noël anciennes étaient en série : une ampoule grillée, et toute la guirlande s’éteignait !</p>`,say:"Dans une maison, tout est branché en dérivation. C’est pratique : quand tu éteins ta lampe, le frigo continue de fonctionner. Les vieilles guirlandes de Noël étaient en série : une seule ampoule grillée, et toute la guirlande s’éteignait !"}]},
 {id:"e_court",sub:"elec",lvl:"CM2",title:"Court-circuit et sécurité",desc:"Les dangers de l’électricité",bank:EB.court,steps:[
  {t:"Le court-circuit",h:`<p>Ajoute un fil qui relie les deux côtés de la lampe.</p>`+circuitShort("st4"),say:"Ajoute un fil qui relie les deux côtés de la lampe. Le courant prend le chemin le plus facile : il passe par le fil au lieu de la lampe. La lampe s’éteint, le courant devient très fort, et la pile chauffe. C’est un court-circuit. Avec de gros courants, cela peut provoquer un incendie."},
  {t:"La prise de courant : danger !",h:`<p class="warn">Une prise de courant délivre 230 volts. C’est 150 fois plus qu’une pile de 1,5 V, et cela peut tuer.</p>`+KEY("Jamais d’objet dans une prise. Jamais d’appareil électrique près de l’eau. Jamais de fil abîmé. Les expériences se font uniquement avec des piles."),say:"Attention, c’est très important. Une prise de courant délivre deux cent trente volts. C’est cent cinquante fois plus qu’une petite pile, et cela peut tuer. On ne met jamais d’objet dans une prise. On n’utilise jamais un appareil électrique près de l’eau. On ne touche jamais un fil abîmé. Les expériences se font seulement avec des piles."},
  {t:"Les protections de la maison",h:ltab([["Protection","À quoi ça sert"],["le disjoncteur","coupe le courant en cas de court-circuit ou de surcharge"],["le différentiel 30 mA","coupe le courant si une personne touche un fil sous tension"],["la prise de terre","évacue le courant de fuite vers le sol"]]),say:"Dans le tableau électrique de la maison, il y a des protections. Le disjoncteur coupe le courant en cas de court-circuit. Le différentiel trente milliampères coupe le courant très vite si une personne touche un fil sous tension. Et la prise de terre évacue les fuites de courant vers le sol. Les électriciens et les ingénieurs dimensionnent ces protections pour que tout le monde soit en sécurité."}]},
 {id:"e_unit",sub:"elec",lvl:"4e",title:"Tension et intensité",desc:"Volts, ampères et le réservoir d’eau",bank:EB.unit,steps:[
  {t:"Comme de l’eau dans des tuyaux",h:`<p>Remplis le réservoir : l’eau pousse plus fort et la roue tourne plus vite.</p>`+waterStage("st5"),say:"Pour comprendre l’électricité, imagine de l’eau dans des tuyaux. La hauteur de l’eau dans le réservoir, c’est la tension : plus elle est haute, plus elle pousse fort. La quantité d’eau qui passe chaque seconde, c’est l’intensité. Remplis le réservoir : l’eau pousse plus fort, et la roue tourne plus vite."},
  {t:"Les deux grandeurs",h:ltab([["Grandeur","Lettre","Unité","Appareil de mesure","Branchement"],["la tension","U","le volt (V)","le voltmètre","en dérivation"],["l’intensité","I","l’ampère (A)","l’ampèremètre","en série"]])+KEY("Pile ronde : 1,5 V. Pile plate : 4,5 V. Prise de la maison : 230 V."),say:"La tension se note U et se mesure en volts, avec un voltmètre branché en dérivation, c’est-à-dire à côté de l’appareil. L’intensité se note I et se mesure en ampères, avec un ampèremètre branché en série, dans la boucle. Une pile ronde fait un virgule cinq volt, une pile plate quatre virgule cinq volts, et la prise de la maison deux cent trente volts."},
  {t:"Le multimètre",h:`<p>Le multimètre est un appareil qui mesure à la fois la tension (position V) et l’intensité (position A). C’est l’outil favori des électriciens !</p>`+KEY("On choisit toujours le bon calibre avant de mesurer, et on commence par le plus grand."),say:"Le multimètre est l’outil préféré des électriciens. Il peut mesurer la tension, en position V, et l’intensité, en position A. Avant de mesurer, on choisit toujours le bon calibre, en commençant par le plus grand pour ne pas abîmer l’appareil."}]},
 {id:"e_ohm",sub:"elec",lvl:"4e",title:"La loi d’Ohm",desc:"U = R × I, avec un curseur à manipuler",gen:G.ohm,bank:EB.ohm,steps:[
  {t:"La résistance freine le courant",h:`<p>Fais glisser le curseur : plus la résistance est grande, plus le courant ralentit.</p>`+ohmStage("st6"),say:"Une résistance est un composant qui freine le courant. Fais glisser le curseur. Plus la résistance est grande, plus le courant est faible : les points avancent plus lentement. La pile, elle, donne toujours six volts."},
  {t:"La formule",h:`<p class="bignum small">U = R × I</p>`+ltab([["U","R","I"],["tension en volts (V)","résistance en ohms (Ω)","intensité en ampères (A)"]])+KEY("On peut aussi écrire I = U ÷ R et R = U ÷ I."),say:"La loi d’Ohm s’écrit U égale R fois I. U est la tension en volts, R la résistance en ohms, et I l’intensité en ampères. On peut la retourner : I égale U divisé par R, et R égale U divisé par I."},
  {t:"Un exemple",h:EX(CALC("Pile : U = 6 V   Résistance : R = 30 Ω\nI = U ÷ R = 6 ÷ 30 = 0,2 A"))+`<p>Si on double la résistance (60 Ω), l’intensité est divisée par deux : 0,1 A.</p>`,say:"Prenons un exemple. Une pile de six volts et une résistance de trente ohms. L’intensité vaut six divisé par trente, soit zéro virgule deux ampère. Si on double la résistance, l’intensité est divisée par deux : zéro virgule un ampère."}]},
 {id:"e_led",sub:"elec",lvl:"5e",title:"La LED",desc:"Une lampe qui n’aime qu’un seul sens",bank:EB.led,steps:[
  {t:"Une diode qui éclaire",h:`<p>Retourne la LED : elle ne s’allume que dans un sens.</p>`+ledStage("st7"),say:"Une LED, ou diode électroluminescente, est une petite lampe très économe. Mais elle a une particularité : elle ne laisse passer le courant que dans un seul sens. Retourne-la : le courant est bloqué et elle s’éteint."},
  {t:"Les pattes de la LED",h:ltab([["Patte","Nom","Se branche vers"],["longue","anode","le + de la pile"],["courte","cathode","le − de la pile"]])+KEY("Avec une LED, on met toujours une résistance pour limiter le courant."),say:"Une LED a deux pattes. La patte longue s’appelle l’anode : elle se branche du côté plus. La patte courte, la cathode, se branche du côté moins. Et on ajoute toujours une résistance, sinon trop de courant la traverse et elle grille."},
  {t:"Partout autour de toi",h:`<p>Écrans, feux de circulation, phares de voiture, lampes de la maison : les LED consomment environ 5 fois moins qu’une ampoule classique et durent beaucoup plus longtemps.</p>`,say:"Les LED sont partout : dans les écrans, les feux de circulation, les phares de voiture et les lampes de la maison. Elles consomment environ cinq fois moins d’énergie qu’une vieille ampoule, et durent beaucoup plus longtemps."}]}
];
const PLESS=[
 {id:"p_algo",sub:"prog",lvl:"CM2",title:"Qu’est-ce qu’un algorithme ?",desc:"Guider un robot pas à pas",gen:G.robot,bank:EB.algo,steps:[
  {t:"Un robot qui obéit",h:`<p>Le robot suit les instructions <b>une par une, dans l’ordre</b>. Regarde-le aller jusqu’au drapeau.</p>`+robotDemo("rb1",{w:6,h:4,start:[0,3,1],goal:[4,0],prog:[{op:"F"},{op:"F"},{op:"L"},{op:"F"},{op:"F"},{op:"F"},{op:"R"},{op:"F"},{op:"F"}]}),say:"Un ordinateur ne réfléchit pas tout seul : il suit exactement les instructions qu’on lui donne, une par une, dans l’ordre. Regarde le robot : il avance, il tourne, et il arrive au drapeau. La liste d’instructions s’appelle un algorithme."},
  {t:"Un algorithme, c’est une recette",h:KEY("Un algorithme est une suite d’instructions précises, dans un ordre précis, pour résoudre un problème.")+EX(`<p>Recette de la pâte à crêpes : 1. verser la farine, 2. ajouter les œufs, 3. mélanger, 4. ajouter le lait petit à petit.</p>`),say:"Un algorithme, c’est comme une recette de cuisine : des instructions précises, dans un ordre précis. Si tu mets le lait avant la farine, la pâte rate. En programmation, c’est pareil : l’ordre compte."},
  {t:"Tourner, c’est sur place",h:`<p>« tourner à gauche » et « tourner à droite » font pivoter le robot <b>sans changer de case</b>. La flèche montre où il regarde.</p>`,say:"Attention à un piège : quand le robot tourne, il pivote sur place, sans changer de case. Seule l’instruction avancer le fait bouger. Pour ne pas te tromper, regarde la flèche du robot : elle montre la direction dans laquelle il va avancer."}]},
 {id:"p_loop",sub:"prog",lvl:"CM2",title:"Les boucles",desc:"Répéter sans tout réécrire",gen:G.robot,bank:EB.loop,steps:[
  {t:"Dessiner un carré",h:`<p>Au lieu d’écrire 16 instructions, on utilise une <b>boucle</b>.</p>`+robotDemo("rb2",{w:5,h:5,start:[1,4,0],trail:true,prog:[{rep:4,body:[{op:"F"},{op:"F"},{op:"F"},{op:"R"}]}]}),say:"Le robot doit dessiner un carré. Sans boucle, il faudrait écrire seize instructions. Avec une boucle répéter quatre fois, on écrit seulement quatre instructions, et l’ordinateur les répète. Regarde le robot tracer son carré."},
  {t:"Compter les tours",h:EX(CALC("répéter 3 fois :\n    avancer\n    avancer\n\n→ le robot avance 3 × 2 = 6 fois"))+KEY("Une boucle répète un bloc d’instructions un nombre de fois choisi."),say:"Pour savoir ce que fait une boucle, on multiplie. Répéter trois fois avancer, avancer : le robot avance trois fois deux, soit six fois. Les instructions décalées vers la droite font partie de la boucle."}]},
 {id:"p_cond",sub:"prog",lvl:"6e",title:"Les conditions",desc:"Si… sinon : le robot décide",gen:G.robot,bank:EB.cond2,steps:[
  {t:"Le robot dans le labyrinthe",h:`<p>Le robot ne connaît pas le chemin. À chaque pas, il <b>teste</b> s’il y a un mur devant lui.</p>`+robotDemo("rb3",{w:5,h:5,start:[0,4,1],goal:[1,1],walls:[[0,0],[1,0],[2,0],[3,0],[4,0],[0,1],[0,2],[1,2],[2,2],[3,2],[0,3],[1,3],[2,3],[3,3]],prog:[{until:true,body:[{ifw:true,then:[{op:"L"}],else:[{op:"F"}]}]}]}),say:"Cette fois, le robot ne connaît pas le chemin. Son programme est très court : tant qu’il n’est pas sur le drapeau, s’il y a un mur devant lui, il tourne à gauche, sinon, il avance. Regarde : il trouve son chemin tout seul. C’est la force des conditions."},
  {t:"Si… sinon",h:CALC("si il pleut :\n    prendre un parapluie\nsinon :\n    prendre une casquette")+KEY("Une condition est vraie ou fausse. Si elle est vraie, on fait le premier bloc, sinon le second."),say:"Une condition, c’est une question dont la réponse est vrai ou faux. Si il pleut, je prends un parapluie, sinon, je prends une casquette. L’ordinateur exécute un seul des deux blocs, selon la réponse."}]},
 {id:"p_vars",sub:"prog",lvl:"6e",title:"Les variables",desc:"Des boîtes qui gardent des valeurs",gen:G.pseudo,bank:EB.vars,steps:[

function mountV3D(el){if(!el.isConnected)return;const id=el.id.slice(4),kind=el.dataset.scene,T=THREE;el.innerHTML="";

  sc.add(new T.HemisphereLight(0xffffff,0x8899aa,.95));const dl=new T.DirectionalLight(0xffffff,.65);dl.position.set(60,120,80);sc.add(dl);
  const root=new T.Group();sc.add(root);const grid=new T.GridHelper(160,16,0x8899bb,0xc8d0e0);grid.userData.keep=true;root.add(grid);

  const st={T,ren,sc,cam,root,el,kind,auto:true,ry:.6,rx:.08,t0:performance.now(),mat:new T.MeshStandardMaterial({color:col,roughness:.55,metalness:.05}),ghost:new T.MeshStandardMaterial({color:0x9aa5b1,transparent:true,opacity:.45,roughness:.8,depthWrite:false}),supM:new T.MeshStandardMaterial({color:0xb0b8c4,roughness:.9})};
  V3D[id]=st;BUILD3[kind](st);
  const cv=ren.domElement;cv.style.touchAction="none";let drag=null;
  cv.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY};st.auto=false;try{cv.setPointerCapture(e.pointerId)}catch(_){}});
  cv.addEventListener("pointermove",e=>{if(!drag)return;st.ry+=(e.clientX-drag.x)*.01;st.rx=Math.max(-.4,Math.min(.7,st.rx+(e.clientY-drag.y)*.006));drag={x:e.clientX,y:e.clientY}});
  cv.addEventListener("pointerup",()=>drag=null);cv.addEventListener("pointercancel",()=>drag=null);
  const loop=t=>{if(!V3D[id])return;if(st.auto)st.ry+=.005;root.rotation.y=st.ry;root.rotation.x=st.rx;if(st.tick)st.tick(t);ren.render(sc,cam);st.raf=requestAnimationFrame(loop)};st.raf=requestAnimationFrame(loop)}

/* ================= football : tactique animée ================= */
/* terrain de foot à 8 vu du ciel : 60 m × 40 m, 10 px par mètre. Les bleus (a) attaquent vers la droite. */
const TPX=x=>20+x*10,TPY=y=>20+y*10;
const F331={a1:[2.5,20],a2:[13,8],a3:[11,20],a4:[13,32],a5:[23,9],a6:[21,20],a7:[23,31],a8:[29,20]};
const mirror=o=>Object.fromEntries(Object.entries(o).map(([k,[x,y]])=>["b"+k.slice(1),[60-x,40-y]]));
const OFF=ids=>Object.fromEntries(ids.map(k=>[k,null]));
function tacPitch(id){let s="";for(let i=0;i<6;i++)s+=`<rect x="${20+i*100}" y="20" width="100" height="400" fill="${i%2?"#2f9e44":"#37b24d"}"/>`;
  const L=`stroke="#fff" stroke-width="2.5" fill="none" opacity=".9"`;
  s+=`<rect x="20" y="20" width="600" height="400" ${L}/><line x1="320" y1="20" x2="320" y2="420" ${L}/><circle cx="320" cy="220" r="60" ${L}/><circle cx="320" cy="220" r="3" fill="#fff"/>`;
  s+=`<rect x="20" y="90" width="130" height="260" ${L}/><rect x="490" y="90" width="130" height="260" ${L}/><circle cx="110" cy="220" r="3" fill="#fff"/><circle cx="530" cy="220" r="3" fill="#fff"/>`;
  s+=`<line x1="150" y1="20" x2="150" y2="420" stroke="#fff" stroke-width="1.5" stroke-dasharray="6 8" opacity=".55"/><line x1="490" y1="20" x2="490" y2="420" stroke="#fff" stroke-width="1.5" stroke-dasharray="6 8" opacity=".55"/>`;
  s+=`<rect x="8" y="190" width="12" height="60" fill="#fff" opacity=".85"/><rect x="620" y="190" width="12" height="60" fill="#fff" opacity=".85"/>`;
  s+=`<defs>${[["p","#ffe14d"],["r","#ffffff"],["x","#ff6b6b"]].map(([k,c])=>`<marker id="tm${k}-${id}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker>`).join("")}</defs>`;
  return s}
function tacBoard(id,cfg){const ids=[...new Set(cfg.frames.flatMap(f=>Object.keys(f.p||{})))];let cur=OFF(ids),ball=[30,20];
  const frames=cfg.frames.map(f=>{cur={...cur,...(f.p||{})};if(f.b!==undefined)ball=f.b;return {...f,P:{...cur},B:ball}});
  DEMOS[id]={...cfg,frames,ids,i:-1};
  const pl=ids.map(k=>`<g class="pl ${k[0]} ${k.slice(1)==="1"?"gk":""}" data-pl="${k}"><circle r="13"/><text>${(cfg.lab&&cfg.lab[k])||k.slice(1)}</text></g>`).join("");
  const btns=cfg.btns?cfg.btns.map(([k,l])=>`<button class="btn small ${k?"ghost":""}" data-tacgo="${id}:${k}">${l}</button>`).join(""):
    `<button class="btn small" data-tacplay="${id}">▶ Jouer l’action</button><button class="btn ghost small" data-tacnext="${id}">Image suivante</button>`;
  return `<div class="tac inst" id="tac-${id}"><svg class="tfig" viewBox="0 0 640 440" role="img" aria-label="${esc(cfg.alt||"Terrain de football vu du ciel")}">${tacPitch(id)}<g class="tz"></g><g class="ta"></g>${pl}<g class="tball"><circle r="6.5"/></g><text class="tgoal" x="320" y="232" text-anchor="middle">BUT !</text></svg><p class="tacnote" aria-live="polite"></p></div><div class="tools stage-tools">${btns}</div>`}
function tacPos(F,r){if(typeof r==="string"){const p=F.P[r];return p?[p[0],p[1]]:null}return r}
function tacBallPos(F){if(typeof F.B==="string"){const p=F.P[F.B];return p?[p[0]+1.3,p[1]+.9]:[30,20]}return F.B}
function tacShow(id,k,inst){const D=DEMOS[id],root=document.getElementById("tac-"+id);if(!D||!root)return;const F=D.frames[k];if(!F)return;D.i=k;
  root.classList.toggle("inst",!!inst);root.style.setProperty("--td",(F.d||900)+"ms");
  root.querySelectorAll(".pl").forEach(g=>{const p=F.P[g.dataset.pl];g.classList.toggle("off",!p);g.classList.toggle("hi",(F.h||[]).includes(g.dataset.pl));if(p)g.style.transform=`translate(${TPX(p[0])}px,${TPY(p[1])}px)`});
  const bp=tacBallPos(F);root.querySelector(".tball").style.transform=`translate(${TPX(bp[0])}px,${TPY(bp[1])}px)`;root.querySelector(".tball").classList.toggle("off",!!F.nob);
  let z="";for(const o of F.z||[]){
    if(o.r){const [x,y,w,h]=o.r;z+=`<rect class="zn ${o.k||"info"}" x="${TPX(x)}" y="${TPY(y)}" width="${w*10}" height="${h*10}" rx="8"/>`;if(o.t)z+=`<text class="zt" x="${TPX(x+w/2)}" y="${TPY(y+h/2)+6}" text-anchor="middle">${o.t}</text>`}
    if(o.vl){z+=`<line class="vl ${o.k||""}" x1="${TPX(o.vl)}" y1="20" x2="${TPX(o.vl)}" y2="420"/>`;if(o.t)z+=`<text class="zt sm" x="${TPX(o.vl)}" y="${TPY(o.ty??2)}" text-anchor="middle">${o.t}</text>`}
    if(o.tri){const pts=o.tri.map(r=>tacPos(F,r)).filter(Boolean);z+=`<polygon class="tri" points="${pts.map(p=>TPX(p[0])+","+TPY(p[1])).join(" ")}"/>`}
    if(o.lab){const [r,dx,dy,t,c]=o.lab,p=tacPos(F,r);if(p)z+=`<text class="zt sm ${c||""}" x="${TPX(p[0]+dx)}" y="${TPY(p[1]+dy)}" text-anchor="middle">${t}</text>`}}
  root.querySelector(".tz").innerHTML=z;
  let a="";for(const [f,t,kind] of F.a||[]){const p=tacPos(F,f),q=tacPos(F,t);if(!p||!q)continue;const x1=TPX(p[0]),y1=TPY(p[1]),x2=TPX(q[0]),y2=TPY(q[1]),L=Math.hypot(x2-x1,y2-y1)||1,s1=16/L,s2=(typeof t==="string"?18:4)/L;
    const ax=x1+(x2-x1)*s1,ay=y1+(y2-y1)*s1,bx=x2-(x2-x1)*s2,by=y2-(y2-y1)*s2,k=kind||"pass",m=k==="run"?"r":k==="block"?"x":"p";
    a+=`<line class="ar ${k}" x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" marker-end="url(#tm${m}-${id})"/>`;
    if(k==="block"){const mx=(x1+x2)/2,my=(y1+y2)/2;a+=`<path class="ar blockx" d="M${mx-9},${my-9} L${mx+9},${my+9} M${mx+9},${my-9} L${mx-9},${my+9}"/>`}}
  root.querySelector(".ta").innerHTML=a;
  root.querySelector(".tacnote").innerHTML=F.n?`<b>${k+1}/${D.frames.length}</b> ${F.n}`:"";
  const g=root.querySelector(".tgoal");g.classList.remove("on");if(F.goal&&!inst){void g.getBoundingClientRect();g.classList.add("on");beep([[523,0,.12],[659,.12,.12],[784,.24,.3]])}
  const nb=document.querySelector(`[data-tacnext="${id}"]`);if(nb){const end=k>=D.frames.length-1;nb.textContent=end?"Revoir depuis le début":"Image suivante"}
  document.querySelectorAll(`[data-tacgo^="${id}:"]`).forEach(b=>b.classList.toggle("ghost",+b.dataset.tacgo.split(":")[1]!==k))}
function tacPlay(id){const D=DEMOS[id];if(!D)return;clearDemos();tacShow(id,0,true);let t=1700;
  D.frames.forEach((F,k)=>{if(!k)return;demoTimers.push(setTimeout(()=>tacShow(id,k),t));t+=(F.d||900)+(F.w||1900)})}
function tacNext(id){const D=DEMOS[id];if(!D)return;clearDemos();if(D.i>=D.frames.length-1)return tacShow(id,0,true);tacShow(id,D.i+1)}
{const _is=initStep;initStep=function(){_is();document.querySelectorAll(".lesson .tac").forEach(el=>{const id=el.id.slice(4),D=DEMOS[id];if(!D)return;tacShow(id,0,true);if(!D.btns)demoTimers.push(setTimeout(()=>tacPlay(id),700))})}}

 {id:"f_largeur",sub:"foot",lvl:"CM2",title:"Attaquer : ouvrir le terrain",desc:"Largeur et profondeur",bank:[...FTB.largeur,...FTB.soutien.slice(0,2),FTB.postes[5]],steps:[

 {id:"f_soutien",sub:"foot",lvl:"CM2",title:"Le soutien et les triangles",desc:"Se montrer, lignes de passe",bank:[...FTB.soutien,...FTB.largeur.slice(0,3)],steps:[

function buildQuestions(t,n=t.n||10){
  const out=[],seen=new Set();const add=q=>{const k=qkey(q);if(!seen.has(k)){seen.add(k);out.push(q)}};
  const bank=t.bank?shuffle(t.bank):[];
  if(t.gen&&t.bank){bank.slice(0,Math.ceil(n/2)).forEach(e=>add(fromBank(e)));let g=0;while(out.length<n&&g++<200)add(t.gen())}
  else if(t.gen){let g=0;while(out.length<n&&g++<200)add(t.gen())}
  else bank.slice(0,n).forEach(e=>add(fromBank(e)));
  return shuffle(out);
}

async function initCloud(){

    if(snap.exists){const r=JSON.parse(JSON.stringify(snap.data()));if((r.updatedAt||0)>=(state.updatedAt||0)){state=Object.assign(defaults(),r);saveLocal()}else pushRemote()}
    else if(state.updatedAt)pushRemote();
    syncMode="cloud";if(!quiz)render();

const todayKey=()=>dkey(new Date());
const avg=a=>a&&a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const themeAvg=id=>{const t=state.themes[id];return t?avg(t.scores):null};
function levelInfo(xp){let L=1,acc=0,need=200;while(xp>=acc+need){acc+=need;L++;need=200+100*(L-1)}return {L,into:xp-acc,need,title:TITLES[Math.min(L-1,TITLES.length-1)]}}
function streak(){let n=0;const d=new Date();if(!state.days[dkey(d)]?.quiz)d.setDate(d.getDate()-1);while(state.days[dkey(d)]?.quiz){n++;d.setDate(d.getDate()-1)}return n}
function subMastery(sub){const ts=THEMES.filter(t=>t.sub===sub);const played=ts.map(t=>themeAvg(t.id)).filter(x=>x!==null);return {pct:played.length?Math.round(avg(played)):null,played:played.length,total:ts.length}}
function medal(id){const b=state.themes[id]?.best||0;return b>=100?["or","Or"]:b>=80?["argent","Argent"]:b>=60?["bronze","Bronze"]:null}
const lvlIdx=l=>LEVELS.indexOf(l);
function recommend(sub){const ci=lvlIdx(state.classe);const ts=THEMES.filter(t=>t.sub===sub);
  const near=ts.filter(t=>lvlIdx(t.lvl)<=ci+1);
  const unplayed=near.filter(t=>!state.themes[t.id]).sort((a,b)=>lvlIdx(a.lvl)-lvlIdx(b.lvl));if(unplayed.length)return unplayed[0];
  const weak=near.slice().sort((a,b)=>(themeAvg(a.id)??0)-(themeAvg(b.id)??0));if(weak.length&&(themeAvg(weak[0].id)??0)<90)return weak[0];
  const up=ts.filter(t=>!state.themes[t.id]);if(up.length)return up[0];
  return ts.slice().sort((a,b)=>(themeAvg(a.id)??0)-(themeAvg(b.id)??0))[0]}
function todaySlots(){const di=(new Date().getDay()+6)%7;const tk=todayKey();
  const cnt={};state.history.filter(h=>dkey(new Date(h.d))===tk).forEach(h=>{const k=h.ai?"defi":h.sub;cnt[k]=(cnt[k]||0)+1});
  return state.planning.filter(s=>s.d===di).sort((a,b)=>a.t.localeCompare(b.t)).map(s=>{const done=(cnt[s.sub]||0)>0;if(done)cnt[s.sub]--;return {...s,done}})}
const slotMinutes=s=>{const [h,m]=s.t.split(":").map(Number);return h*60+m};

const dismissed=new Set(),chimed=new Set();let audioCtx=null;
function beep(notes){if(!state.sound)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const t0=audioCtx.currentTime;
  notes.forEach(([f,dt,dur])=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,t0+dt);g.gain.exponentialRampToValueAtTime(.18,t0+dt+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+dt+dur);o.connect(g).connect(audioCtx.destination);o.start(t0+dt);o.stop(t0+dt+dur+.05)})}catch(e){}}
function activeSlot(){const now=new Date(),m=now.getHours()*60+now.getMinutes();return todaySlots().find(s=>!s.done&&!dismissed.has(s.id)&&m>=slotMinutes(s)-5&&m<=slotMinutes(s)+30)}
function nextSlot(){const now=new Date(),m=now.getHours()*60+now.getMinutes();return todaySlots().find(s=>!s.done&&slotMinutes(s)>m)}

  const d=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  const goalPct=Math.min(100,Math.round(td.quiz/state.goal*100));
  const sugg=Object.keys(SUBJECTS).map(k=>({k,m:subMastery(k)})).sort((a,b)=>(a.m.pct??-1)-(b.m.pct??-1)).slice(0,2).map(x=>recommend(x.k));
  return `<header class="top"><div><p class="eyebrow">${d}</p><h1>Salut <span class="mark">${esc(state.name)}</span> !</h1></div>${installEvt?`<button class="btn fluo small" data-install="1">Installer l’appli</button>`:syncPill()}</header>
  ${reminderHTML()}
  <section class="stats">
    <div class="card stat"><span class="eyebrow">Niveau ${lv.L} · ${lv.title}</span><span class="big num">${state.xp} <small style="font-size:16px" class="muted">XP</small></span><div class="bar" aria-label="Progression du niveau"><i style="width:${Math.round(lv.into/lv.need*100)}%"></i></div><span class="muted num" style="font-size:14px">Encore ${lv.need-lv.into} XP pour le niveau ${lv.L+1}</span></div>
    <div class="card stat"><span class="eyebrow">Série</span><span class="big num">${st} jour${st>1?"s":""}</span><span class="muted" style="font-size:14px">${st?"Fais au moins un quiz chaque jour pour la garder.":"Fais un quiz aujourd’hui pour lancer ta série."}</span></div>
    <div class="card stat"><span class="eyebrow">Objectif du jour</span><span class="big num">${td.quiz} / ${state.goal} <small style="font-size:16px" class="muted">quiz</small></span><div class="bar"><i style="width:${goalPct}%;background:${goalPct>=100?"var(--good)":"var(--accent)"}"></i></div><span class="muted" style="font-size:14px">${goalPct>=100?"Objectif atteint, bravo !":"+"+td.xp+" XP gagnés aujourd’hui"}</span></div>
  </section>
  <section class="section"><div class="section-head"><h2>Au programme aujourd’hui</h2>${nx?`<span class="muted">Prochaine séance à ${nx.t.replace(":"," h ")}</span>`:""}</div>
    <div class="card slots">${slots.length?slots.map(s=>`<div class="slot ${s.done?"done":""}"><span class="time">${s.t.replace(":"," h ")}</span>${glyph(s.sub)}<div><div class="ttl"><b>${SUBINFO(s.sub).label}</b></div><span class="muted" style="font-size:14px">${s.min} min</span></div>${s.done?`<span class="tag good">Fait</span>`:`<button class="btn small" data-slot="${s.id}">Commencer</button>`}</div>`).join(""):`<p class="empty">Rien de prévu aujourd’hui. Profites-en pour un quiz libre ou un défi !</p>`}</div></section>
  <section class="section"><h2>Pour progresser</h2><div class="grid">
    <button class="tile" data-rev="1" style="--sc:var(--c-rev)"><div class="tile-head">${glyph("rev")}<div><h3>Révisions</h3><span class="muted">${state.deck.length?`${state.deck.length} question${state.deck.length>1?"s":""} à revoir`:"Aucune erreur à revoir pour l’instant"}</span></div></div></button>
    ${(()=>{const L=nextLesson();return L?`<button class="tile" data-lesson="${L.id}" style="--sc:${SUBINFO(L.sub).c}"><div class="tile-head">${glyph(L.sub)}<div><h3>Cours : ${L.title}</h3><span class="muted">${L.lvl} · avec explications audio</span></div></div></button>`:""})()}
    ${sugg.map(t=>`<button class="tile" data-theme="${t.id}" style="--sc:${SUBJECTS[t.sub].c}"><div class="tile-head">${glyph(t.sub)}<div><h3>${t.title}</h3><span class="muted">${SUBJECTS[t.sub].label} · ${state.themes[t.id]?"à renforcer":"nouveau thème"}</span></div></div></button>`).join("")}
  </div></section>`}

/* ---------- Matières ---------- */
function vSubjects(){return `<header class="top"><div><p class="eyebrow">Toutes les matières</p><h1>Choisis ta matière</h1></div>${syncPill()}</header>${reminderHTML()}
  <div class="grid">${Object.entries(SUBJECTS).map(([k,s])=>{const m=subMastery(k);return `<button class="tile" data-sub="${k}" style="--sc:${s.c}"><div class="tile-head">${glyph(k)}<div><h3>${s.label}</h3><span class="muted">${m.played} / ${m.total} thèmes explorés</span></div></div><div class="bar"><i style="width:${m.pct??0}%;background:${s.c}"></i></div><span class="muted num" style="font-size:14px">${m.pct===null?"Pas encore commencé":"Maîtrise : "+m.pct+" %"}</span></button>`}).join("")}</div>`}
function vSubject(){const s=SUBJECTS[curSub],ci=lvlIdx(state.classe);
  const ts=THEMES.filter(t=>t.sub===curSub&&(lvlFilter==="Tout"||t.lvl===lvlFilter));
  const aiDisabled=!sample;
  return `<header class="top"><div><button class="link" data-go="subjects">← Matières</button><h1 style="display:flex;gap:14px;align-items:center">${glyph(curSub)} ${s.label}</h1></div></header>
  <div class="chips" role="group" aria-label="Filtrer par niveau">${["Tout",...LEVELS].map(l=>`<button class="chip" data-lvl="${l}" aria-pressed="${lvlFilter===l}">${l==="Tout"?"Tous les niveaux":l}</button>`).join("")}</div>
  ${lessonsSection(curSub)}${LESSONS.some(L=>L.sub===curSub)?`<h2>Quiz d’entraînement</h2>`:""}
  <div class="card">${ts.length?ts.map(t=>{const a=themeAvg(t.id),md=medal(t.id),li=lvlIdx(t.lvl);return `<div class="theme-row"><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div class="meta"><h3>${t.title}</h3><span class="tag ${li>ci?"beyond":""}">${t.lvl}${li>ci?" · au-delà":""}</span>${md?`<span class="medal ${md[0]}">${md[1]}</span>`:""}</div><span class="muted">${t.desc}</span>${a!==null?`<div class="bar"><i style="width:${Math.round(a)}%;background:${s.c}"></i></div><span class="muted num" style="font-size:13px">Moyenne ${Math.round(a)} % · meilleur ${state.themes[t.id].best} % · ${state.themes[t.id].plays} quiz</span>`:""}</div><button class="btn small" data-theme="${t.id}" style="background:${s.c}">${a===null?"Commencer":"Rejouer"}</button></div>`}).join(""):`<p class="empty">Pas de thème à ce niveau pour cette matière.</p>`}</div>
  ${!window.claude?"":`<section class="card ai-card" aria-labelledby="aih"><div class="tile-head">${glyph("defi")}<div><h3 id="aih">Défi Claude : des questions toutes neuves</h3><span class="muted">Claude invente un quiz sur le sujet de ton choix, à n’importe quel niveau.</span></div></div>
   ${aiDisabled?`<p class="muted">Ce défi s’active quand l’appli est ouverte dans Claude.</p>`:`<div class="row"><div class="field"><label for="ai-topic">Sujet (facultatif)</label><input class="input" id="ai-topic" placeholder="${curSub==="hg"?"ex. les châteaux forts, les volcans":curSub==="en"?"ex. le sport, les métiers":curSub==="prog"?"ex. les boucles, Internet":"ex. les fractions, les angles"}"></div><div class="field" style="max-width:160px"><label for="ai-lvl">Niveau</label><select class="input" id="ai-lvl">${LEVELS.map(l=>`<option ${l===LEVELS[Math.min(ci+1,3)]?"selected":""}>${l}</option>`).join("")}</select></div><button class="btn fluo" data-ai="${curSub}" ${aiBusy?"disabled":""}>${aiBusy?"Claude prépare…":"Créer mon défi"}</button></div>${aiBusy?`<p class="muted" id="ai-status">Claude écrit tes questions. Ça peut prendre une minute.</p>`:""}`}
  </section>`}`}

/* ---------- Progrès ---------- */
function vProgress(){const H=state.history;const totalQ=H.length,totalMin=Math.round(H.reduce((a,h)=>a+(h.sec||0),0)/60),succ=H.length?Math.round(H.reduce((a,h)=>a+h.c,0)/H.reduce((a,h)=>a+h.n,0)*100):null;
  const days=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push({d,v:state.days[dkey(d)]?.xp||0,today:i===0})}
  const weak=THEMES.filter(t=>state.themes[t.id]&&themeAvg(t.id)<60);
  return `<header class="top"><div><p class="eyebrow">Mon suivi</p><h1>Mes progrès</h1></div>${syncPill()}</header>
  <section class="stats" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">
   <div class="card stat"><span class="eyebrow">Quiz terminés</span><span class="big num">${totalQ}</span></div>
   <div class="card stat"><span class="eyebrow">Temps de travail</span><span class="big num">${totalMin} <small style="font-size:16px" class="muted">min</small></span></div>
   <div class="card stat"><span class="eyebrow">Bonnes réponses</span><span class="big num">${succ===null?"–":succ+" %"}</span></div>
   <div class="card stat"><span class="eyebrow">Médailles</span><span class="big num">${THEMES.filter(t=>medal(t.id)).length}</span></div>
  </section>
  <section class="section"><h2>XP des 14 derniers jours</h2><div class="card" style="padding:14px">${chart(days)}</div></section>
  <section class="section"><h2>Maîtrise par matière</h2><div class="card">${Object.entries(SUBJECTS).map(([k,s])=>{const m=subMastery(k);return `<div class="mastery">${glyph(k)}<div><b>${s.label}</b><div class="bar" style="margin-top:6px"><i style="width:${m.pct??0}%;background:${s.c}"></i></div></div><span class="num" style="text-align:right;font-weight:700">${m.pct===null?"–":m.pct+" %"}</span></div>`}).join("")}</div></section>
  ${weak.length?`<section class="section"><h2>À retravailler</h2><div class="grid">${weak.map(t=>`<button class="tile" data-theme="${t.id}" style="--sc:${SUBJECTS[t.sub].c}"><div class="tile-head">${glyph(t.sub)}<div><h3>${t.title}</h3><span class="muted">Moyenne ${Math.round(themeAvg(t.id))} %</span></div></div></button>`).join("")}</div></section>`:""}
  <section class="section"><h2>Derniers quiz</h2><div class="card tbl-wrap">${H.length?`<table><thead><tr><th>Date</th><th>Matière</th><th>Thème</th><th style="text-align:right">Score</th></tr></thead><tbody>${H.slice(-12).reverse().map(h=>`<tr><td>${new Date(h.d).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}</td><td>${SUBINFO(h.sub).short}</td><td>${esc(h.title)}</td><td class="num">${h.c} / ${h.n}</td></tr>`).join("")}</tbody></table>`:`<p class="empty">Tes résultats apparaîtront ici après ton premier quiz.</p>`}</div></section>`}
function chart(days){const W=700,Hh=190,pl=34,pb=26,pt=18,max=Math.max(100,Math.ceil(Math.max(...days.map(x=>x.v))/50)*50),bw=(W-pl-10)/days.length;
  const y=v=>pt+(Hh-pt-pb)*(1-v/max);const L=["D","L","M","M","J","V","S"];
  let s=`<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="XP gagnés par jour sur 14 jours">`;
  [0,max/2,max].forEach(v=>{s+=`<line class="g" x1="${pl}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`});
  days.forEach((d,i)=>{const x=pl+i*bw+bw*.18,w=bw*.64;if(d.v>0){s+=`<rect class="b ${d.today?"today":""}" x="${x}" y="${y(d.v)}" width="${w}" height="${y(0)-y(d.v)}" rx="4"/><text class="v" x="${x+w/2}" y="${y(d.v)-5}" text-anchor="middle">${d.v}</text>`}
    s+=`<text x="${x+w/2}" y="${Hh-8}" text-anchor="middle">${L[d.d.getDay()]}${d.d.getDate()}</text>`});
  return s+"</svg>"}

/* ---------- Planning ---------- */
function vPlanning(){const di=(new Date().getDay()+6)%7;const td=todaySlots();
  return `<header class="top"><div><p class="eyebrow">Ma semaine</p><h1>Planning</h1></div>${parentOK?`<span class="pill ok"><span class="dot"></span>Mode parent : modification possible</span>`:`<button class="btn ghost small" data-go="parents">Modifier (parents)</button>`}</header>${reminderHTML()}
  <div class="week">${DAYS.map((name,d)=>{const sl=state.planning.filter(s=>s.d===d).sort((a,b)=>a.t.localeCompare(b.t));return `<div class="card day ${d===di?"today":""}"><h3>${name}${d===di?' <span class="tag">aujourd’hui</span>':""}</h3>${sl.length?sl.map(s=>{const done=d===di&&td.find(x=>x.id===s.id)?.done;return `<div class="pslot" style="--sc:${SUBINFO(s.sub).c}"><span class="muted num">${s.t.replace(":"," h ")} · ${s.min} min</span><b>${SUBINFO(s.sub).short}${done?" ✓":""}</b>${parentOK?`<button class="del" data-del="${s.id}">Retirer</button>`:""}</div>`}).join(""):`<span class="muted" style="font-size:14px">Repos</span>`}</div>`}).join("")}</div>
  ${parentOK?`<section class="card" style="padding:18px;display:flex;flex-direction:column;gap:14px"><h2>Ajouter une séance</h2><div class="row">
   <div class="field"><label for="p-d">Jour</label><select class="input" id="p-d">${DAYS.map((n,i)=>`<option value="${i}">${n}</option>`).join("")}</select></div>
   <div class="field"><label for="p-t">Heure</label><input class="input" id="p-t" type="time" value="17:30"></div>
   <div class="field"><label for="p-s">Matière</label><select class="input" id="p-s">${Object.entries({...SUBJECTS,...EXTRA}).map(([k,s])=>`<option value="${k}">${s.label}</option>`).join("")}</select></div>
   <div class="field" style="max-width:130px"><label for="p-m">Durée (min)</label><input class="input" id="p-m" type="number" min="5" max="90" step="5" value="20"></div>
   <button class="btn" data-addslot="1">Ajouter</button></div></section>`:""}
  <p class="muted" style="font-size:15px">Quand l’appli est ouverte à l’heure d’une séance, un rappel s’affiche en haut de l’écran avec un petit signal sonore. Une séance est cochée dès qu’un quiz de la matière est terminé ce jour-là.</p>`}

/* ---------- Parents ---------- */
function vParents(){if(!parentOK)return `<header class="top"><div><p class="eyebrow">Espace parents</p><h1>Code parent</h1></div></header>
  <div class="card" style="padding:26px;display:flex;flex-direction:column;gap:18px;align-items:center;max-width:420px;margin:0 auto;width:100%">
   <p class="muted" style="text-align:center">Entre le code à 4 chiffres pour voir le bilan et modifier le planning.</p>
   <div class="pin-dots">${[0,1,2,3].map(i=>`<i class="${i<pinBuf.length?"on":""}"></i>`).join("")}</div>
   <div class="pin">${[1,2,3,4,5,6,7,8,9,"C",0,"←"].map(k=>`<button data-pin="${k}" aria-label="${k==="C"?"Effacer":k==="←"?"Retour":k}">${k}</button>`).join("")}</div></div>`;
  const since=Date.now()-7*864e5,W=state.history.filter(h=>h.d>=since);
  const rows=Object.entries({...SUBJECTS,rev:EXTRA.rev}).map(([k,s])=>{const h=W.filter(x=>x.sub===k);const n=h.reduce((a,x)=>a+x.n,0),c=h.reduce((a,x)=>a+x.c,0);return {k,s,q:h.length,min:Math.round(h.reduce((a,x)=>a+(x.sec||0),0)/60),pct:n?Math.round(c/n*100):null}});
  const weak=THEMES.filter(t=>state.themes[t.id]&&themeAvg(t.id)<60).map(t=>t.title);
  const beyond=THEMES.filter(t=>lvlIdx(t.lvl)>lvlIdx(state.classe)&&state.themes[t.id]).length;
  return `<header class="top"><div><p class="eyebrow">Espace parents</p><h1>Bilan de ${esc(state.name)}</h1></div><button class="btn ghost small" data-lock="1">Verrouiller</button></header>
  <section class="section"><h2>Les 7 derniers jours</h2><div class="card tbl-wrap"><table><thead><tr><th>Matière</th><th style="text-align:right">Quiz</th><th style="text-align:right">Minutes</th><th style="text-align:right">Réussite</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.s.label}</td><td class="num">${r.q}</td><td class="num">${r.min}</td><td class="num" style="color:${r.pct===null?"var(--muted)":r.pct>=80?"var(--good)":r.pct<60?"var(--bad)":"var(--warn)"}">${r.pct===null?"–":r.pct+" %"}</td></tr>`).join("")}</tbody></table></div>
  <p class="muted">${weak.length?"Points faibles : "+weak.join(", ")+".":"Aucun point faible repéré pour l’instant."} ${beyond} thème${beyond>1?"s":""} au-delà du ${state.classe} déjà exploré${beyond>1?"s":""}.</p></section>
  <section class="section"><h2>Cours</h2><div class="card tbl-wrap"><table><thead><tr><th>Cours</th><th>Matière</th><th>Niveau</th><th style="text-align:right">Meilleur score</th><th style="text-align:right">Essais</th></tr></thead><tbody>${LESSONS.map(L=>{const s=state.lessons?.[L.id];return `<tr><td>${L.title}</td><td>${SUBINFO(L.sub).short}</td><td>${L.lvl}</td><td class="num" style="color:${s?.best==null?"var(--muted)":s.best>=80?"var(--good)":s.best<50?"var(--bad)":"var(--warn)"}">${s?.best==null?(s?"cours lu":"–"):s.best+" %"}</td><td class="num">${s?.tries||0}</td></tr>`}).join("")}</tbody></table></div></section>
  <section class="card" style="padding:18px;display:flex;flex-direction:column;gap:14px"><h2>Réglages</h2><div class="row">
   <div class="field"><label for="s-name">Prénom</label><input class="input" id="s-name" value="${esc(state.name)}"></div>
   <div class="field"><label for="s-cl">Classe actuelle</label><select class="input" id="s-cl">${LEVELS.map(l=>`<option ${l===state.classe?"selected":""}>${l}</option>`).join("")}</select></div>
   <div class="field"><label for="s-goal">Objectif quotidien (quiz)</label><select class="input" id="s-goal">${[1,2,3,4,5].map(n=>`<option ${n===state.goal?"selected":""}>${n}</option>`).join("")}</select></div>
   <div class="field"><label for="s-pin">Nouveau code parent</label><input class="input" id="s-pin" inputmode="numeric" maxlength="4" placeholder="4 chiffres"></div>
   <div class="field" style="max-width:150px"><label for="s-snd">Sons</label><select class="input" id="s-snd"><option value="1" ${state.sound?"selected":""}>Activés</option><option value="0" ${!state.sound?"selected":""}>Coupés</option></select></div>
  </div><div><button class="btn" data-savesettings="1">Enregistrer</button></div></section>
  ${famSection()}${isParentDevice()?"":`<section class="card" style="padding:18px;display:flex;flex-direction:column;gap:12px"><h2>Sauvegarde</h2><p class="muted">Les progrès sont gardés sur cette tablette. Fais une sauvegarde de temps en temps, ou avant de changer de tablette.</p><div class="tools"><button class="btn ghost small" data-export="1">Télécharger une sauvegarde</button><label class="btn ghost small" for="imp-file" style="cursor:pointer">Restaurer une sauvegarde</label><input type="file" id="imp-file" accept="application/json,.json" hidden></div></section>`}
  ${isParentDevice()?"":`<section class="card" style="padding:18px;display:flex;flex-direction:column;gap:12px"><h2>Données</h2><p class="muted">Efface les XP, les scores, l’historique et les révisions. Le planning et les réglages sont gardés.</p><div><button class="btn danger small" data-reset="1" id="reset-btn">Effacer la progression</button></div></section>`}`}

/* ================= quiz ================= */
function startTheme(id){const t=THEME[id];if(!t)return;openQuiz({title:t.title,sub:t.sub,th:id,qs:buildQuestions(t)})}
function startRevision(){if(!state.deck.length){toast("Aucune question à revoir : voici un thème conseillé.");const k=Object.keys(SUBJECTS).sort((a,b)=>(subMastery(a).pct??-1)-(subMastery(b).pct??-1))[0];return startTheme(recommend(k).id)}
  const items=shuffle(state.deck).slice(0,10);openQuiz({title:"Révisions",sub:"rev",th:"rev",qs:items.map(x=>x.q),rev:items.map(x=>x.key)})}
function startSlot(id){const s=state.planning.find(x=>x.id===id);if(!s)return;dismissed.add(id);
  if(SUBJECTS[s.sub])return startTheme(recommend(s.sub).id);if(s.sub==="rev")return startRevision();
  go("subjects");toast("Choisis une matière, puis lance ton Défi Claude en bas de la page.")}
function openQuiz(o){quiz={...o,i:0,c:0,answered:false,start:Date.now(),results:[],quitArm:false,explain:null,work:{pts:[],closed:false,col:{},crayon:0}};document.getElementById("quiz").hidden=false;document.body.style.overflow="hidden";renderQuiz();autoListen()}
function closeQuiz(){if(window.speechSynthesis)speechSynthesis.cancel();quiz=null;document.getElementById("quiz").hidden=true;document.body.style.overflow="";render()}
const canSpeak=()=>"speechSynthesis" in window;
function speak(text){if(!canSpeak())return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-GB";u.rate=.88;const v=speechSynthesis.getVoices().find(v=>/^en(-|_)GB/i.test(v.lang))||speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function autoListen(){const q=quiz&&quiz.qs[quiz.i];if(q&&q.listen)setTimeout(()=>speak(q.listen),250)}
const SPK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
function renderQuiz(){const el=document.getElementById("quiz");const si=SUBINFO(quiz.sub);
  if(quiz.done)return renderResult();
  const q=quiz.qs[quiz.i],n=quiz.qs.length,a=quiz.answered;
  let body=`<div class="qwrap" style="--sc:${si.c}"><div class="qtop"><button class="qclose" data-qclose="1">${quiz.quitArm?"Quitter ?":"✕"}</button><div class="bar"><i style="width:${(quiz.i+(a?1:0))/n*100}%"></i></div><span class="num muted" style="font-weight:700">${quiz.i+1} / ${n}</span></div>
   <p class="eyebrow">${esc(si.label)} · ${esc(quiz.title)}</p>`;
  if(q.passage)body+=`<div class="card passage">${esc(q.passage)}${canSpeak()?`<div style="margin-top:10px"><button class="listen" data-say="${esc(q.passage)}">${SPK} Écouter le texte</button></div>`:""}</div>`;
  body+=`<p class="qtext">${esc(q.q)}</p>`;
  if(q.code)body+=`<pre class="code">${esc(q.code)}</pre>`;

async function aiQuiz(sub){if(!sample||aiBusy)return;const topic=(document.getElementById("ai-topic")?.value||"").trim(),lvl=document.getElementById("ai-lvl")?.value||"6e";
  aiBusy=new AbortController();render();
  const prompt=`Tu es un professeur bienveillant et rigoureux. Prépare un quiz pour ${state.name}, élève français de ${state.classe} (environ 10 ans) qui veut aller plus loin que son programme.
Matière : ${SUBJECTS[sub].label}. Niveau visé : ${lvl} (programmes officiels de l’Éducation nationale). Sujet : ${topic||"au choix, varié dans la matière"}.
Écris 8 questions à choix multiples, de difficulté progressive. Chaque fait doit être exact et vérifié ; une seule bonne réponse par question ; mauvaises réponses plausibles.
${sub==="en"?"Les questions testent l’anglais : consignes en français, réponses en anglais quand c’est pertinent.":"Tout en français."}
Réponds uniquement par un tableau JSON : [{"q":"question","choices":["A","B","C","D"],"answer":0,"expl":"explication courte et claire (1 à 2 phrases)"}] où "answer" est l’indice (0 à 3) de la bonne réponse dans "choices".`;
  try{const data=await sample.json(prompt,{signal:aiBusy.signal,cache:false});
    const qs=(Array.isArray(data)?data:[]).filter(x=>x&&typeof x.q==="string"&&Array.isArray(x.choices)&&x.choices.length>=2&&x.choices.length<=4&&Number.isInteger(x.answer)&&x.answer>=0&&x.answer<x.choices.length)
      .map(x=>{const good=String(x.choices[x.answer]);return mcq(x.q,good,x.choices.filter((_,i)=>i!==x.answer).map(String),String(x.expl||""))});
    aiBusy=null;if(qs.length<3){render();return toast("Claude n’a pas réussi ce quiz. Réessaie avec un autre sujet.")}
    openQuiz({title:"Défi "+(topic||SUBJECTS[sub].short)+" ("+lvl+")",sub,th:"ai_"+sub,ai:true,qs});
  }catch(e){aiBusy=null;render();if(e&&e.code==="not_granted"||e&&e.code==="sampling_disabled"){sample=null;render();toast("Le défi Claude n’est pas autorisé sur cet appareil.")}else if(e&&e.code==="rate_limited")toast("Trop de défis d’un coup. Réessaie dans un moment.");else if(e&&e.code!=="cancelled")toast("Le défi n’a pas pu être créé. Réessaie.")}}
async function aiExplain(){const q=quiz.qs[quiz.i];quiz.explain="";renderQuiz();
  const given=q.type==="mcq"?q.choices[quiz.picked]:quiz.typed;
  try{await sample(`Explique simplement à un enfant de 10 ans pourquoi la bonne réponse à la question « ${q.q}${q.code?"\n"+q.code:""} » est « ${goodText(q)} ». Il a répondu « ${given} ». Montre où est son erreur, sans le gronder. 3 phrases maximum, en français, sans mise en forme.`,{modelTier:"quick",onText:({text})=>{if(quiz){quiz.explain=text;renderQuiz()}}})}
  catch(e){if(quiz){quiz.explain="Claude n’a pas pu répondre cette fois.";renderQuiz()}}}

  catch(e){fsync.status=navigator.onLine===false?"offline":"err";fsync.msg=""}
  finally{fsync.busy=false;if(fsync.pending){fsync.pending=false;scheduleSync(300)}
    if(fsync.status!==fsync.prev&&view==="parents"&&!quiz&&!lesson)render();else{const p=document.getElementById("sync-pill");if(p)p.outerHTML=syncPill()}fsync.prev=fsync.status}}
const ago=t=>{const s=Math.round((Date.now()-t)/1000);return s<60?"à l’instant":s<3600?`il y a ${Math.round(s/60)} min`:`il y a ${Math.round(s/3600)} h`};
function famStatusText(){if(!fam)return "Progrès gardés sur cette tablette";
  if(fsync.status==="ok")return (isParentDevice()?`Suivi de ${esc(state.name)} · à jour `:"Synchronisé ")+ago(fsync.last);
  if(fsync.status==="offline")return isParentDevice()?"Hors ligne : dernières données affichées":"Hors ligne : envoi dès le retour d’Internet";
  if(fsync.status==="err")return fsync.msg?"Synchronisation : "+fsync.msg:"Synchronisation en attente";
  return "Synchronisation…"}
setInterval(()=>{if(fam&&document.visibilityState==="visible")doSync()},isParentDevice()?30000:60000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")scheduleSync(200)});
window.addEventListener("online",()=>scheduleSync(200));
const PARENT_MSG="Sur ce téléphone, tu suis les progrès. Les quiz et les exercices se font sur la tablette de l’enfant.";
for(const fnName of ["startTheme","startRevision","startSlot","startLessonEx","aiQuiz"]){const orig=window[fnName];if(typeof orig==="function")window[fnName]=function(...a){if(isParentDevice())return toast(PARENT_MSG);return orig.apply(this,a)}}
if(isParentDevice())parentOK=true;
async function famJoin(code,role){code=normCode(code);if(code.length<20)return toast("Le code famille fait 24 caractères.");
  const prev=fam;fam={code,role};toast("Connexion…");
  try{const remote=await fbPull(code);if(!remote){fam=prev;return toast("Aucun enfant trouvé avec ce code. Vérifie-le sur la tablette.")}
    saveFam();state=Object.assign(defaults(),remote);saveLocal();lastSetSig=setSig();if(role==="parent")parentOK=true;fsync.status="ok";fsync.last=Date.now();toast(role==="parent"?`Tu suis maintenant ${remote.name||"l’enfant"}.`:"Tablette reliée, progrès récupérés.");go("home")}
  catch(e){fam=prev;toast("Pas de connexion. Réessaie avec Internet.")}}
function famSection(){
  if(isParentDevice())return `<section class="card" style="padding:18px;display:flex;flex-direction:column;gap:12px"><h2>Suivi à distance</h2><p>Ce téléphone suit les progrès de <b>${esc(state.name)}</b>. Les données se mettent à jour toutes les 30 secondes quand l’appli est ouverte. Tu peux modifier le planning ici : la tablette le reçoit automatiquement.</p><p class="muted">Code famille : <span class="code">${fmtCode(fam.code)}</span></p><div><button class="btn ghost small" data-famoff="1">Ne plus suivre sur ce téléphone</button></div></section>`;
  if(!fam)return `<section class="card" style="padding:18px;display:flex;flex-direction:column;gap:12px"><h2>Suivre depuis un téléphone</h2><p class="muted">Active le suivi pour voir les progrès, les cours et le planning depuis ton téléphone. Les données sont envoyées en ligne, protégées par un code famille secret.</p><div class="tools"><button class="btn" data-famon="1">Activer le suivi</button></div>
    <details><summary class="muted" style="cursor:pointer">J’ai déjà un code famille (nouvelle tablette)</summary><div class="row" style="margin-top:10px"><div class="field"><label for="fam-link">Code famille</label><input class="input" id="fam-link" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX"></div><button class="btn ghost" data-famlink="1">Relier cette tablette</button></div><p class="muted" style="font-size:14px">Les progrès enregistrés en ligne remplaceront ceux de cette tablette.</p></details></section>`;
  return `<section class="card" style="padding:18px;display:flex;flex-direction:column;gap:12px"><h2>Suivre depuis un téléphone</h2><p>Sur ton téléphone, ouvre <b>iso83-tn.github.io/mon-academie</b>, choisis « Je suis parent », puis tape ce code :</p><p class="code big" id="fam-code">${fmtCode(fam.code)}</p><div class="tools"><button class="btn ghost small" data-famcopy="1">Copier le code</button><button class="btn ghost small" data-famoff="1">Désactiver le suivi</button></div><p class="muted" style="font-size:14px">Garde ce code pour toi : il donne accès aux progrès. ${esc(famStatusText())}.</p></section>`}

render();
initCloud();
lastSetSig=setSig();if(fam)scheduleSync(400);
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{});
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!had)return;const t=document.getElementById("toast");t.innerHTML='Nouvelle version disponible <button class="btn small fluo" data-reload="1" style="margin-left:10px">Mettre à jour</button>';t.hidden=false;clearTimeout(toast.t)})}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
