<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mon Académie</title>
<meta name="theme-color" content="#2747d8">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="fonts.css">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout : cahier Seyès — rail de navigation à gauche en paysage (tablette), barre en bas en portrait ; surligneur fluo comme seul effet fort. */
:root{
  --paper:#f6f8fc; --card:#ffffff; --ink:#15213b; --muted:#5b6782; --line:#dbe2f0;
  --rule:rgba(39,71,216,.055); --rule-strong:rgba(39,71,216,.11); --margin:#e7718d;
  --accent:#2747d8; --accent-ink:#ffffff; --fluo:#ffe14d; --fluo-ink:#2a2300;
  --good:#16884f; --good-bg:#e3f5ea; --bad:#c8392f; --bad-bg:#fbe7e5; --warn:#b26b00;
  --c-maths:#2747d8; --c-geom:#0c8f81; --c-prog:#7438cc; --c-hg:#9a5424; --c-fr:#c92a62; --c-en:#0b7fb3; --c-rev:#5b6782; --c-defi:#b07a00; --c-elec:#d9480f; --c-3d:#2b8a3e; --c-foot:#5c940d;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", Roboto, system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Menlo, monospace;
  --r:14px; --shadow:0 1px 0 rgba(21,33,59,.05), 0 6px 18px -10px rgba(21,33,59,.25);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#132024; --card:#1b2c31; --ink:#edf3ee; --muted:#9db0ad; --line:#2c4247;
  --rule:rgba(237,243,238,.035); --rule-strong:rgba(237,243,238,.06); --margin:#c25a74;
  --accent:#8eaaff; --accent-ink:#0d1a3d; --fluo:#ffe14d; --fluo-ink:#2a2300;
  --good:#5fd396; --good-bg:#173a2a; --bad:#ff8a7f; --bad-bg:#43211f; --warn:#f0b65a;
  --c-maths:#8eaaff; --c-geom:#4fd2c2; --c-prog:#b994ff; --c-hg:#e3a072; --c-fr:#ff86b0; --c-en:#5cc6f2; --c-rev:#9db0ad; --c-defi:#f2c34d; --c-elec:#ff9a5c; --c-3d:#69db7c; --c-foot:#a9e34b;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#132024; --card:#1b2c31; --ink:#edf3ee; --muted:#9db0ad; --line:#2c4247;
  --rule:rgba(237,243,238,.035); --rule-strong:rgba(237,243,238,.06); --margin:#c25a74;
  --accent:#8eaaff; --accent-ink:#0d1a3d; --fluo:#ffe14d; --fluo-ink:#2a2300;
  --good:#5fd396; --good-bg:#173a2a; --bad:#ff8a7f; --bad-bg:#43211f; --warn:#f0b65a;
  --c-maths:#8eaaff; --c-geom:#4fd2c2; --c-prog:#b994ff; --c-hg:#e3a072; --c-fr:#ff86b0; --c-en:#5cc6f2; --c-rev:#9db0ad; --c-defi:#f2c34d; --c-elec:#ff9a5c; --c-3d:#69db7c; --c-foot:#a9e34b;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.6); color-scheme:dark }

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;
  background-image:linear-gradient(var(--rule-strong) 1px,transparent 1px),linear-gradient(var(--rule) 1px,transparent 1px);
  background-size:100% 32px,100% 8px;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.01em}
h2{font-size:22px;font-weight:700}
h3{font-size:18px;font-weight:700}
p{margin:0}
.mark{background:linear-gradient(transparent 58%,var(--fluo) 58%,var(--fluo) 92%,transparent 92%);padding:0 .1em;color:inherit}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:96px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:6px;padding:14px 8px;
  padding-left:max(8px,env(safe-area-inset-left,0px));background:var(--card);border-right:1px solid var(--line)}
.brand{display:grid;place-items:center;height:56px;margin-bottom:8px;font-family:var(--f-display);font-weight:800;font-size:22px;
  color:var(--accent);border-bottom:2px solid var(--margin)}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border:0;background:none;border-radius:12px;
  color:var(--muted);font-size:13px;font-weight:700}
.nav-btn svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-btn[aria-current="page"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
main{min-width:0;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:auto 0 0 0;top:auto;height:auto;flex-direction:row;justify-content:space-around;z-index:20;
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));
    border-right:0;border-top:1px solid var(--line)}
  .brand{display:none}
  .nav-btn{flex:1;padding:6px 2px}
  main{padding-bottom:96px}
}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top > div{display:flex;flex-direction:column;gap:6px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:700;
  background:var(--card);border:1px solid var(--line);color:var(--muted)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok .dot{background:var(--good)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.section{display:flex;flex-direction:column;gap:12px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:0;
  background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{min-height:40px;padding:0 14px;font-size:15px}
.btn.fluo{background:var(--fluo);color:var(--fluo-ink)}
.btn.danger{background:var(--bad);color:#fff}
.link{border:0;background:none;color:var(--accent);font-weight:700;padding:6px 0}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stat{padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.stat .big{font-family:var(--f-display);font-size:34px;font-weight:800;line-height:1}
.bar{height:10px;border-radius:99px;background:color-mix(in srgb,var(--ink) 9%,transparent);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--accent)}
@media (max-width:640px){.stats{grid-template-columns:minmax(0,1fr)}}

/* slots */
.slots{display:flex;flex-direction:column}
.slot{display:grid;grid-template-columns:64px 44px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.slot:first-child{border-top:0}
.slot .time{font-family:var(--f-mono);font-size:15px;color:var(--muted)}
.slot.done .ttl{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.glyph{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;font-family:var(--f-display);font-weight:800;font-size:15px;
  color:#fff;background:var(--sc,var(--accent));letter-spacing:-.02em;flex:none}
:root[data-theme="dark"] .glyph{color:#0f1a1d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .glyph{color:#0f1a1d}}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;letter-spacing:.03em;
  background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--muted)}
.tag.beyond{background:color-mix(in srgb,var(--fluo) 70%,transparent);color:var(--fluo-ink)}
.tag.good{background:var(--good-bg);color:var(--good)}
@media (max-width:520px){.slot{grid-template-columns:44px minmax(0,1fr) auto}.slot .time{display:none}}

/* banner */
.banner{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r);background:var(--fluo);color:var(--fluo-ink);flex-wrap:wrap}
.banner b{font-family:var(--f-display);font-size:19px}
.banner .grow{flex:1;min-width:180px}
.banner .btn{background:var(--fluo-ink);color:var(--fluo)}
.banner .x{border:0;background:none;color:var(--fluo-ink);font-weight:700;padding:8px}

/* cards grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tile{padding:18px;display:flex;flex-direction:column;gap:12px;text-align:left;border:1px solid var(--line);min-width:0}
button.tile{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
button.tile:hover{border-color:var(--sc,var(--accent))}
.tile-head{display:flex;gap:12px;align-items:center;min-width:0}
.tile-head > div{min-width:0}
.medal{font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px}
.medal.or{background:#f7d34a;color:#3a2c00}.medal.argent{background:#cfd6e2;color:#253047}.medal.bronze{background:#e2a974;color:#3b1f05}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.theme-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 18px}
.theme-row + .theme-row{border-top:1px solid var(--line)}
.theme-row .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.theme-row .bar{max-width:280px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:14px;font-weight:700;color:var(--muted)}
.input,select.input{min-height:48px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);width:100%}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row > .field{flex:1;min-width:140px}
.ai-card{padding:18px;display:flex;flex-direction:column;gap:14px;border:1.5px dashed var(--c-defi);background:color-mix(in srgb,var(--c-defi) 7%,var(--card))}

/* progress */
.chart{width:100%;height:auto;display:block}
.chart .b{fill:var(--accent)}.chart .b.today{fill:var(--c-defi)}
.chart text{fill:var(--muted);font-size:13px;font-family:var(--f-body)}
.chart .v{fill:var(--ink);font-weight:700}
.chart .g{stroke:var(--line);stroke-width:1}
.mastery{display:grid;grid-template-columns:44px minmax(0,1fr) 54px;gap:12px;align-items:center;padding:10px 16px}
.mastery .bar{height:12px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:10px 14px;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:0}
td.num{text-align:right}

/* planning */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day{padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.day.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.day h3{font-size:16px}
.pslot{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:10px;border-left:4px solid var(--sc);background:color-mix(in srgb,var(--sc) 10%,transparent);font-size:14px;min-width:0}
.pslot b{font-size:14px}
.pslot .del{align-self:flex-start;border:0;background:none;color:var(--bad);font-weight:700;font-size:13px;padding:2px 0}
@media (max-width:980px){.week{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}

/* pin */
.pin{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}
.pin button{height:64px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-family:var(--f-display);font-size:24px;font-weight:700}
.pin-dots{display:flex;gap:12px;justify-content:center}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.pin-dots i.on{background:var(--ink)}

/* quiz */
.quiz{position:fixed;inset:0;z-index:50;background:var(--paper);overflow-y:auto;
  background-image:linear-gradient(var(--rule-strong) 1px,transparent 1px),linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% 32px,100% 8px;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.qwrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-height:100%}
.qtop{display:flex;align-items:center;gap:12px}
.qtop .bar{flex:1;height:12px}
.qtop .bar > i{background:var(--sc,var(--accent));transition:width .3s}
.qclose{min-width:48px;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:700;padding:0 12px}
.qtext{font-family:var(--f-display);font-size:clamp(22px,3.2vw,30px);font-weight:700;line-height:1.2;text-wrap:pretty}
.passage{padding:14px 16px;font-size:17px;line-height:1.55}
pre.code{margin:0;padding:14px 16px;border-radius:12px;background:#0f1730;color:#e7ecff;font-family:var(--f-mono);font-size:16px;line-height:1.55;overflow-x:auto}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:600px){.choices{grid-template-columns:minmax(0,1fr)}}
.choice{min-height:68px;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);text-align:left;font-size:19px;font-weight:700;
  display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);min-width:0;overflow-wrap:anywhere}
.choice .k{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:color-mix(in srgb,var(--ink) 8%,transparent);font-size:14px;color:var(--muted)}
.choice:hover:not(:disabled){border-color:var(--sc,var(--accent))}
.choice.right{border-color:var(--good);background:var(--good-bg)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice:disabled{cursor:default}
.answer-row{display:flex;gap:12px;flex-wrap:wrap}
.answer-row .input{flex:1;min-width:180px;font-size:22px;min-height:60px;font-weight:700;background:var(--card)}
.answer-row .input.right{border-color:var(--good);background:var(--good-bg)}
.answer-row .input.wrong{border-color:var(--bad);background:var(--bad-bg)}
.listen{align-self:flex-start;min-height:56px;padding:0 22px;border-radius:999px;border:0;background:var(--c-en);color:#fff;font-weight:700;font-size:17px;display:inline-flex;gap:10px;align-items:center}
.listen svg{width:22px;height:22px;fill:currentColor}
.feedback{padding:16px 18px;border-radius:var(--r);display:flex;flex-direction:column;gap:8px}
.feedback.ok{background:var(--good-bg)}.feedback.ko{background:var(--bad-bg)}
.feedback .verdict{font-family:var(--f-display);font-weight:800;font-size:22px}
.feedback.ok .verdict{color:var(--good)}.feedback.ko .verdict{color:var(--bad)}
.feedback .ai{font-style:italic}
.qnext{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;margin-top:auto}
.result{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding:30px 0}
.score{font-family:var(--f-display);font-size:88px;font-weight:800;line-height:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--paper);
  padding:12px 18px;border-radius:12px;font-weight:700;max-width:calc(100vw - 32px)}
.empty{padding:22px;text-align:center;color:var(--muted)}
.qsplit{display:flex;flex-direction:column;gap:14px}
.qside{display:flex;flex-direction:column;gap:12px;min-width:0}
.figbox{padding:10px}
.fig{display:block;width:100%;height:min(42vh,340px);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.fig.big{height:min(56vh,440px)}
.fig.wide{height:auto;max-height:min(56vh,440px)}
@media (min-width:760px) and (orientation:landscape){.qsplit{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start}.qsplit .choices{grid-template-columns:minmax(0,1fr)}.fig,.fig.big{height:min(62vh,440px)}.fig.wide{height:auto;max-height:min(62vh,440px)}}
.fig .sh{fill:color-mix(in srgb,var(--sc) 20%,transparent);stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
.fig .cod{fill:none;stroke:var(--ink);stroke-width:1.6}
.fig .ax{stroke:var(--bad);stroke-width:3;stroke-dasharray:9 6}
.fig .ray,.fig .ln{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.fig .arc{fill:none;stroke:var(--sc);stroke-width:3}
.fig .dotv{fill:var(--ink)}
.fig .gl{stroke:var(--line);stroke-width:1}
.fig .cellf{fill:color-mix(in srgb,var(--sc) 45%,transparent);stroke:var(--ink);stroke-width:1.2}
.fig .ed{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;fill:none}
.fig .ed.hid{stroke-dasharray:6 5;stroke-width:1.8;opacity:.7}
.fig .face{fill:color-mix(in srgb,var(--sc) 20%,transparent)}
.fig .face2{fill:color-mix(in srgb,var(--sc) 36%,transparent)}
.fig .lbl{fill:var(--ink);font:800 18px var(--f-display)}
.fig .gdot{fill:var(--muted)}
.fig .hitp,.fig .hit{fill:transparent;cursor:pointer}
.fig .dline{fill:none;stroke:var(--sc);stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.fig .dpoly{fill:color-mix(in srgb,var(--sc) 25%,transparent);stroke:var(--sc);stroke-width:3.5;stroke-linejoin:round}
.fig .dpoly.ok{fill:color-mix(in srgb,var(--good) 25%,transparent);stroke:var(--good)}
.fig .dpoly.ko{fill:color-mix(in srgb,var(--bad) 18%,transparent);stroke:var(--bad)}
.fig .vtx{fill:var(--sc)}
.fig .first{fill:var(--card);stroke:var(--sc);stroke-width:3.5}
.fig .csh{fill:color-mix(in srgb,var(--ink) 4%,transparent);stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
.fig .csh.okc{stroke:var(--good);stroke-width:5}
.fig .csh.miss{stroke:var(--good);stroke-width:5;stroke-dasharray:8 6}
.fig .csh.bad{stroke:var(--bad);stroke-width:5}
.fig .cell{fill:transparent;stroke:var(--line);stroke-width:1.5;cursor:pointer}
.fig .cell.fix{fill:color-mix(in srgb,var(--sc) 60%,transparent);stroke:var(--ink);cursor:default}
.fig .cell.miss{stroke:var(--good);stroke-width:3.5;stroke-dasharray:6 4}
.fig .cell.bad{stroke:var(--bad);stroke-width:3.5}
.crayons{display:flex;gap:12px;flex-wrap:wrap}
.crayon{width:50px;height:50px;border-radius:50%;border:4px solid var(--card);box-shadow:0 0 0 2px var(--line)}
.crayon[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink);transform:scale(1.08)}
.tools{display:flex;gap:10px;flex-wrap:wrap}

<script>
"use strict";
/* ================= utilitaires ================= */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pad=n=>String(n).padStart(2,"0");
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const r2=x=>Math.round(x*100)/100, r3=x=>Math.round(x*1000)/1000;
const fmt=n=>{const v=r3(n);return (v<0?"−":"")+Math.abs(v).toLocaleString("fr-FR",{maximumFractionDigits:3}).replace(/ | /g," ")};
const fs=n=>n<0?`(−${-n})`:`(+${n})`;
const SUP={0:"⁰",1:"¹",2:"²",3:"³",4:"⁴",5:"⁵",6:"⁶",7:"⁷",8:"⁸",9:"⁹"};
const sup=n=>String(n).split("").map(c=>SUP[c]).join("");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const normNum=s=>String(s).replace(/[\s  ]/g,"").replace(/−/g,"-").replace(",",".").replace(/[a-zA-Zé²³€]+$/,"");
const normTxt=s=>String(s).toLowerCase().normalize("NFC").replace(/[’`]/g,"'").replace(/\s+/g," ").replace(/[.!]$/,"").trim();

function mcq(q,good,wrongs,expl,ex={}){
  const w=[];for(const x of wrongs){const s=String(x);if(s!==String(good)&&!w.includes(s))w.push(s)}
  const choices=shuffle([String(good),...w.slice(0,3)]);
  return {type:"mcq",q,choices,answer:choices.indexOf(String(good)),expl,...ex};
}
function inp(q,ans,expl,ex={}){
  const numeric=typeof ans==="number";
  return {type:"input",q,ans:numeric?ans:String(ans),numeric,expl,alt:[],tol:0,unit:"",...ex};
}
function fromBank(e){const [q,good,wr,expl,ex]=e;return wr===null?inp(q,good,expl,ex||{}):mcq(q,good,wr,expl,ex||{})}
function isRight(qo,val){
  if(qo.type==="mcq")return val===qo.answer;
  if(qo.type==="color")return Array.isArray(val)&&val.map(Number).sort((a,b)=>a-b).join()===qo.targets.slice().sort((a,b)=>a-b).join();
  if(qo.type==="sym")return Array.isArray(val)&&val.slice().sort().join(";")===qo.target.join(";");
  if(qo.type==="draw")return evalDraw(qo,val).ok;
  const v=String(val).trim(); if(!v)return false;
  if(qo.check==="bin")return /^[01]+$/.test(v)&&parseInt(v,2)===qo.n;
  if(qo.numeric){const n=parseFloat(normNum(v));return !isNaN(n)&&Math.abs(n-qo.ans)<=(qo.tol||1e-9)}
  const t=normTxt(v);return [qo.ans,...(qo.alt||[])].some(a=>normTxt(a)===t);
}
const goodText=qo=>qo.type==="mcq"?qo.choices[qo.answer]:qo.type==="draw"?DRAW[qo.task].name:qo.type==="color"?"les bonnes formes":qo.type==="sym"?"le dessin symétrique":(qo.numeric?fmt(qo.ans)+(qo.unit?" "+qo.unit:""):qo.ans);

/* ================= matières & niveaux ================= */
const SUBJECTS={
  maths:{label:"Mathématiques",short:"Maths",glyph:"+−",c:"var(--c-maths)"},
  geom:{label:"Géométrie",short:"Géométrie",glyph:"△",c:"var(--c-geom)"},
  prog:{label:"Programmation",short:"Code",glyph:"{ }",c:"var(--c-prog)"},
  elec:{label:"Électronique",short:"Électronique",glyph:"Ω",c:"var(--c-elec)"},
  m3d:{label:"Modélisation 3D",short:"3D",glyph:"3D",c:"var(--c-3d)"},
  hg:{label:"Histoire-Géographie",short:"Histoire-Géo",glyph:"1789",c:"var(--c-hg)"},
  fr:{label:"Français",short:"Français",glyph:"Aa",c:"var(--c-fr)"},
  en:{label:"Anglais",short:"Anglais",glyph:"EN",c:"var(--c-en)"},
  foot:{label:"Football : la tactique",short:"Foot",glyph:"⚽",c:"var(--c-foot)"}
};
const EXTRA={rev:{label:"Révisions",short:"Révisions",glyph:"↺",c:"var(--c-rev)"},defi:{label:"Défi Claude",short:"Défi Claude",glyph:"★",c:"var(--c-defi)"}};
const SUBINFO=k=>SUBJECTS[k]||EXTRA[k]||EXTRA.rev;

/* ================= générateurs : maths ================= */
const G={};
G.calc=()=>{const t=R(1,6);let a,b;
  if(t===1){a=R(3,12);b=R(3,12);return inp(`${a} × ${b} = ?`,a*b,`Table de ${a} : ${a} × ${b} = ${a*b}.`)}
  if(t===2){a=R(25,99);b=R(15,99);return inp(`${a} + ${b} = ?`,a+b,`Dizaines : ${a-a%10} + ${b-b%10} = ${a-a%10+b-b%10}, unités : ${a%10} + ${b%10} = ${a%10+b%10}. Total ${a+b}.`)}
  if(t===3){a=R(120,500);b=R(15,99);return inp(`${a} − ${b} = ?`,a-b,`${a} − ${b} = ${a-b}. Astuce : enlève d’abord ${b-b%10}, puis ${b%10}.`)}
  if(t===4){const k=pick([10,100,1000]),z=String(k).length-1;
    if(R(0,1)){a=R(2,99);return inp(`${a} × ${k} = ?`,a*k,`Multiplier par ${k}, c’est ajouter ${z} zéro${z>1?"s":""} : ${fmt(a*k)}.`)}
    a=R(2,99)*k;return inp(`${fmt(a)} ÷ ${k} = ?`,a/k,`Diviser par ${k}, c’est enlever ${z} zéro${z>1?"s":""} : ${a/k}.`)}
  if(t===5){a=R(12,49);b=R(3,9);const d=a-a%10,u=a%10;return inp(`${a} × ${b} = ?`,a*b,`${d} × ${b} = ${d*b} et ${u} × ${b} = ${u*b}, donc ${d*b} + ${u*b} = ${a*b}.`)}
  a=R(6,250)*2;return inp(`La moitié de ${a} = ?`,a/2,`${a} ÷ 2 = ${a/2}.`)};
G.decim=()=>{const t=R(1,6);
  if(t===1){const a=R(1,9),d=R(2,9),x=a+d/10,y=(a*100+(d-1)*10+R(1,9))/100;
    return mcq("Quel nombre est le plus grand ?",fmt(x),[fmt(y)],`On compare chiffre par chiffre : même partie entière, puis les dixièmes ${d} > ${d-1}. Donc ${fmt(x)} est plus grand, même s’il a moins de chiffres.`)}
  if(t===2){const x=R(11,99)/10,y=R(101,999)/100,s=r2(x+y);return inp(`${fmt(x)} + ${fmt(y)} = ?`,s,`On aligne les virgules : ${x.toFixed(2).replace(".",",")} + ${fmt(y)} = ${fmt(s)}.`)}
  if(t===3){const x=R(101,9999)/100,k=pick([10,100,1000]),z=String(k).length-1;return inp(`${fmt(x)} × ${k} = ?`,Math.round(x*100*k)/100,`× ${k} : la virgule se déplace de ${z} rang${z>1?"s":""} vers la droite → ${fmt(Math.round(x*100*k)/100)}.`)}
  if(t===4){const u=R(1,9),c=R(1,9),g=`${u},0${c}`;return mcq(`Écris en nombre décimal : ${u} unités et ${c} centièmes`,g,[`${u},${c}`,`${u},00${c}`,`${u}${c}`],`Les centièmes sont au 2e rang après la virgule : ${g}.`)}
  if(t===5){const x=R(50,99)/10,y=R(11,49)/10;return inp(`${fmt(x)} − ${fmt(y)} = ?`,Math.round((x-y)*10)/10,`${fmt(x)} − ${fmt(y)} = ${fmt(Math.round((x-y)*10)/10)}.`)}
  const x=R(1001,9999)/100;return inp(`Arrondis ${fmt(x)} à l’unité.`,Math.round(x),`On regarde le chiffre des dixièmes : ${Math.floor(x*10)%10} ${Math.floor(x*10)%10>=5?"≥ 5, on arrondit au-dessus":"< 5, on garde"} → ${Math.round(x)}.`)};
G.fract=()=>{const t=R(1,6);
  if(t===1){const d=pick([2,3,4,5,10]),n=R(1,d-1),q=d*R(2,10);return inp(`Combien font ${n}/${d} de ${q} ?`,n*q/d,`${q} ÷ ${d} = ${q/d}, puis × ${n} = ${n*q/d}.`)}
  if(t===2){const [a,b]=pick([[1,2],[1,3],[2,3],[1,4],[3,4],[2,5],[3,5],[4,5],[5,6],[3,7],[5,8]]),k=R(2,5);
    return mcq(`Simplifie la fraction ${a*k}/${b*k}`,`${a}/${b}`,[`${a+1}/${b}`,`${a}/${b+1}`,`${b}/${a}`,`${a*k}/${b}`],`On divise le haut et le bas par ${k} : ${a*k} ÷ ${k} = ${a}, ${b*k} ÷ ${k} = ${b}.`)}
  if(t===3){const b=R(2,9),a=pick([R(1,b-1),b,R(b+1,15)]);const g=a<b?"plus petite que 1":a===b?"égale à 1":"plus grande que 1";
    return mcq(`La fraction ${a}/${b} est…`,g,["plus petite que 1","égale à 1","plus grande que 1"],`Le numérateur (${a}) est ${a<b?"plus petit que":a===b?"égal au":"plus grand que"} le dénominateur (${b}), donc la fraction est ${g}.`)}
  if(t===4){const n=R(5,12),a=R(1,n-2),b=R(1,n-1-a);return mcq(`${a}/${n} + ${b}/${n} = ?`,`${a+b}/${n}`,[`${a+b}/${2*n}`,`${a*b}/${n}`,`${a+b+1}/${n}`],`Même dénominateur : on additionne seulement les numérateurs, ${a} + ${b} = ${a+b}.`)}
  if(t===5){if(R(0,1)){const d=R(5,12);let a=R(1,d-1),b=R(1,d-1);while(b===a)b=R(1,d-1);
      return mcq("Quelle fraction est la plus grande ?",`${Math.max(a,b)}/${d}`,[`${Math.min(a,b)}/${d}`],`Même dénominateur : la plus grande a le plus grand numérateur.`)}
    const n=R(1,3);let d1=R(n+1,9),d2=R(n+1,9);while(d2===d1)d2=R(n+1,9);
    return mcq("Quelle fraction est la plus grande ?",`${n}/${Math.min(d1,d2)}`,[`${n}/${Math.max(d1,d2)}`],`Même numérateur : plus on partage en beaucoup de parts, plus chaque part est petite. Donc ${n}/${Math.min(d1,d2)} est la plus grande.`)}
  const L=[["1/2","0,5"],["1/4","0,25"],["3/4","0,75"],["1/5","0,2"],["1/10","0,1"],["3/10","0,3"],["7/100","0,07"],["2/5","0,4"]];const [f,v]=pick(L);
  return mcq(`Quelle est l’écriture décimale de ${f} ?`,v,shuffle(L.filter(x=>x[1]!==v).map(x=>x[1])).concat(["1,2"]),`${f} = ${v}.`)};
G.percent=()=>{const t=R(1,5);
  if(t===1){const p=pick([10,20,25,50,75]),q=20*R(1,15);return inp(`Combien font ${p} % de ${q} ?`,p*q/100,`${p} % = ${p}/100. ${q} × ${p} ÷ 100 = ${p*q/100}.`)}
  if(t===2){const k=R(2,9),a=R(2,6);let c=R(3,12);while(c===a)c=R(3,12);return inp(`Tableau de proportionnalité : ${a} → ${a*k}. Que donne ${c} ?`,c*k,`On multiplie toujours par ${k} (car ${a*k} ÷ ${a} = ${k}) : ${c} × ${k} = ${c*k}.`)}
  if(t===3){const pr=pick([20,40,60,80,120,200]),p=pick([10,25,50]);return inp(`Un jeu coûte ${pr} €. Il est soldé à −${p} %. Nouveau prix (en €) ?`,pr*(100-p)/100,`Réduction : ${p} % de ${pr} = ${pr*p/100} €. ${pr} − ${pr*p/100} = ${pr*(100-p)/100} €.`,{unit:"€"})}
  if(t===4){const v=R(4,25)*5,h=R(2,4);return inp(`Un train roule à ${v} km/h. Quelle distance en ${h} heures ?`,v*h,`Distance = vitesse × temps = ${v} × ${h} = ${v*h} km.`,{unit:"km"})}
  const n=R(2,9),s=pick([100000,50000]);return inp(`Sur une carte à l’échelle 1/${fmt(s)}, ${n} cm représentent combien de km ?`,n*s/100000,`1 cm = ${fmt(s)} cm = ${s/100000} km en vrai. ${n} × ${s/100000} = ${fmt(n*s/100000)} km.`,{unit:"km"})};
G.prior=()=>{const t=R(1,6);let a,b,c;
  if(t===1){a=R(2,20);b=R(2,9);c=R(2,9);return inp(`${a} + ${b} × ${c} = ?`,a+b*c,`La multiplication d’abord : ${b} × ${c} = ${b*c}, puis ${a} + ${b*c} = ${a+b*c}.`)}
  if(t===2){a=R(2,12);b=R(2,9);c=R(2,9);return inp(`(${a} + ${b}) × ${c} = ?`,(a+b)*c,`Les parenthèses d’abord : ${a+b}, puis × ${c} = ${(a+b)*c}.`)}
  if(t===3){a=R(3,9);b=R(3,9);c=R(1,a*b-1);return inp(`${a} × ${b} − ${c} = ?`,a*b-c,`${a} × ${b} = ${a*b}, puis − ${c} = ${a*b-c}.`)}
  if(t===4){c=R(2,9);b=c*R(2,9);a=R(2,30);return inp(`${a} + ${b} ÷ ${c} = ?`,a+b/c,`La division d’abord : ${b} ÷ ${c} = ${b/c}, puis ${a} + ${b/c} = ${a+b/c}.`)}
  if(t===5){a=R(2,9);b=R(5,15);c=R(1,b-1);return inp(`${a} × (${b} − ${c}) = ?`,a*(b-c),`Parenthèses : ${b} − ${c} = ${b-c}, puis ${a} × ${b-c} = ${a*(b-c)}.`)}
  a=R(12,30);b=R(1,9);c=R(1,9);return inp(`${a} − ${b} + ${c} = ?`,a-b+c,`Sans priorité, on calcule de gauche à droite : ${a} − ${b} = ${a-b}, puis + ${c} = ${a-b+c}.`)};
G.rel=()=>{const nz=()=>{let x=0;while(!x)x=R(-12,12);return x};const t=R(1,3),a=nz(),b=nz();
  if(t===1)return inp(`${fs(a)} + ${fs(b)} = ?`,a+b,`${a*b>0?"Même signe : on ajoute les distances à zéro et on garde le signe.":"Signes contraires : on soustrait les distances à zéro, et on garde le signe du plus « loin » de zéro."} Résultat : ${fmt(a+b)}.`);
  if(t===2)return inp(`${fs(a)} − ${fs(b)} = ?`,a-b,`Soustraire un nombre, c’est ajouter son opposé : ${fs(a)} + ${fs(-b)} = ${fmt(a-b)}.`);
  let x=-R(1,15),y=-R(1,15);while(y===x)y=-R(1,15);return mcq("Quel est le plus petit nombre ?",fmt(Math.min(x,y)),[fmt(Math.max(x,y))],`Chez les négatifs, le plus petit est le plus loin de zéro : ${fmt(Math.min(x,y))}.`)};
G.equa=()=>{const t=R(1,3);let x=R(-5,12);if(!x)x=4;
  if(t===1){const b=R(2,30),c=x+b;return inp(`Résous : x + ${b} = ${fmt(c)}`,x,`x = ${fmt(c)} − ${b} = ${fmt(x)}.`)}
  if(t===2){const a=R(2,9),c=a*x;return inp(`Résous : ${a}x = ${fmt(c)}`,x,`x = ${fmt(c)} ÷ ${a} = ${fmt(x)}.`)}
  const a=R(2,9);let b=R(-15,15);if(!b)b=7;const c=a*x+b;
  return inp(`Résous : ${a}x ${b<0?"−":"+"} ${Math.abs(b)} = ${fmt(c)}`,x,`On ${b<0?"ajoute":"enlève"} ${Math.abs(b)} des deux côtés : ${a}x = ${fmt(c-b)}. Puis on divise par ${a} : x = ${fmt(x)}.`)};
G.pow=()=>{const t=R(1,4);
  if(t===1){const n=R(2,10);return inp(`2${sup(n)} = ?`,2**n,`2${sup(n)} = 2 multiplié ${n} fois par lui-même = ${fmt(2**n)}.`)}
  if(t===2){const a=R(2,15);return inp(`${a}² = ?`,a*a,`${a}² = ${a} × ${a} = ${a*a}.`)}
  if(t===3){const n=R(2,6);return mcq(`10${sup(n)} = ?`,fmt(10**n),[fmt(10**(n-1)),fmt(10**(n+1)),String(10*n)],`10${sup(n)} = 1 suivi de ${n} zéros = ${fmt(10**n)}.`)}
  const n=R(3,7);return mcq(`Écris ${fmt(10**n)} comme une puissance de 10.`,`10${sup(n)}`,[`10${sup(n-1)}`,`10${sup(n+1)}`,`${n}${sup(10)}`],`On compte les zéros : ${n}, donc 10${sup(n)}.`)};
G.suite=()=>{const t=R(1,5);let s,nx,e;
  if(t===1){const a=R(1,20),d=R(2,12);s=[0,1,2,3].map(i=>a+i*d);nx=a+4*d;e=`On ajoute ${d} à chaque fois.`}
  else if(t===2){const a=R(1,5),r=R(2,3);s=[0,1,2,3].map(i=>a*r**i);nx=a*r**4;e=`On multiplie par ${r} à chaque fois.`}
  else if(t===3){const k=R(1,6);s=[0,1,2,3].map(i=>(k+i)**2);nx=(k+4)**2;e=`Ce sont les carrés : ${k}², ${k+1}², ${k+2}², ${k+3}², donc ${k+4}² = ${nx}.`}
  else if(t===4){const a=R(60,100),d=R(3,9);s=[0,1,2,3].map(i=>a-i*d);nx=a-4*d;e=`On enlève ${d} à chaque fois.`}
  else{let a=R(1,5),b=R(1,5);s=[a,b];for(let i=0;i<3;i++)s.push(s[s.length-1]+s[s.length-2]);nx=s[s.length-1]+s[s.length-2];e="Chaque nombre est la somme des deux précédents (comme la suite de Fibonacci)."}
  return inp(`Quel nombre continue la suite : ${s.join(" ; ")} ; … ?`,nx,e)};

/* ================= générateurs : géométrie ================= */
G.aires=()=>{const t=R(1,6);
  if(t===1){const L=R(5,20),l=R(2,L-1);return inp(`Périmètre d’un rectangle de ${L} cm sur ${l} cm ?`,2*(L+l),`P = 2 × (L + l) = 2 × (${L} + ${l}) = ${2*(L+l)} cm.`,{unit:"cm"})}
  if(t===2){const L=R(4,15),l=R(2,L-1);return inp(`Aire d’un rectangle de ${L} cm sur ${l} cm (en cm²) ?`,L*l,`A = L × l = ${L} × ${l} = ${L*l} cm².`,{unit:"cm²"})}
  if(t===3){const c=R(2,15);return R(0,1)?inp(`Périmètre d’un carré de côté ${c} cm ?`,4*c,`P = 4 × côté = 4 × ${c} = ${4*c} cm.`,{unit:"cm"}):inp(`Aire d’un carré de côté ${c} cm (en cm²) ?`,c*c,`A = côté × côté = ${c} × ${c} = ${c*c} cm².`,{unit:"cm²"})}
  if(t===4){const c=R(2,15);return inp(`Un carré a un périmètre de ${4*c} cm. Quelle est la longueur de son côté ?`,c,`4 côtés égaux : ${4*c} ÷ 4 = ${c} cm.`,{unit:"cm"})}
  if(t===5){const b=R(2,12)*2,h=R(2,10);return inp(`Aire d’un triangle rectangle dont les côtés de l’angle droit mesurent ${b} cm et ${h} cm ?`,b*h/2,`C’est la moitié d’un rectangle : ${b} × ${h} ÷ 2 = ${b*h/2} cm².`,{unit:"cm²"})}
  const c=pick([["m","cm",100,"1 m = 100 cm"],["km","m",1000,"1 km = 1 000 m"],["cm","mm",10,"1 cm = 10 mm"],["kg","g",1000,"1 kg = 1 000 g"],["L","cL",100,"1 L = 100 cL"]]);
  const v=pick([R(2,9),R(11,49)/10]);return inp(`${fmt(v)} ${c[0]} = combien de ${c[1]} ?`,r3(v*c[2]),`${c[3]}, donc ${fmt(v)} × ${fmt(c[2])} = ${fmt(v*c[2])} ${c[1]}.`,{unit:c[1]})};
G.cercle=()=>{const t=R(1,4);
  if(t===1){const d=R(2,12);return inp(`Périmètre d’un cercle de diamètre ${d} cm (prends π ≈ 3,14) ?`,r2(3.14*d),`P = π × diamètre ≈ 3,14 × ${d} = ${fmt(r2(3.14*d))} cm.`,{unit:"cm",tol:.06})}
  if(t===2){const r=R(2,25);return inp(`Un cercle a un rayon de ${r} cm. Quel est son diamètre ?`,2*r,`Diamètre = 2 × rayon = ${2*r} cm.`,{unit:"cm"})}
  if(t===3){const r=R(1,10);return inp(`Aire d’un disque de rayon ${r} cm (π ≈ 3,14) ?`,r2(3.14*r*r),`A = π × r × r ≈ 3,14 × ${r} × ${r} = ${fmt(r2(3.14*r*r))} cm².`,{unit:"cm²",tol:.1})}
  const r=R(1,10);return inp(`Périmètre d’un cercle de rayon ${r} cm (π ≈ 3,14) ?`,r2(6.28*r),`P = 2 × π × r ≈ 2 × 3,14 × ${r} = ${fmt(r2(6.28*r))} cm.`,{unit:"cm",tol:.06})};
G.angles=()=>{const t=R(1,5);
  if(t===1){const a=R(30,90),b=R(20,150-a);return inp(`Dans un triangle, deux angles mesurent ${a}° et ${b}°. Combien mesure le troisième ?`,180-a-b,`La somme des angles d’un triangle fait 180° : 180 − ${a} − ${b} = ${180-a-b}°.`,{unit:"°"})}
  if(t===2){const b=R(20,80);return inp(`Un triangle isocèle a deux angles de base de ${b}°. Combien mesure l’angle au sommet ?`,180-2*b,`180 − 2 × ${b} = ${180-2*b}°.`,{unit:"°"})}
  if(t===3){const a=R(10,80);return inp(`Quel angle faut-il ajouter à ${a}° pour obtenir un angle droit ?`,90-a,`Un angle droit fait 90° : 90 − ${a} = ${90-a}°.`,{unit:"°"})}
  if(t===4)return angleQ();
  const a=R(20,160);return inp(`Deux angles sont supplémentaires (leur somme fait 180°). L’un mesure ${a}°. Et l’autre ?`,180-a,`180 − ${a} = ${180-a}°.`,{unit:"°"})};
G.volumes=()=>{const t=R(1,3);
  if(t===1){const L=R(2,10),l=R(2,8),h=R(2,6);return inp(`Volume d’un pavé droit de ${L} cm × ${l} cm × ${h} cm (en cm³) ?`,L*l*h,`V = L × l × h = ${L} × ${l} × ${h} = ${L*l*h} cm³.`,{unit:"cm³"})}
  if(t===2){const a=R(2,10);return inp(`Volume d’un cube d’arête ${a} cm (en cm³) ?`,a**3,`V = a × a × a = ${a} × ${a} × ${a} = ${a**3} cm³.`,{unit:"cm³"})}
  const L=R(3,8),l=R(2,5),h=R(2,5);return inp(`Un aquarium mesure ${L} dm × ${l} dm × ${h} dm. Combien de litres d’eau peut-il contenir ?`,L*l*h,`V = ${L*l*h} dm³, et 1 dm³ = 1 litre : ${L*l*h} L.`,{unit:"L"})};
G.pyth=()=>{const T=pick([[3,4,5],[5,12,13],[8,15,17],[7,24,25],[6,8,10],[9,12,15]]),[a,b,c]=T;const t=R(1,3);
  if(t===1)return inp(`Triangle rectangle : les côtés de l’angle droit mesurent ${a} cm et ${b} cm. Longueur de l’hypoténuse ?`,c,`Pythagore : c² = ${a}² + ${b}² = ${a*a} + ${b*b} = ${c*c}, donc c = √${c*c} = ${c} cm.`,{unit:"cm"});
  if(t===2)return inp(`Triangle rectangle : hypoténuse ${c} cm, un côté ${a} cm. Longueur de l’autre côté ?`,b,`b² = ${c}² − ${a}² = ${c*c} − ${a*a} = ${b*b}, donc b = ${b} cm.`,{unit:"cm"});
  const ok=R(0,1),z=ok?c:c+1;return mcq(`Un triangle a des côtés de ${a}, ${b} et ${z} cm. Est-il rectangle ?`,ok?"Oui":"Non",[ok?"Non":"Oui"],`${a}² + ${b}² = ${a*a+b*b} et ${z}² = ${z*z}. ${ok?"C’est égal : il est rectangle.":"Ce n’est pas égal : il n’est pas rectangle."}`)};
G.bin=()=>{const n=R(2,31);
  if(R(0,1)){const p=[16,8,4,2,1].filter(x=>n&x);return inp(`Écris ${n} en binaire.`,n.toString(2),`${n} = ${p.join(" + ")} → ${n.toString(2)}.`,{check:"bin",n})}
  const b=n.toString(2);return inp(`Que vaut le nombre binaire ${b} en décimal ?`,n,`On lit les bits avec les valeurs ${[16,8,4,2,1].slice(5-b.length).join(", ")} : ${[16,8,4,2,1].filter(x=>n&x).join(" + ")} = ${n}.`)};

  return pg([A,B,C,D],"face")+pg([D,C,C2,D2],"face2")+pg([B,C,C2,B2],"face2")+ln(A,A2,1)+ln(A2,B2,1)+ln(A2,D2,1)+[[A,B],[B,C],[C,D],[D,A],[D,D2],[C,C2],[B,B2],[D2,C2],[C2,B2]].map(([p,q])=>ln(p,q)).join("")}

function netQ(){const valid=R(0,1);let cells,ex;
  if(valid){const v=R(0,2);cells=v===0?[[R(0,3),0],[0,1],[1,1],[2,1],[3,1],[R(0,3),2]]:v===1?[[0,0],[1,0],[1,1],[2,1],[2,2],[3,2]]:[[0,0],[1,0],[2,0],[2,1],[3,1],[4,1]];ex="Oui : en pliant, chaque carré devient une face différente du cube, sans en superposer deux."}
  else{const I=pick([[[[0,0],[1,0],[2,0],[0,1],[1,1],[2,1]],"Non : avec deux rangées de 3, des faces se superposent quand on plie."],[[[0,0],[1,0],[0,1],[1,1],[2,1],[3,1]],"Non : les deux carrés du haut deviendraient tous les deux le dessus du cube."],[[[0,1],[1,1],[2,1],[3,1],[4,1],[2,0]],"Non : avec 5 carrés en ligne, le 5e revient sur le 1er quand on plie."],[[[0,0],[3,0],[0,1],[1,1],[2,1],[3,1]],"Non : les deux carrés du haut deviendraient tous les deux le dessus, et il manquerait le dessous."]]);cells=I[0];ex=I[1]}
  return mcq("Cette figure est-elle un patron de cube ? (Peut-on la plier pour fabriquer un cube ?)",valid?"Oui":"Non",[valid?"Non":"Oui"],ex,{svg:gridSvg(5,3,cells,34,false),sig:cells.join(";")})}
G.solides=()=>{const t=R(1,10),keys=Object.keys(SOL);
  if(t<=4){const k=pick(keys);return mcq("Comment s’appelle ce solide ?",SOL[k].name,shuffle(keys.filter(x=>x!==k).map(x=>SOL[x].name)),`C’est ${SOL[k].ce==="cette"?"une":"un"} ${SOL[k].name} : ${SOL[k].e}`,{svg:figSvg(SOL[k].svg(),"0 0 240 180")})}
  if(t<=8){const k=pick(["cube","pave","prisme","pyr"]),w=pick(["f","s","a"]),lab={f:"faces",s:"sommets",a:"arêtes"}[w];
    return inp(`Combien de ${lab} a ${SOL[k].ce} ${SOL[k].name} ?`,SOL[k][w],SOL[k].c,{svg:figSvg(SOL[k].svg(),"0 0 240 180")})}
  return netQ()};

G.diveucl=()=>{const b=R(3,9),q=R(4,25),r=R(0,b-1),a=b*q+r,t=R(1,4);
  if(t===1)return inp(`Dans la division de ${a} par ${b}, quel est le quotient ?`,q,`${b} × ${q} = ${b*q} et ${b} × ${q+1} = ${b*(q+1)} : le quotient est ${q} (reste ${r}).`);
  if(t===2)return inp(`Dans la division de ${a} par ${b}, quel est le reste ?`,r,`${a} = ${b} × ${q} + ${r}. Le reste est ${r}, il est bien plus petit que ${b}.`);
  if(t===3){const per=R(4,9)*R(5,9),cap=pick([8,9,10,12]);const n=Math.ceil(per/cap);return inp(`${per} enfants partent en sortie. Une voiture emmène ${cap} enfants. Combien de voitures faut-il au minimum ?`,n,`${per} = ${cap} × ${Math.floor(per/cap)} + ${per%cap}. ${per%cap?`Il reste ${per%cap} enfant${per%cap>1?"s":""} : il faut une voiture de plus, donc ${n}.`:`Pas de reste : ${n} voitures suffisent.`}`)}
  return inp(`Complète : ${a} = ${b} × ${q} + ___`,r,`${b} × ${q} = ${b*q}, et ${a} − ${b*q} = ${r}.`)};
G.malin=()=>{const t=R(1,6);let n;
  if(t===1){n=R(12,89);return inp(`Calcule malin : 9 × ${n}`,9*n,`9 × ${n} = 10 × ${n} − ${n} = ${10*n} − ${n} = ${9*n}.`)}
  if(t===2){n=R(12,89);return inp(`Calcule malin : 11 × ${n}`,11*n,`11 × ${n} = 10 × ${n} + ${n} = ${10*n} + ${n} = ${11*n}.`)}
  if(t===3){n=4*R(2,12);return inp(`Calcule malin : 25 × ${n}`,25*n,`25 × 4 = 100. ${n} = 4 × ${n/4}, donc 25 × ${n} = 100 × ${n/4} = ${25*n}.`)}
  if(t===4){n=R(120,880);return inp(`Calcule malin : ${n} + 99`,n+99,`+ 99, c’est + 100 puis − 1 : ${n+100} − 1 = ${n+99}.`)}
  if(t===5){n=2*R(12,99);return inp(`Calcule malin : ${n} × 5`,n*5,`× 5, c’est × 10 puis ÷ 2 : ${n*10} ÷ 2 = ${n*5}.`)}
  const a=R(11,49),b=R(2,9);return inp(`Calcule malin : ${a} × ${b}`,a*b,`On décompose : ${a-a%10} × ${b} + ${a%10} × ${b} = ${(a-a%10)*b} + ${a%10*b} = ${a*b}.`)};
G.fracAdd=()=>{const t=R(1,3),b=pick([2,3,4,5]),k=pick([2,3]),d=b*k,a=R(1,b-1),c=R(1,d-1);
  const val=(x,y)=>x/y,gx=a*k+c;
  const ok=(x,v)=>{const [p,q]=x.split("/").map(Number);return q>0&&p>0&&Math.abs(p/q-v)>1e-9};
  if(t===3&&a*k>c){const g=`${a*k-c}/${d}`,v=(a*k-c)/d;return mcq(`${a}/${b} − ${c}/${d} = ?`,g,[`${Math.abs(a-c)}/${d}`,`${a*k-c}/${b*d}`,`${a*k+c}/${d}`,`${a*k-c+1}/${d}`].filter(x=>ok(x,v)),`${a}/${b} = ${a*k}/${d} (on multiplie le haut et le bas par ${k}). Puis ${a*k}/${d} − ${c}/${d} = ${a*k-c}/${d}.`)}
  const g=`${gx}/${d}`,cand=[`${a+c}/${b+d}`,`${a+c}/${d}`,`${gx}/${b*d}`,`${a+c}/${b*d}`].filter(x=>{const [p,q]=x.split("/").map(Number);return Math.abs(p/q-val(gx,d))>1e-9});
  return mcq(`${a}/${b} + ${c}/${d} = ?`,g,cand,`On met au même dénominateur : ${a}/${b} = ${a*k}/${d}. Puis ${a*k}/${d} + ${c}/${d} = ${gx}/${d}. On n’additionne jamais les dénominateurs.`)};

function barSvg(rows){const W=320,h=34,gap=14,top=8;let s="";
  rows.forEach((r,k)=>{const y=top+k*(h+gap),w=(W-(r.label?84:20))/r.d;for(let i=0;i<r.d;i++)s+=`<rect class="${i<r.n?"fr-on":"fr-off"}" x="${f1(10+i*w)}" y="${y}" width="${f1(w)}" height="${h}" rx="3"/>`;if(r.label)s+=`<text class="lbl" x="${W-66}" y="${y+h/2+6}">${r.label}</text>`});
  return figSvg(s,`0 0 ${W} ${top*2+rows.length*(h+gap)-gap}`,"lfig")}
function lineSvg(min,max,marks=[],arrows=[]){const W=340,x=v=>f1(20+(v-min)*(W-44)/(max-min)),y=70+arrows.length*0;let s=`<line class="ln" x1="8" y1="${y}" x2="${W-8}" y2="${y}" style="stroke-width:2.5"/><polyline class="ln" points="${W-16},${y-6} ${W-6},${y} ${W-16},${y+6}" style="fill:none;stroke-width:2.5"/>`;
  for(let v=min;v<=max;v++)s+=`<line class="ln" x1="${x(v)}" y1="${y-6}" x2="${x(v)}" y2="${y+6}" style="stroke-width:2"/><text class="tick" x="${x(v)}" y="${y+25}" text-anchor="middle">${v<0?"−"+(-v):v}</text>`;
  arrows.forEach(([a,b,lab],i)=>{const yy=y-16-i*20,dir=b>a?1:-1;s+=`<line class="arr" x1="${x(a)}" y1="${yy}" x2="${x(b)}" y2="${yy}"/><polygon class="arrh" points="${x(b)},${yy} ${x(b)-8*dir},${yy-5} ${x(b)-8*dir},${yy+5}"/><text class="tick" x="${(x(a)+x(b))/2}" y="${yy-6}" text-anchor="middle">${lab}</text>`});
  marks.forEach(([v,l])=>s+=`<circle class="mk" cx="${x(v)}" cy="${y}" r="6"/>${l?`<text class="lbl" x="${x(v)}" y="${y-14}" text-anchor="middle">${l}</text>`:""}`);
  return figSvg(s,`0 0 ${W} 110`,"lfig")}
function dotsSvg(groups,per,rest){let s="",x=8;const cols=3,r=7,gap=18;
  for(let g=0;g<groups;g++){const rows=Math.ceil(per/cols),w=cols*gap+8,h=rows*gap+8;s+=`<rect class="grp" x="${x}" y="8" width="${w}" height="${h}" rx="10"/>`;for(let i=0;i<per;i++)s+=`<circle class="dot" cx="${x+13+(i%cols)*gap}" cy="${21+Math.floor(i/cols)*gap}" r="${r}"/>`;x+=w+8}
  for(let i=0;i<rest;i++)s+=`<circle class="dot rest" cx="${x+13}" cy="${21+i*gap}" r="${r}"/>`;
  return figSvg(s,`0 0 ${x+30} ${Math.ceil(per/cols)*18+24}`,"lfig")}
function balanceSvg(L,Rt){return figSvg(`<polygon class="face2" points="160,150 140,185 180,185"/><line class="ed" x1="40" y1="150" x2="280" y2="150"/><line class="ed" x1="60" y1="150" x2="60" y2="118"/><line class="ed" x1="260" y1="150" x2="260" y2="118"/><rect class="grp" x="10" y="78" width="100" height="40" rx="8"/><rect class="grp" x="210" y="78" width="100" height="40" rx="8"/><text class="lbl" x="60" y="105" text-anchor="middle">${L}</text><text class="lbl" x="260" y="105" text-anchor="middle">${Rt}</text>`,"0 0 320 190","lfig")}

  {t:"Qu’est-ce qu’un nombre décimal ?",h:`<p>Un nombre décimal a une <b>partie entière</b> et une <b>partie décimale</b>, séparées par la <b>virgule</b>.</p><p class="bignum">12<span class="virg">,</span><span class="dpart">375</span></p><p>Ici, 12 est la partie entière et 375 la partie décimale.</p>`,say:"Un nombre décimal est formé de deux parties séparées par une virgule. Avant la virgule, c’est la partie entière. Après la virgule, c’est la partie décimale. Dans douze virgule trois cent soixante-quinze, douze est la partie entière, et trois cent soixante-quinze est la partie décimale."},
  {t:"Le tableau de numération",h:ltab([["Dizaines","Unités",",","Dixièmes","Centièmes","Millièmes"],["1","2",",","3","7","5"]])+`<p>Chaque chiffre a une valeur selon sa <b>place</b>. Le 3 vaut 3 dixièmes, le 7 vaut 7 centièmes, le 5 vaut 5 millièmes.</p>`+KEY("1 unité = 10 dixièmes = 100 centièmes = 1 000 millièmes."),say:"Dans le tableau de numération, chaque chiffre a une valeur qui dépend de sa place. Juste après la virgule, ce sont les dixièmes, puis les centièmes, puis les millièmes. Retiens bien : une unité, c’est dix dixièmes, c’est aussi cent centièmes, ou encore mille millièmes."},

  {t:"Une fraction, c’est un partage",h:barSvg([{d:4,n:3,label:"3/4"}])+`<p>On partage en <b>4 parts égales</b> et on en prend <b>3</b>.</p>`+ltab([["Numérateur (en haut)","Dénominateur (en bas)"],["parts que l’on prend : 3","parts égales en tout : 4"]]),say:"Une fraction représente des parts égales. Trois quarts, cela veut dire qu’on partage en quatre parts égales, et qu’on en prend trois. Le nombre du bas s’appelle le dénominateur : c’est le nombre de parts égales. Le nombre du haut s’appelle le numérateur : c’est le nombre de parts que l’on prend."},
  {t:"Lire une fraction",h:ltab([["Fraction","Se lit"],["1/2","un demi"],["1/3","un tiers"],["1/4","un quart"],["3/5","trois cinquièmes"],["7/10","sept dixièmes"],["9/100","neuf centièmes"]]),say:"Voici comment on lit les fractions. Un sur deux se dit un demi. Un sur trois, un tiers. Un sur quatre, un quart. Ensuite, on utilise la terminaison ième : trois cinquièmes, sept dixièmes, neuf centièmes."},
  {t:"Plus petite ou plus grande que 1 ?",h:barSvg([{d:4,n:4,label:"4/4 = 1"},{d:4,n:1,label:"+ 1/4"}])+`<p>5/4 = 1 + 1/4 : c’est plus qu’une unité.</p>`+KEY("Numérateur &lt; dénominateur : plus petite que 1. Égaux : égale à 1. Numérateur &gt; dénominateur : plus grande que 1."),say:"Quand le numérateur est plus petit que le dénominateur, la fraction est plus petite que un. Quand ils sont égaux, par exemple quatre quarts, la fraction vaut exactement un. Et quand le numérateur est plus grand, comme cinq quarts, on dépasse un : cinq quarts, c’est un entier plus un quart."},
  {t:"Des fractions égales",h:barSvg([{d:2,n:1,label:"1/2"},{d:4,n:2,label:"2/4"},{d:8,n:4,label:"4/8"}])+KEY("On obtient une fraction égale en multipliant (ou en divisant) le numérateur ET le dénominateur par le même nombre.")+EX(`<p>6/8 : on divise en haut et en bas par 2 → <b>3/4</b>. C’est <b>simplifier</b>.</p>`),say:"Regarde les trois bandes : un demi, deux quarts et quatre huitièmes, c’est exactement la même quantité coloriée. Pour obtenir une fraction égale, on multiplie le numérateur et le dénominateur par le même nombre. On peut aussi diviser les deux par le même nombre : c’est simplifier. Par exemple, six huitièmes devient trois quarts en divisant en haut et en bas par deux."},
  {t:"La fraction d’une quantité",h:dotsSvg(4,5,0)+EX(`<p>3/4 de 20 : on partage 20 en 4 → 20 ÷ 4 = 5. On prend 3 parts → 5 × 3 = <b>15</b>.</p>`)+KEY("Pour prendre a/b d’un nombre : on divise par b, puis on multiplie par a."),say:"Comment calculer trois quarts de vingt ? On partage d’abord vingt en quatre parts égales : vingt divisé par quatre, cela fait cinq. Puis on prend trois parts : cinq fois trois, quinze. Trois quarts de vingt, c’est quinze. On divise par le nombre du bas, puis on multiplie par le nombre du haut."},
  {t:"Fractions et nombres décimaux",h:ltab([["Fraction","Décimal"],["1/2","0,5"],["1/4","0,25"],["3/4","0,75"],["1/10","0,1"],["1/100","0,01"]])+KEY("Une fraction est une division : 3/4 = 3 ÷ 4 = 0,75."),say:"Une fraction est aussi une division. Trois quarts, c’est trois divisé par quatre, ce qui donne zéro virgule soixante-quinze. Apprends ces égalités par cœur : un demi égale zéro virgule cinq, un quart égale zéro virgule vingt-cinq, trois quarts égale zéro virgule soixante-quinze, un dixième égale zéro virgule un."}]},
 {id:"div",lvl:"CM2",title:"La division euclidienne",desc:"Quotient, reste, poser une division",gen:G.diveucl,steps:[
  {t:"Partager équitablement",h:dotsSvg(5,9,2)+`<p>47 billes partagées entre 5 amis : chacun en a <b>9</b>, et il en reste <b>2</b>.</p>`,say:"On a quarante-sept billes à partager équitablement entre cinq amis. Chacun reçoit neuf billes, car cinq fois neuf égale quarante-cinq. Il reste deux billes, qu’on ne peut pas partager sans faire de jaloux. C’est une division euclidienne."},
  {t:"Le vocabulaire",h:CALC("47 = 5 × 9 + 2")+ltab([["47","5","9","2"],["dividende","diviseur","quotient","reste"]],false)+KEY("Dividende = diviseur × quotient + reste, et le reste est toujours plus petit que le diviseur."),say:"Retiens les mots. Quarante-sept est le dividende, le nombre qu’on partage. Cinq est le diviseur. Neuf est le quotient, et deux est le reste. On peut toujours vérifier : diviseur fois quotient, plus le reste, redonne le dividende. Et le reste doit toujours être plus petit que le diviseur, sinon on pourrait encore faire un groupe."},
  {t:"Trouver le quotient avec les tables",h:`<p>Combien de fois 7 dans 52 ?</p>`+CALC("7 × 7 = 49   ≤ 52\n7 × 8 = 56   > 52  → trop grand")+`<p>Le quotient est 7, et le reste 52 − 49 = <b>3</b>.</p>`,say:"Pour trouver combien de fois sept va dans cinquante-deux, on utilise la table de sept. Sept fois sept, quarante-neuf : c’est plus petit que cinquante-deux. Sept fois huit, cinquante-six : c’est trop grand. Donc le quotient est sept, et le reste est cinquante-deux moins quarante-neuf, soit trois."},
  {t:"Poser une division",h:CALC("157 ÷ 6\n\n15 dizaines ÷ 6 → 2   (6 × 2 = 12, reste 3)\n37 unités  ÷ 6 → 6   (6 × 6 = 36, reste 1)\n\nQuotient : 26   Reste : 1\nVérification : 6 × 26 + 1 = 157 ✓"),say:"Pour diviser cent cinquante-sept par six, on commence par les dizaines. Dans quinze dizaines, six va deux fois, car six fois deux font douze, et il reste trois dizaines. On descend le sept : cela fait trente-sept. Dans trente-sept, six va six fois, trente-six, et il reste un. Le quotient est vingt-six et le reste est un. On vérifie : six fois vingt-six plus un, égale bien cent cinquante-sept."},
  {t:"Le piège des problèmes",h:EX(`<p>200 élèves, des cars de 48 places : 200 = 48 × 4 + 8.</p><p>4 cars ne suffisent pas, il reste 8 élèves : il faut <b>5 cars</b>.</p>`)+KEY("Lis bien la question : parfois il faut ajouter 1 au quotient à cause du reste."),say:"Attention aux problèmes. Deux cents élèves doivent prendre des cars de quarante-huit places. Deux cents divisé par quarante-huit donne quatre, avec un reste de huit. Mais on ne va pas laisser huit élèves sur le trottoir ! Il faut donc cinq cars. Lis toujours bien la question pour savoir quoi faire du reste."}]},
 {id:"malin",lvl:"CM2",title:"Calculer malin",desc:"Astuces de calcul mental",gen:G.malin,steps:[
  {t:"Décomposer pour multiplier",h:CALC("23 × 4 = 20 × 4 + 3 × 4\n       = 80 + 12\n       = 92"),say:"Pour multiplier vingt-trois par quatre de tête, on décompose vingt-trois en vingt plus trois. Vingt fois quatre, quatre-vingts. Trois fois quatre, douze. Quatre-vingts plus douze, quatre-vingt-douze. C’est beaucoup plus facile !"},
  {t:"× 9 et × 11",h:CALC("9 × 37  = 10 × 37 − 37 = 370 − 37 = 333\n11 × 24 = 10 × 24 + 24 = 240 + 24 = 264")+KEY("9 fois, c’est 10 fois moins 1 fois. 11 fois, c’est 10 fois plus 1 fois."),say:"Pour multiplier par neuf, on multiplie par dix, puis on enlève le nombre une fois. Neuf fois trente-sept : trois cent soixante-dix moins trente-sept, trois cent trente-trois. Pour multiplier par onze, on multiplie par dix et on ajoute le nombre une fois."},
  {t:"× 5 et × 25",h:CALC("48 × 5  = 48 × 10 ÷ 2 = 480 ÷ 2 = 240\n25 × 16 = 25 × 4 × 4  = 100 × 4  = 400"),say:"Multiplier par cinq, c’est multiplier par dix puis diviser par deux. Quarante-huit fois cinq : quatre cent quatre-vingts divisé par deux, deux cent quarante. Et souviens-toi que vingt-cinq fois quatre égale cent. Vingt-cinq fois seize, c’est vingt-cinq fois quatre fois quatre, donc cent fois quatre, quatre cents."},
  {t:"Ajouter 99, enlever 98",h:CALC("347 + 99 = 347 + 100 − 1 = 446\n512 − 98 = 512 − 100 + 2 = 414"),say:"Pour ajouter quatre-vingt-dix-neuf, on ajoute cent, puis on enlève un. Pour enlever quatre-vingt-dix-huit, on enlève cent, puis on rajoute deux, car on a enlevé deux de trop."},
  {t:"Changer l’ordre",h:CALC("4 × 7 × 25 = 7 × (4 × 25) = 7 × 100 = 700\n17 + 36 + 3 = (17 + 3) + 36 = 20 + 36 = 56")+KEY("Dans une suite de × ou de +, on peut changer l’ordre pour faire apparaître des nombres ronds."),say:"Quand il n’y a que des additions, ou que des multiplications, on peut changer l’ordre des nombres. On cherche alors des paires qui font des nombres ronds : quatre fois vingt-cinq, cent. Dix-sept plus trois, vingt."}]},
 {id:"prop",lvl:"6e",title:"Proportionnalité & pourcentages",desc:"Tableaux, retour à l’unité, %",gen:G.percent,steps:[
  {t:"Quand c’est proportionnel",h:ltab([["Stylos","1","2","3","5"],["Prix (€)","2","4","6","10"]])+`<p>Quand le nombre de stylos double, le prix double. On passe de la 1re ligne à la 2e en multipliant toujours par <b>2</b> : c’est le <b>coefficient de proportionnalité</b>.</p>`,say:"Deux grandeurs sont proportionnelles quand on passe de l’une à l’autre en multipliant toujours par le même nombre. Ici, un stylo coûte deux euros, deux stylos quatre euros, cinq stylos dix euros. On multiplie toujours par deux : c’est le coefficient de proportionnalité."},
  {t:"Le retour à l’unité",h:EX(`<p>4 cahiers coûtent 10 €. Combien coûtent 7 cahiers ?</p>`+CALC("1 cahier  : 10 ÷ 4 = 2,50 €\n7 cahiers : 2,50 × 7 = 17,50 €"))+KEY("On calcule d’abord le prix pour 1, puis on multiplie."),say:"Quatre cahiers coûtent dix euros. Combien coûtent sept cahiers ? On cherche d’abord le prix d’un seul cahier : dix divisé par quatre, deux euros cinquante. Puis on multiplie par sept : dix-sept euros cinquante. C’est la méthode du retour à l’unité."},
  {t:"Attention, ce n’est pas toujours proportionnel",h:`<p>À 5 ans, tu mesurais environ 1,10 m. À 10 ans, tu ne mesures pas 2,20 m !</p><p>Un taxi qui fait payer 4 € de départ + 2 € par km : 1 km = 6 €, mais 2 km = 8 €, pas 12 €.</p>`,say:"Attention : tout n’est pas proportionnel. Ta taille ne double pas quand ton âge double. Et un taxi qui fait payer quatre euros de départ, plus deux euros par kilomètre, n’est pas proportionnel non plus : un kilomètre coûte six euros, mais deux kilomètres coûtent huit euros, et pas douze."},
  {t:"Les pourcentages",h:ltab([["Pourcentage","Fraction","Pour 60"],["50 %","1/2","30"],["25 %","1/4","15"],["10 %","1/10","6"],["20 %","1/5","12"]])+KEY("p % d’un nombre = nombre × p ÷ 100.")+EX(`<p>Un jeu à 40 € soldé à −25 % : 40 × 25 ÷ 100 = 10 € de réduction → <b>30 €</b>.</p>`),say:"Un pourcentage, c’est une proportion sur cent. Cinquante pour cent, c’est la moitié. Vingt-cinq pour cent, le quart. Dix pour cent, un dixième. Pour calculer un pourcentage d’un nombre, on multiplie le nombre par le pourcentage, puis on divise par cent. Un jeu à quarante euros soldé à moins vingt-cinq pour cent : la réduction est de dix euros, il coûte donc trente euros."},
  {t:"La vitesse",h:ltab([["Durée","1 h","30 min","2 h","3 h"],["Distance (km)","60","30","120","180"]])+`<p>À vitesse constante de 60 km/h, la distance est proportionnelle à la durée.</p>`,say:"La vitesse est aussi une proportionnalité. Une voiture qui roule à soixante kilomètres à l’heure parcourt soixante kilomètres en une heure, trente kilomètres en une demi-heure, et cent vingt kilomètres en deux heures."}]},
 {id:"prio",lvl:"5e",title:"Les priorités opératoires",desc:"Dans quel ordre calculer",gen:G.prior,steps:[
  {t:"Un calcul, un seul résultat",h:`<p class="bignum small">2 + 3 × 4 = ?</p><p>Si on calcule de gauche à droite, on trouve 20. Mais la bonne réponse est <b>14</b> !</p>`,say:"Combien font deux plus trois fois quatre ? Beaucoup répondent vingt, en calculant de gauche à droite. Mais la bonne réponse est quatorze. En mathématiques, il y a des règles de priorité pour que tout le monde trouve le même résultat."},
  {t:"L’ordre à respecter",h:ltab([["Ordre","Quoi ?"],["1","les parenthèses ( )"],["2","les multiplications × et divisions ÷"],["3","les additions + et soustractions −"]])+KEY("À priorité égale, on calcule de gauche à droite."),say:"Voici l’ordre. D’abord, on calcule ce qui est entre parenthèses. Ensuite, les multiplications et les divisions. Enfin, les additions et les soustractions. Quand deux opérations ont la même priorité, on calcule de gauche à droite."},
  {t:"Exemples",h:CALC("20 − 12 ÷ 4   = 20 − 3   = 17\n(20 − 12) ÷ 4 = 8 ÷ 4    = 2\n3 × (2 + 5) − 4 = 3 × 7 − 4 = 21 − 4 = 17"),say:"Vingt moins douze divisé par quatre : on divise d’abord, douze divisé par quatre égale trois, puis vingt moins trois, dix-sept. Avec des parenthèses autour de vingt moins douze, on fait d’abord la soustraction, huit, puis huit divisé par quatre, deux. Les parenthèses changent tout !"},
  {t:"De gauche à droite",h:CALC("10 − 4 + 3 = 6 + 3 = 9      (et pas 10 − 7 = 3)\n24 ÷ 4 × 2 = 6 × 2 = 12     (et pas 24 ÷ 8 = 3)"),say:"Quand il n’y a que des additions et des soustractions, on calcule de gauche à droite. Dix moins quatre plus trois, c’est six plus trois, neuf. Même chose avec les multiplications et les divisions : vingt-quatre divisé par quatre fois deux, c’est six fois deux, douze."}]},
 {id:"rel",lvl:"5e",title:"Les nombres relatifs",desc:"Les nombres négatifs",gen:G.rel,steps:[
  {t:"Des nombres sous zéro",h:lineSvg(-5,5,[[-3,"−3 °C"],[2,"+2 °C"]])+`<p>Températures, étages du sous-sol, altitude sous la mer : les nombres <b>négatifs</b> sont à gauche de zéro.</p>`,say:"Il existe des nombres plus petits que zéro : ce sont les nombres négatifs. On les rencontre avec les températures, comme moins trois degrés, avec les étages en sous-sol, ou sous le niveau de la mer. Sur la droite graduée, les nombres négatifs sont à gauche de zéro, les positifs à droite."},
  {t:"Comparer et opposé",h:lineSvg(-8,8,[[-7,"−7"],[-3,"−3"],[3,"+3"]])+KEY("Le plus petit est le plus à gauche : −7 &lt; −3. L’opposé de 3 est −3 (même distance à zéro)."),say:"Sur la droite graduée, plus un nombre est à gauche, plus il est petit. Moins sept est plus petit que moins trois, même si sept est plus grand que trois ! Il fait plus froid à moins sept degrés qu’à moins trois. L’opposé d’un nombre est à la même distance de zéro, de l’autre côté : l’opposé de trois est moins trois."},
  {t:"Additionner",h:lineSvg(-6,6,[],[[0,5,"+5"],[5,2,"−3"]])+CALC("(+5) + (−3) = +2\n(−4) + (−2) = −6")+KEY("Même signe : on ajoute les distances et on garde le signe. Signes différents : on soustrait les distances et on prend le signe du plus éloigné de zéro."),say:"Pour additionner des nombres relatifs, imagine que tu te déplaces sur la droite. Plus cinq, tu avances de cinq. Puis moins trois, tu recules de trois : tu arrives à plus deux. Quand les deux nombres ont le même signe, on ajoute leurs distances à zéro et on garde le signe : moins quatre plus moins deux, moins six. Quand les signes sont différents, on soustrait les distances, et on garde le signe de celui qui est le plus loin de zéro."},
  {t:"Soustraire",h:CALC("(+3) − (−5) = (+3) + (+5) = +8\n(−2) − (+4) = (−2) + (−4) = −6")+KEY("Soustraire un nombre, c’est ajouter son opposé."),say:"Pour soustraire un nombre relatif, on ajoute son opposé. Plus trois moins moins cinq devient plus trois plus plus cinq, ce qui fait huit. Moins deux moins plus quatre devient moins deux plus moins quatre, ce qui fait moins six."},
  {t:"Bonus 4e : multiplier",h:ltab([["Signes","Résultat"],["+ × +","+"],["− × −","+"],["+ × −","−"],["− × +","−"]])+CALC("(−3) × (−4) = +12\n(−5) × 2   = −10"),say:"Un petit bonus du programme de quatrième. Pour multiplier deux nombres relatifs, on multiplie les distances à zéro, puis on regarde les signes. Deux signes identiques donnent un résultat positif. Deux signes différents donnent un résultat négatif. Moins trois fois moins quatre égale plus douze."}]},
 {id:"fadd",lvl:"5e",title:"Additionner des fractions",desc:"Mettre au même dénominateur",gen:G.fracAdd,steps:[
  {t:"Le piège",h:barSvg([{d:2,n:1,label:"1/2"},{d:4,n:1,label:"1/4"}])+`<p>1/2 + 1/4 n’est <b>pas</b> 2/6 ! Ensemble, ça fait 3/4.</p>`,say:"Attention au piège le plus courant. Un demi plus un quart, ce n’est pas deux sixièmes ! On n’additionne pas les numérateurs et les dénominateurs entre eux. Regarde les bandes : une moitié et un quart, ensemble, cela fait trois quarts."},
  {t:"Même dénominateur d’abord",h:barSvg([{d:4,n:2,label:"1/2 = 2/4"},{d:4,n:1,label:"1/4"},{d:4,n:3,label:"= 3/4"}])+KEY("On ne peut additionner que des fractions de même dénominateur : on additionne les numérateurs et on garde le dénominateur."),say:"Pour additionner des fractions, il faut qu’elles aient le même dénominateur, c’est-à-dire des parts de même taille. Un demi, c’est deux quarts. Donc deux quarts plus un quart égale trois quarts. On additionne les numérateurs, et on garde le dénominateur."},
  {t:"La méthode",h:CALC("2/3 + 1/6\n= 4/6 + 1/6     (2/3 = 4/6 : on multiplie par 2)\n= 5/6\n\n1/3 + 1/6 = 2/6 + 1/6 = 3/6 = 1/2  (on simplifie)"),say:"La méthode : on cherche un dénominateur commun, souvent le plus grand des deux s’il est un multiple de l’autre. Deux tiers plus un sixième : deux tiers, c’est quatre sixièmes, en multipliant par deux en haut et en bas. Quatre sixièmes plus un sixième, cinq sixièmes. Et à la fin, on simplifie si c’est possible."},
  {t:"Soustraire",h:CALC("3/4 − 1/2 = 3/4 − 2/4 = 1/4"),say:"Pour soustraire, c’est pareil : on met au même dénominateur, puis on soustrait les numérateurs. Trois quarts moins un demi, c’est trois quarts moins deux quarts, soit un quart."}]},
 {id:"pow",lvl:"4e",title:"Les puissances",desc:"Carrés, cubes, puissances de 10",gen:G.pow,steps:[
  {t:"Une écriture raccourcie",h:`<p class="bignum small">2⁵ = 2 × 2 × 2 × 2 × 2 = 32</p><p>Le petit nombre en haut, l’<b>exposant</b>, dit combien de fois on multiplie le nombre par lui-même.</p>`,say:"Une puissance est une façon courte d’écrire une multiplication répétée. Deux puissance cinq, c’est deux multiplié cinq fois par lui-même : deux fois deux fois deux fois deux fois deux, ce qui fait trente-deux. Le petit nombre en haut s’appelle l’exposant."},
  {t:"Carrés et cubes",h:ltab([["Écriture","Se lit","Valeur"],["5²","5 au carré","25"],["3³","3 au cube","27"],["10²","10 au carré","100"]])+`<p>5² est l’aire d’un carré de côté 5. 3³ est le volume d’un cube d’arête 3.</p>`,say:"Avec l’exposant deux, on dit au carré : cinq au carré égale vingt-cinq, c’est l’aire d’un carré de côté cinq. Avec l’exposant trois, on dit au cube : trois au cube égale vingt-sept, c’est le volume d’un cube d’arête trois."},
  {t:"Les puissances de 10",h:ltab([["Puissance","Valeur"],["10¹","10"],["10³","1 000"],["10⁶","1 000 000 (un million)"],["10⁹","un milliard"]])+KEY("10ⁿ = 1 suivi de n zéros."),say:"Les puissances de dix sont très pratiques : dix puissance n, c’est un suivi de n zéros. Dix puissance trois, mille. Dix puissance six, un million. Dix puissance neuf, un milliard."},
  {t:"Les pièges",h:CALC("2³ = 2 × 2 × 2 = 8     et pas 2 × 3 = 6\n(−3)² = (−3) × (−3) = 9\n−3²   = −(3 × 3)    = −9"),say:"Attention aux pièges. Deux au cube égale huit, et pas six : on ne multiplie pas deux par trois. Et fais attention aux parenthèses : moins trois entre parenthèses au carré égale neuf, mais moins trois au carré sans parenthèses égale moins neuf, car le carré ne concerne que le trois."},
  {t:"La notation scientifique",h:CALC("45 000      = 4,5 × 10⁴\n3 000 000   = 3 × 10⁶\nDistance Terre-Soleil ≈ 1,5 × 10⁸ km")+KEY("Un nombre entre 1 et 10, multiplié par une puissance de 10."),say:"Les scientifiques écrivent les très grands nombres avec une puissance de dix. On écrit un nombre entre un et dix, multiplié par une puissance de dix. Quarante-cinq mille s’écrit quatre virgule cinq fois dix puissance quatre. La distance de la Terre au Soleil est d’environ un virgule cinq fois dix puissance huit kilomètres."}]},
 {id:"equa",lvl:"4e",title:"Les équations",desc:"Trouver le nombre inconnu x",gen:G.equa,steps:[
  {t:"L’idée de la balance",h:balanceSvg("x + 3","7")+`<p>Une équation, c’est une balance en équilibre. <b>x</b> est le nombre inconnu.</p>`+KEY("Ce qu’on fait d’un côté, on le fait de l’autre : la balance reste en équilibre."),say:"Une équation, c’est comme une balance en équilibre. D’un côté, x plus trois. De l’autre, sept. La lettre x représente un nombre qu’on ne connaît pas encore. La règle d’or : tout ce qu’on fait d’un côté, on doit le faire de l’autre côté, pour que la balance reste en équilibre."},
  {t:"Enlever ou ajouter",h:CALC("x + 3 = 7\nx + 3 − 3 = 7 − 3\nx = 4\n\nx − 5 = 2\nx − 5 + 5 = 2 + 5\nx = 7"),say:"Pour résoudre x plus trois égale sept, on enlève trois des deux côtés. Il reste x égale quatre. Pour x moins cinq égale deux, on ajoute cinq des deux côtés : x égale sept. On fait l’opération contraire pour isoler x."},
  {t:"Diviser",h:CALC("4x = 20      (4x veut dire 4 × x)\n4x ÷ 4 = 20 ÷ 4\nx = 5"),say:"Quatre x veut dire quatre fois x. Pour trouver x, on divise les deux côtés par quatre : vingt divisé par quatre, cinq. Donc x égale cinq."},
  {t:"En deux étapes",h:CALC("3x + 5 = 20\n3x = 20 − 5 = 15      (on enlève 5)\nx  = 15 ÷ 3  = 5      (on divise par 3)\n\nVérification : 3 × 5 + 5 = 20 ✓"),say:"Pour trois x plus cinq égale vingt, on procède en deux étapes. D’abord, on enlève cinq des deux côtés : trois x égale quinze. Ensuite, on divise par trois : x égale cinq. Et on vérifie toujours en remplaçant x par cinq : trois fois cinq plus cinq, vingt. C’est juste !"},
  {t:"Mettre un problème en équation",h:EX(`<p>« Je pense à un nombre. Je le multiplie par 2 et j’ajoute 7. J’obtiens 19. »</p>`+CALC("2x + 7 = 19\n2x = 12\nx = 6"))+KEY("Appelle x le nombre cherché, traduis l’énoncé, puis résous."),say:"Les équations servent à résoudre des problèmes. Je pense à un nombre, je le multiplie par deux et j’ajoute sept, j’obtiens dix-neuf. On appelle x le nombre cherché. L’énoncé devient deux x plus sept égale dix-neuf. On enlève sept : deux x égale douze. On divise par deux : x égale six. Le nombre mystère était six !"}]}
].map(L=>({...L,sub:"maths",bank:LBANK[L.id]}));

function speakFr(text){if(!canSpeak())return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="fr-FR";u.rate=.95;const v=frVoice();if(v)u.voice=v;u.onend=u.onerror=()=>{if(lesson){lesson.speaking=false;updSpeakBtn()}};if(lesson){lesson.speaking=true}speechSynthesis.speak(u);updSpeakBtn()}catch(e){}}
function stopSpeak(){try{speechSynthesis.cancel()}catch(e){}if(lesson){lesson.speaking=false;updSpeakBtn()}}

function openLesson(id){const L=LESSON[id];if(!L)return;lesson={id,i:0,speaking:false};state.lessons=state.lessons||{};if(!state.lessons[id]){state.lessons[id]={seen:Date.now(),best:null,last:null,tries:0};save()}
  document.getElementById("quiz").hidden=false;document.body.style.overflow="hidden";renderLesson();if(state.voiceAuto!==false)setTimeout(()=>{if(lesson&&lesson.i===0)speakFr(L.steps[0].say)},300)}
function closeLesson(){stopSpeak();clearDemos();lesson=null;document.getElementById("quiz").hidden=true;document.body.style.overflow="";render()}

/* ---------- briques de circuits (SVG) ---------- */
const WR=(d,cls="wire")=>`<path class="${cls}" d="${d}"/>`;
const batt=(x,y)=>`<rect class="cover" x="${x-22}" y="${y-9}" width="44" height="18"/><rect class="hot" x="${x-26}" y="${y-14}" width="52" height="28" rx="6"/><line class="plate" x1="${x-18}" y1="${y-8}" x2="${x+18}" y2="${y-8}"/><line class="plate thick" x1="${x-9}" y1="${y+8}" x2="${x+9}" y2="${y+8}"/><text class="sgn" x="${x+24}" y="${y-5}">+</text><text class="sgn" x="${x+24}" y="${y+17}">−</text>`;
const bulb=(x,y,cls="")=>`<g class="${cls}"><circle class="glow" cx="${x}" cy="${y}" r="30"/><circle class="bulb" cx="${x}" cy="${y}" r="15"/><path class="sym" d="M${x-10.6},${y-10.6} L${x+10.6},${y+10.6} M${x+10.6},${y-10.6} L${x-10.6},${y+10.6}"/></g>`;
const swt=(x1,x2,y)=>`<rect class="cover" x="${x1+1}" y="${y-10}" width="${x2-x1-2}" height="20"/><line class="lever" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" style="transform-origin:${x1}px ${y}px"/><circle class="pin" cx="${x1}" cy="${y}" r="4"/><circle class="pin" cx="${x2}" cy="${y}" r="4"/>`;
const resi=(x,y,v="")=>`<rect class="cover" x="${x-20}" y="${y-9}" width="40" height="18"/><rect class="res" x="${x-18}" y="${y-8}" width="36" height="16" rx="2"/>${v?`<text class="cap" x="${x}" y="${y-16}" text-anchor="middle">${v}</text>`:""}`;
const amp=(x,y)=>`<circle class="meter" cx="${x}" cy="${y}" r="16"/><text class="sgn" x="${x}" y="${y+6}" text-anchor="middle">A</text>`;
const cap=(x,y,t,a="middle")=>`<text class="cap" x="${x}" y="${y}" text-anchor="${a}">${t}</text>`;
const efig=(inner,h=200)=>`<svg class="efig" viewBox="0 0 320 ${h}" role="img" aria-label="Circuit électrique">${inner}</svg>`;
const LOOP="M40,91 V40 H280 V160 H40 V109";
const stage=(id,attrs,svg,buttons)=>`<div class="stage" id="${id}" ${attrs}>${svg}</div>${buttons?`<div class="tools stage-tools">${buttons}</div>`:""}`;
const sbtn=(id,key,label,val)=>`<button class="btn small ${val?"ghost":""}" data-stgt="${id}" ${val?`data-stgset="${key}:${val}"`:`data-stg="${key}"`}>${label}</button>`;

/* ---------- robot ---------- */
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]],OPL={F:"avancer",L:"tourner à gauche",R:"tourner à droite"};
const DEMOS={};let demoTimers=[];
function clearDemos(){demoTimers.forEach(clearTimeout);demoTimers=[]}
function robotCompile(cfg){const lines=[],exec=[];let s={x:cfg.start[0],y:cfg.start[1],d:cfg.start[2]};const walls=new Set((cfg.walls||[]).map(w=>w.join(",")));
  const ahead=()=>{const [dx,dy]=DIRS[s.d],nx=s.x+dx,ny=s.y+dy;return nx<0||ny<0||nx>=cfg.w||ny>=cfg.h||walls.has(nx+","+ny)},atGoal=()=>cfg.goal&&s.x===cfg.goal[0]&&s.y===cfg.goal[1];
  (function emit(ns,ind){for(const n of ns){n._l=lines.length;if(n.op)lines.push({t:OPL[n.op],ind});else if(n.rep){lines.push({t:`répéter ${n.rep} fois :`,ind});emit(n.body,ind+1)}else if(n.until){lines.push({t:"tant que pas sur le drapeau :",ind});emit(n.body,ind+1)}else if(n.ifw){lines.push({t:"si mur devant :",ind});emit(n.then,ind+1);n._le=lines.length;lines.push({t:"sinon :",ind});emit(n.else,ind+1)}}})(cfg.prog,0);
  (function run(ns){for(const n of ns){if(exec.length>150)return;
    if(n.op){if(n.op==="F"&&!ahead()){s.x+=DIRS[s.d][0];s.y+=DIRS[s.d][1]}else if(n.op==="L")s.d=(s.d+3)%4;else if(n.op==="R")s.d=(s.d+1)%4;exec.push({l:n._l,...s})}
    else if(n.rep){for(let k=0;k<n.rep;k++){exec.push({l:n._l,...s});run(n.body)}}
    else if(n.until){while(!atGoal()&&exec.length<150){exec.push({l:n._l,...s});run(n.body)}exec.push({l:n._l,...s})}
    else if(n.ifw){exec.push({l:n._l,...s});if(ahead())run(n.then);else{exec.push({l:n._le,...s});run(n.else)}}}})(cfg.prog);
  return {lines,exec}}
const CS=44;
function robotSvg(w,h,s,opts={}){const m=6;let g="";
  for(let x=0;x<w;x++)for(let y=0;y<h;y++){const wall=(opts.walls||[]).some(c=>c[0]===x&&c[1]===y);g+=`<rect class="${wall?"rwall":"rcell"}" x="${m+x*CS}" y="${m+y*CS}" width="${CS}" height="${CS}"/>`}
  if(opts.goal){const [gx,gy]=opts.goal,X=m+gx*CS,Y=m+gy*CS;g+=`<line class="pole" x1="${X+14}" y1="${Y+8}" x2="${X+14}" y2="${Y+38}"/><polygon class="flag" points="${X+15},${Y+8} ${X+34},${Y+15} ${X+15},${Y+22}"/>`}
  (opts.labels||[]).forEach(([x,y,t])=>g+=`<text class="rlab" x="${m+x*CS+CS/2}" y="${m+y*CS+CS/2+8}" text-anchor="middle">${t}</text>`);
  g+=`<polyline class="trail" points=""/>`;
  g+=`<g class="robot" style="transform:translate(${m+s.x*CS+CS/2}px,${m+s.y*CS+CS/2}px) rotate(${s.d*90}deg)"><circle r="15" class="rbody"/><polygon class="reye" points="0,-13 7,-1 -7,-1"/></g>`;
  return `<svg class="rfig" viewBox="0 0 ${w*CS+2*m} ${h*CS+2*m}" role="img" aria-label="Grille du robot">${g}</svg>`}
function robotDemo(id,cfg){const c=robotCompile(cfg);DEMOS[id]={...cfg,...c};
  return `<div class="demo" id="demo-${id}"><div class="rwrap">${robotSvg(cfg.w,cfg.h,{x:cfg.start[0],y:cfg.start[1],d:cfg.start[2]},cfg)}</div><ol class="prog">${c.lines.map((l,i)=>`<li data-l="${i}" style="padding-left:${10+l.ind*24}px">${l.t}</li>`).join("")}</ol></div><div class="tools stage-tools"><button class="btn small" data-runrobot="${id}">▶ Lancer le programme</button></div>`}
function runRobot(id){const D=DEMOS[id],root=document.getElementById("demo-"+id);if(!D||!root)return;clearDemos();
  const rob=root.querySelector(".robot"),trail=root.querySelector(".trail"),lis=[...root.querySelectorAll(".prog li")],m=6,pos=s=>`translate(${m+s.x*CS+CS/2}px,${m+s.y*CS+CS/2}px) rotate(${s.dd??s.d*90}deg)`;
  let rot=D.start[2]*90,prevD=D.start[2];const pts=[`${m+D.start[0]*CS+CS/2},${m+D.start[1]*CS+CS/2}`];
  rob.style.transition="none";rob.style.transform=pos({x:D.start[0],y:D.start[1],d:D.start[2]});trail.setAttribute("points",D.trail?pts.join(" "):"");root.classList.remove("done");void rob.getBoundingClientRect();rob.style.transition="";
  D.exec.forEach((e,i)=>demoTimers.push(setTimeout(()=>{let diff=e.d-prevD;if(diff===3)diff=-1;if(diff===-3)diff=1;rot+=diff*90;prevD=e.d;
    rob.style.transform=pos({x:e.x,y:e.y,dd:rot});lis.forEach(li=>li.classList.toggle("cur",+li.dataset.l===e.l));
    const p=`${m+e.x*CS+CS/2},${m+e.y*CS+CS/2}`;if(D.trail&&pts[pts.length-1]!==p){pts.push(p);trail.setAttribute("points",pts.join(" "))}
    if(i===D.exec.length-1){root.classList.add("done");beep([[660,0,.12],[880,.12,.2]])}},500+i*650)))}
/* ---------- trace de code (variables, Python) ---------- */
function traceDemo(id,cfg){DEMOS[id]={...cfg,i:-1};
  return `<div class="trace" id="demo-${id}"><pre class="tcode ${cfg.py?"py":""}">${cfg.lines.map((l,i)=>`<span class="tl" data-l="${i}">${esc(l)||" "}</span>`).join("")}</pre><div class="tside"><div class="tvars" aria-label="Variables"></div><p class="tnote muted"></p><div class="tout" aria-label="Affichage"><b>Écran</b><div class="touts"></div></div></div></div>
  <div class="tools stage-tools"><button class="btn small" data-tstep="${id}">▶ Instruction suivante</button><button class="btn ghost small" data-tplay="${id}">Tout jouer</button><button class="btn ghost small" data-treset="${id}">Recommencer</button></div>`}
function traceShow(id){const D=DEMOS[id],root=document.getElementById("demo-"+id);if(!D||!root)return;const st=D.steps[D.i],prev=D.steps[D.i-1];
  root.querySelectorAll(".tl").forEach(el=>el.classList.toggle("cur",!!st&&+el.dataset.l===st.l));
  const vars=st?st.vars:{};root.querySelector(".tvars").innerHTML=Object.keys(vars).length?Object.entries(vars).map(([k,v])=>`<div class="tvar ${prev&&prev.vars[k]===v?"":"pop"}"><span>${esc(k)}</span><b>${esc(String(v))}</b></div>`).join(""):`<span class="muted">Pas encore de variable</span>`;
  root.querySelector(".tnote").textContent=st&&st.note?st.note:"";
  root.querySelector(".touts").innerHTML=D.steps.slice(0,D.i+1).filter(s=>s.out!=null).map(s=>`<div>${esc(s.out)}</div>`).join("")||`<span class="muted">rien pour l’instant</span>`;
  const btn=document.querySelector(`[data-tstep="${id}"]`);if(btn){btn.disabled=D.i>=D.steps.length-1;btn.textContent=D.i>=D.steps.length-1?"Programme terminé":"▶ Instruction suivante"}}
function traceStep(id){const D=DEMOS[id];if(!D||D.i>=D.steps.length-1)return;D.i++;traceShow(id)}
function tracePlay(id){const D=DEMOS[id];if(!D)return;clearDemos();D.i=-1;traceShow(id);D.steps.forEach((_,k)=>demoTimers.push(setTimeout(()=>traceStep(id),600+k*1100)))}

function bitsDemo(id){DEMOS[id]={v:0};const V=[128,64,32,16,8,4,2,1];
  return `<div class="bits" id="demo-${id}">${V.map((v,i)=>`<button class="bit" data-bit="${id}:${i}" aria-pressed="false"><i></i><b>0</b><span>${v}</span></button>`).join("")}</div><p class="bitout" id="bitout-${id}">Allume des lampes : <b>0</b></p>`}
function bitToggle(id,i){const D=DEMOS[id],root=document.getElementById("demo-"+id);if(!D||!root)return;D.v^=(128>>i);
  [...root.querySelectorAll(".bit")].forEach((b,k)=>{const on=!!(D.v&(128>>k));b.setAttribute("aria-pressed",on);b.querySelector("b").textContent=on?1:0});

function initStep(){const box=document.querySelector(".lesson .lbody");if(!box)return;
