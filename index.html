   say:"À la fin des années quatre-vingt, Arrigo Sacchi et son AC Milan révolutionnent la défense. Fini le marquage individuel : on défend une zone, en deux lignes de quatre très proches. Quand le ballon va d’un côté, tout le bloc coulisse vers lui, comme si les joueurs étaient reliés par des cordes. Et quand le ballon arrive près de la ligne de touche, on presse tous ensemble."},
  {t:"Individuel ou zone ?",h:ltab([["","Marquage individuel","Défense en zone"],["je surveille","un joueur","un espace"],["si mon joueur part","je le suis partout","je le laisse au partenaire de la zone suivante"],["la défense","peut être désorganisée","reste en place"],["exemple","catenaccio","Milan de Sacchi"]])+KEY("Presque toutes les équipes modernes défendent <b>en zone</b>, avec du pressing."),
   say:"Avec le marquage individuel, tu suis un joueur partout. En zone, tu surveilles un espace, et tu passes le joueur à ton partenaire quand il sort de ta zone. Aujourd’hui, presque toutes les équipes défendent en zone, avec du pressing."}]},
 {id:"fg_pos",sub:"foot",lvl:"5e",title:"Guardiola : le jeu de position",desc:"2-3-5, 5 couloirs, les 3 supériorités",bank:[...FTB.pep.slice(0,3),FTB.lire[1],FTB.lire[0],FTB.hist[5]],steps:[
  {t:"Du 4-3-3 au 2-3-5",h:tacBoard("fp1",{frames:[
    {p:{...T433,...B442},b:"a5",n:"Barcelone, puis Manchester City de <b>Guardiola</b>. Sur le papier : un 4-3-3."},
    {a:[["a3",[53,24],"run"],["a2",[53,44],"run"],["a8",[79,19],"run"],["a10",[79,49],"run"],["a11",[78,4],"run"],["a7",[78,64],"run"]],n:"Mais avec le ballon, l’équipe se transforme…"},
    {p:{...P235,b10:[64,29],b9:[64,39]},d:1600,n:"…en <b>2-3-5</b> : 2 défenseurs, 3 milieux (dont les 2 latéraux rentrés), 5 attaquants."},
    {z:laneZ(),n:"Un attaquant <b>par couloir</b> : les 5 couloirs sont occupés. Les 4 défenseurs rouges ne peuvent pas tout couvrir."},
    {z:[{r:[76,1,13,66],k:"good",t:"5 contre 4",sm:1}],n:"5 contre 4 sur la dernière ligne : un bleu est forcément libre. C’est la <b>supériorité numérique</b>."}]}),
   say:"Avec Barcelone puis Manchester City, Guardiola a perfectionné le jeu de position. Sur le papier, son équipe joue en quatre, trois, trois. Mais avec le ballon, elle se transforme en deux, trois, cinq. Les deux latéraux rentrent au milieu, et cinq joueurs occupent les cinq couloirs. Face à quatre défenseurs, il y a toujours un attaquant libre."},
  {t:"Renverser pour isoler",h:tacBoard("fp2",{frames:[
    {p:{...P235,...B442,b2:[86,8],b5:[86,20],b4:[86,32],b3:[86,46],b7:[73,6],b8:[73,20],b6:[73,33],b11:[73,46],b10:[64,24],b9:[64,34]},b:"a3",n:"Le ballon est à gauche. Les rouges <b>coulissent</b> tous vers lui."},
    {a:[["a3","a6"]],n:"On fait vite circuler…"},
    {b:"a6",d:600,a:[["a6","a2"]],n:"…une passe, deux passes…"},
    {b:"a2",d:600,a:[["a2","a7"]],n:"…et un renversement vers l’ailier droit."},
    {b:"a7",p:{b3:[86,56]},d:1000,z:[{lab:["a7",0,-3.4,"1 contre 1"]}],n:"L’ailier est seul contre son défenseur : c’est la <b>supériorité qualitative</b>. Ton meilleur dribbleur contre un seul adversaire."},
    {p:{a7:[96,52],b3:[90,57]},b:"a7",d:900,n:"Dribble réussi…"},
    {a:[["a7","a10"]],p:{a10:[92,40]},d:900,n:"…passe en retrait vers le joueur du demi-espace…"},
    {b:[105,34],p:{b1:[101,38]},goal:true,d:600,n:"<b>BUT !</b> On a attiré l’adversaire d’un côté pour frapper de l’autre."}]}),
   say:"Le ballon est à gauche, et les rouges coulissent tous vers lui. Les bleus font vite circuler le ballon, puis renversent le jeu vers l’ailier droit. Il se retrouve seul contre son défenseur : c’est la supériorité qualitative. Il dribble, passe en retrait, but. L’idée de Guardiola : attirer l’adversaire d’un côté pour frapper de l’autre."},
  {t:"Les règles du jeu de position",h:ltab([["Règle","Pourquoi"],["pas plus de 2 joueurs dans le même couloir","pour étirer l’adversaire en largeur"],["pas plus de 3 joueurs sur la même ligne horizontale","pour toujours avoir des passes en diagonale"],["le ballon court, les joueurs restent à leur place","le ballon va plus vite qu’un joueur"],["supériorité numérique","être plus nombreux là où est le ballon"],["supériorité positionnelle","être mieux placé (entre les lignes, dans le dos)"],["supériorité qualitative","mettre le meilleur joueur en duel"]])+KEY("Guardiola : « Prendre le ballon, le passer, et occuper les espaces. » Le jeu de position, c’est d’abord <b>être au bon endroit</b>."),
   say:"Les règles du jeu de position : jamais plus de deux joueurs dans le même couloir, jamais plus de trois sur la même ligne, et c’est le ballon qui court, pas les joueurs. On cherche trois supériorités : être plus nombreux, être mieux placés, et mettre son meilleur joueur en duel."}]},
 {id:"fg_build",sub:"foot",lvl:"5e",title:"La relance courte et le latéral inversé",desc:"Construire depuis le gardien",bank:[FTB.pep[3],FTB.pep[4],FTB.lire[4],FTB.lire[5],FTB.pep[2],FTB.pep[9]],steps:[
  {t:"Casser le pressing",h:tacBoard("fb1",{frames:[
    {p:{a1:[4,34],a5:[12,22],a4:[12,46],a3:[22,6],a2:[22,62],a6:[26,34],a8:[36,22],a10:[36,46],a11:[54,6],a9:[58,34],a7:[54,62],b10:[22,27],b9:[22,41],b8:[30,30],b6:[40,24],b7:[40,46],b2:[30,10],b11:[30,58],b5:[70,28],b4:[70,40],b1:[101,34]},b:"a1",n:"Les rouges pressent haut avec 2 attaquants. Le gardien bleu a le ballon."},
    {a:[["a2",[27,41],"run"]],n:"Le latéral droit rentre dans l’axe, à côté de la sentinelle…"},
    {p:{a2:[27,41],b11:[30,52]},z:[{lab:["a2",0,3.6,"latéral inversé"]}],d:1100,n:"…c’est le <b>latéral inversé</b>."},
    {z:[{r:[1,16,16,36],k:"good",t:"3 contre 2",sm:1}],n:"Derrière : gardien + 2 centraux = <b>3 contre 2</b>. Une passe sera toujours libre."},
    {a:[["a1","a4"]],n:"Le gardien joue court, exprès…"},
    {b:"a4",p:{b9:[15,44]},d:900,n:"…pour <b>attirer</b> le pressing."},
    {a:[["a4","a2"]],n:"Le défenseur trouve le latéral inversé…"},
    {b:"a2",d:800,n:"…libre dans l’axe : la première ligne rouge est cassée."},
    {a:[["a2","a10"]],p:{a10:[46,46]},d:900,n:"Il joue vers l’avant…"},
    {b:"a10",d:800,n:"…et le milieu reçoit entre les lignes. On a <b>attiré</b>, puis on est <b>sorti</b>."}]}),
   say:"Les rouges pressent haut. Le latéral droit des bleus rentre dans l’axe, à côté de la sentinelle : c’est le latéral inversé. Derrière, le gardien et les deux défenseurs centraux font trois contre deux attaquants : une passe sera toujours libre. Le gardien joue court, exprès, pour attirer le pressing. Puis le défenseur trouve le latéral inversé, libre, et le jeu sort vers l’avant. On attire, puis on sort."},
  {t:"Les rôles modernes",h:ltab([["Rôle","Ce qu’il fait"],["gardien relanceur","joue au pied comme un défenseur de plus"],["sentinelle (le 6)","se place devant les défenseurs, oriente le jeu"],["latéral inversé","rentre au milieu au lieu de monter le long de la touche"],["défenseur hybride","défenseur central qui monte au milieu quand on a le ballon"],["ailier à pied inversé","un gaucher à droite : il rentre pour frapper"]])+`<p>Ces rôles existent aussi dans les jeux de manager : en lisant ces cours, tu comprends ce que font vraiment tes consignes tactiques.</p>`+KEY("La relance courte est risquée : une erreur près de son but coûte cher. Elle demande de la <b>technique</b> et du <b>courage</b>."),
   say:"Voici les rôles modernes : le gardien relanceur, la sentinelle, le latéral inversé, le défenseur hybride, et l’ailier à pied inversé, comme un gaucher qui joue à droite pour rentrer et frapper. Attention : la relance courte est risquée. Une erreur près de son but peut coûter un but. Il faut de la technique et du courage."}]},
 {id:"fg_3h",sub:"foot",lvl:"5e",title:"Le troisième homme et le faux 9",desc:"Les combinaisons de Barcelone",bank:[FTB.pep[5],FTB.pep[6],FTB.lire[2],FTB.lire[4],FTB.pep[2],FTB.hist[6]],steps:[
  {t:"Le troisième homme",h:tacBoard("f3a",{frames:[
    {p:{a5:[40,30],a6:[46,40],a8:[56,22],a9:[74,34],b8:[59,23],b6:[60,38],b5:[84,30],b4:[84,40],b2:[80,14],b1:[101,34]},b:"a5",a:[["a5","a8","block"]],n:"Le défenseur veut trouver le milieu (C), mais il est marqué de près."},
    {a:[["a9",[63,33],"run"]],n:"L’avant-centre (B) décroche vers le ballon…"},
    {p:{a9:[63,33],b5:[68,32]},d:1000,a:[["a5","a9"]],n:"…son défenseur le suit. Passe vers B."},
    {b:"a9",a:[["a9",[78,22]],["a8",[78,22],"run"]],d:900,n:"B remet <b>en une touche</b>, pendant que C démarre dans le dos de son défenseur."},
    {p:{a8:[78,22]},b:"a8",d:1000,n:"C reçoit lancé, face au but : c’est le <b>troisième homme</b>. Son défenseur regardait le ballon."},
    {b:[105,31],p:{b1:[101,29]},goal:true,d:700,n:"<b>BUT !</b> A → B → C : la combinaison préférée de Barcelone."}]}),
   say:"Le défenseur veut passer à son milieu, mais celui-ci est marqué. Alors il joue l’avant-centre, qui décroche vers le ballon et remet tout de suite en une touche. Pendant ce temps, le milieu a démarré dans le dos de son défenseur, qui regardait le ballon. Il reçoit lancé. C’est le troisième homme : A passe à B, qui remet à C."},
  {t:"Le faux 9",h:tacBoard("f3b",{frames:[
    {p:{a9:[84,34],a11:[80,8],a7:[80,60],a8:[68,24],a10:[68,44],a6:[58,34],b5:[89,29],b4:[89,39],b2:[87,12],b3:[87,56],b8:[76,28],b6:[76,40],b1:[101,34]},b:"a6",n:"L’avant-centre est coincé entre les deux défenseurs centraux."},
    {a:[["a9",[72,34],"run"]],n:"Il <b>décroche</b> au milieu : c’est un <b>faux 9</b>."},
    {p:{a9:[72,34],b4:[79,37]},d:1100,z:[{r:[84,29,10,12],k:"good",t:"trou",sm:1}],n:"Le défenseur central le suit… et laisse un trou derrière lui."},
    {a:[["a6","a9"],["a11",[92,35],"run"]],z:[{r:[84,29,10,12],k:"good"}],n:"Passe au faux 9, pendant que l’ailier gauche plonge en diagonale."},
    {b:"a9",p:{a11:[88,30]},d:900,a:[["a9",[94,36]]],n:"Remise dans le trou…"},
    {p:{a11:[94,36]},b:"a11",d:800,n:"…l’ailier est seul !"},
    {b:[105,32],p:{b1:[101,38]},goal:true,d:600,n:"<b>BUT !</b> Avec Messi en faux 9, Barcelone gagne 6-2 à Madrid en mai 2009."}]}),
   say:"L’avant-centre est coincé entre les deux défenseurs centraux. Alors il décroche au milieu : c’est un faux neuf. Si le défenseur le suit, il laisse un trou derrière lui, et un ailier plonge dedans. S’il ne le suit pas, le faux neuf est libre au milieu. Guardiola a utilisé Lionel Messi comme ça, notamment lors de la victoire six à deux de Barcelone au stade du Real Madrid, en mai 2009."},
  {t:"Le dilemme",h:KEY("Une bonne combinaison pose un <b>dilemme</b> au défenseur : quoi qu’il fasse, il a tort. Suivre le faux 9 ouvre un trou ; ne pas le suivre le laisse libre.")+ltab([["Combinaison","Le principe"],["une-deux","je passe et je reçois en retour dans le dos"],["troisième homme","A → B → C, C est déjà lancé"],["faux 9","l’avant-centre décroche, les ailiers plongent"],["appel-contre-appel","je feinte vers le ballon, puis je pars dans le dos"]]),
   say:"Le secret d’une bonne combinaison : poser un dilemme au défenseur. Quoi qu’il fasse, il a tort. S’il suit le faux neuf, il ouvre un trou. S’il ne le suit pas, le faux neuf est libre."}]},
 {id:"fg_press",sub:"foot",lvl:"5e",title:"Contre-pressing et rest défense",desc:"Guardiola, Klopp et le Gegenpressing",bank:[...FTB.pep.slice(7,10),FTB.hist[8],FTB.math[8],FTB.pep[1]],steps:[
  {t:"Récupérer en quelques secondes",h:tacBoard("fr1",{frames:[
    {p:{...P235,b5:[88,40],b4:[88,52],b2:[86,24],b3:[84,62],b6:[76,44],b8:[76,30],b11:[70,58],b7:[70,12],b10:[62,36],b9:[60,46],b1:[101,34]},b:"a10",z:[{r:[40,20,16,28],k:"info",t:"rest défense",sm:1}],n:"Les bleus attaquent, mais 5 joueurs restent derrière le ballon : la <b>rest défense</b> (2 + 3)."},
    {b:"b5",p:{b5:[85,47]},d:700,n:"Ballon perdu !"},
    {a:[["a10",[82,48],"run"],["a9",[85,42],"run"],["a7",[84,55],"run"],["a2",[78,46],"run"]],n:"Réflexe : les plus proches foncent <b>tout de suite</b> sur le porteur."},
    {p:{a10:[82,48],a9:[85,43],a7:[84,54],a2:[76,46]},d:900,n:"C’est le <b>contre-pressing</b>. Guardiola parle souvent d’environ 5 à 6 secondes pour récupérer."},
    {b:[50,40],p:{b5:[86,47]},d:900,n:"Le rouge, pressé, dégage au hasard…"},
    {p:{a4:[50,40]},b:"a4",d:600,n:"…et la rest défense récupère. L’attaque bleue recommence !"}]}),
   say:"Même quand ses joueurs attaquent, Guardiola en garde cinq derrière le ballon : c’est la rest défense, deux plus trois. Quand on perd le ballon, les plus proches foncent tout de suite sur le porteur : c’est le contre-pressing. L’adversaire, pressé, dégage au hasard, et la rest défense récupère. L’attaque peut recommencer. Jürgen Klopp, à Dortmund puis à Liverpool, a rendu célèbre cette idée sous le nom de Gegenpressing."},
  {t:"Les déclencheurs de pressing",h:ltab([["Déclencheur","Pourquoi presser maintenant ?"],["passe en retrait","l’adversaire recule : on peut avancer"],["mauvais contrôle","le ballon s’éloigne de son pied"],["joueur dos au but","il ne voit pas ce qui arrive"],["passe lente ou en l’air","on a le temps d’arriver"],["ballon près de la touche","la ligne de touche est un défenseur de plus"]])+KEY("On ne presse pas n’importe quand : on presse <b>tous ensemble</b>, au <b>bon signal</b>."),
   say:"On ne presse pas n’importe quand. On attend un signal, un déclencheur : une passe en retrait, un mauvais contrôle, un joueur dos au but, une passe lente, ou un ballon près de la touche. À ce signal, toute l’équipe presse en même temps."},
  {t:"Gegenpressing",h:`<p>Jürgen Klopp (Dortmund puis Liverpool) disait que le contre-pressing est le meilleur meneur de jeu du monde : récupérer le ballon tout près du but adverse crée des occasions énormes.</p>`+KEY("Ballon perdu près du but adverse = la défense adverse n’est pas encore en place. C’est le moment le plus dangereux… pour <b>elle</b>."),
   say:"Jürgen Klopp disait que le contre-pressing est le meilleur meneur de jeu du monde. Quand on récupère le ballon juste après l’avoir perdu, tout près du but adverse, la défense n’est pas encore en place. C’est une énorme occasion."}]},
 {id:"fd_xg",sub:"foot",lvl:"5e",title:"Maths : les expected goals (xG)",desc:"Calcule les chances de but d’un tir",gen:xgSumGen,bank:FTB.math.slice(0,5),steps:[
  {t:"Qu’est-ce que l’xG ?",h:`<p>Les analystes ont étudié des centaines de milliers de tirs. Pour chaque position, ils savent combien finissent au fond.</p>`+KEY("Le <b>xG</b> (expected goals, « buts attendus ») d’un tir, c’est la <b>probabilité</b> qu’il devienne un but : un nombre entre 0 et 1.")+ltab([["Tir","xG environ","Ça veut dire"],["penalty","0,76","3 buts sur 4"],["face au but, à 6 m","0,5 à 0,7","plus d’un but sur 2"],["point de penalty, en jeu","0,2 à 0,3","1 but sur 4 ou 5"],["entrée de la surface","0,1","1 but sur 10"],["à 30 m","0,03","3 buts sur 100"]]),
   say:"Les analystes ont étudié des centaines de milliers de tirs. Pour chaque endroit du terrain, ils savent combien de tirs finissent au fond. Le x G, pour expected goals, buts attendus, d’un tir, c’est sa probabilité de devenir un but : un nombre entre zéro et un. Un penalty vaut environ zéro virgule sept six, soit trois buts sur quatre. Un tir de trente mètres, seulement zéro virgule zéro trois."},
  {t:"À toi de tirer !",h:`<p>Le but est en haut. Touche le terrain pour placer des tirs. Le triangle jaune montre l’<b>angle</b> vers les poteaux : plus il est ouvert, plus c’est facile.</p>`+xgMap("xg1")+`<p class="muted">Modèle simplifié, calculé avec la distance et l’angle de tir. Les vrais modèles ajoutent : tir du pied ou de la tête, défenseurs devant, passe reçue…</p>`,
   say:"À toi de tirer. Le but est en haut de l’image. Touche le terrain pour placer un tir : je calcule sa distance, son angle, et son x G. Le triangle jaune montre l’angle de tir vers les deux poteaux. Essaie de tirer du point de penalty, puis de loin, puis depuis un côté, près de la ligne de but. Tu verras que l’angle compte autant que la distance."},
  {t:"Lire un match avec les xG",h:ltab([["","Bleus","Rouges"],["tirs","6","2"],["xG de chaque tir","0,05 · 0,08 · 0,1 · 0,12 · 0,3 · 0,76","0,04 · 0,35"],["xG total","1,41","0,39"],["score","0","1"]])+EX(`<p>Les bleus ont « mérité » environ 1,4 but, les rouges environ 0,4. Pourtant les rouges gagnent : ils ont été <b>efficaces</b>, ou les bleus ont manqué de <b>réussite</b> (penalty raté !).</p>`)+KEY("L’xG d’une équipe, c’est la <b>somme</b> des xG de ses tirs. Sur un match, le hasard compte. Sur une saison, l’xG dit qui joue vraiment bien."),
   say:"Pour un match, on additionne les x G de tous les tirs. Ici, les bleus totalisent un virgule quatre un, les rouges zéro virgule trois neuf. Pourtant, les rouges gagnent un à zéro ! Sur un seul match, le hasard compte beaucoup. Mais sur une saison entière, le x G montre quelles équipes jouent vraiment bien."}]},
 {id:"fd_proba",sub:"foot",lvl:"4e",title:"Maths : probabilités et loi de Poisson",desc:"Pourquoi le meilleur ne gagne pas toujours",gen:()=>pick([penPairGen,xgSumGen])(),bank:[...FTB.math.slice(5,8),FTB.math[9],FTB.math[4],FTB.math[3]],steps:[
  {t:"Simule des matchs",h:`<p>Les bleus créent en moyenne <b>1,8</b> but attendu par match, les rouges <b>0,9</b>. Les bleus sont deux fois plus forts… gagnent-ils toujours ?</p>`+poisWidget("po1",1.8,.9),
   say:"Les bleus créent en moyenne un virgule huit but attendu par match, les rouges zéro virgule neuf. Les bleus sont deux fois plus forts. Mais gagnent-ils toujours ? Lance un match, puis cent, puis mille. Regarde : les bleus gagnent souvent, mais pas toujours. Et plus tu joues de matchs, plus les résultats se rapprochent des pourcentages calculés. C’est la loi des grands nombres."},
  {t:"La loi de Poisson",h:`<p>Les buts sont rares et arrivent un peu au hasard. Les mathématiciens utilisent la <b>loi de Poisson</b> (du mathématicien français Siméon Denis Poisson, 1837) :</p>`+CALC("P(k buts) = e^(−λ) × λ^k ÷ k!\n\nλ = nombre moyen de buts (le xG)\nk! = 1 × 2 × … × k     e ≈ 2,718")+EX(CALC("λ = 1 :  P(0 but) = e^(−1) ≈ 0,37\n        P(1 but) = e^(−1) × 1 ≈ 0,37\n        P(2 buts) = e^(−1) × 1 ÷ 2 ≈ 0,18"))+KEY("Même une équipe qui marque en moyenne 1 but ne marque <b>pas du tout</b> dans environ 37 % de ses matchs."),
   say:"Pour calculer ces pourcentages, les mathématiciens utilisent la loi de Poisson, inventée par le Français Siméon Denis Poisson. Lambda, c’est le nombre moyen de buts. Pour une équipe qui marque en moyenne un but par match, la probabilité de ne pas marquer du tout est d’environ trente-sept pour cent. Change les curseurs de l’étape précédente pour voir le tableau changer."},
  {t:"Le penalty et la théorie des jeux",h:`<p>Exemple simplifié : le tireur frappe à gauche ou à droite, le gardien plonge à gauche ou à droite.</p>`+ltab([["","Gardien plonge à gauche","Gardien plonge à droite"],["Tireur à gauche","le gardien arrête souvent","but presque sûr"],["Tireur à droite","but presque sûr","le gardien arrête souvent"]])+KEY("Si le tireur choisit <b>toujours</b> le même côté, le gardien le devine. La meilleure stratégie : <b>varier au hasard</b>. C’est la théorie des jeux, une branche des maths.")+`<p>Deux penalties de suite à 3 chances sur 4 : 3/4 × 3/4 = 9/16, soit environ 56 %.</p>`,
   say:"Au penalty, si le tireur frappe toujours du même côté, le gardien finit par le deviner. La meilleure stratégie, c’est de varier au hasard. C’est ce qu’étudie la théorie des jeux. Et pour enchaîner deux réussites, on multiplie les probabilités : trois quarts fois trois quarts, cela fait neuf seizièmes, à peu près cinquante-six pour cent."}]},
 {id:"fd_stats",sub:"foot",lvl:"6e",title:"Les stats du foot moderne",desc:"Possession, PPDA, réseaux de passes",gen:ppdaGen,bank:[FTB.math[8],FTB.math[10],FTB.math[4],FTB.pep[7],FTB.math[0],FTB.lire[2]],steps:[
  {t:"Le réseau de passes",h:`<p>Chaque trait relie deux joueurs : plus il est épais, plus ils se sont fait de passes.</p>`+tacBoard("fn1",{frames:[
    {p:P235,nob:true,n:"Positions moyennes des bleus pendant un match."},
    {nob:true,z:[["a5","a4",9],["a5","a3",7],["a4","a2",7],["a3","a6",8],["a2","a6",8],["a6","a8",7],["a6","a10",7],["a3","a11",4],["a2","a7",4],["a8","a11",5],["a10","a7",5],["a8","a9",3],["a10","a9",3],["a5","a6",5],["a4","a6",5]].map(x=>({ln:x})),n:"Le réseau de passes : on voit tout de suite comment l’équipe joue."},
    {nob:true,h:["a6"],z:[["a3","a6",8],["a2","a6",8],["a6","a8",7],["a6","a10",7],["a5","a6",5],["a4","a6",5]].map(x=>({ln:x})),n:"La <b>sentinelle</b> (6) est au centre de tout : c’est elle qu’il faut gêner pour casser le jeu bleu."}]}),
   say:"Les analystes dessinent des réseaux de passes. Chaque joueur est placé à sa position moyenne, et chaque trait relie deux joueurs : plus il est épais, plus ils se sont fait de passes. On voit tout de suite le cerveau de l’équipe. Ici, c’est la sentinelle, le numéro six. Un entraîneur adverse demandera de la marquer de près."},
  {t:"Le PPDA : mesurer le pressing",h:CALC("PPDA = passes de l’adversaire dans sa moitié\n       ÷ actions défensives de ton équipe dans cette zone")+EX(CALC("L’adversaire fait 240 passes, ton équipe fait 30 tacles,\ninterceptions ou fautes dans cette zone :\nPPDA = 240 ÷ 30 = 8"))+KEY("Plus le PPDA est <b>petit</b>, plus l’équipe presse <b>fort</b> : elle laisse peu de passes à l’adversaire avant d’intervenir."),
   say:"Le P P D A mesure le pressing : c’est le nombre de passes que l’adversaire peut faire avant que ton équipe intervienne. On divise les passes de l’adversaire dans sa moitié de terrain par le nombre de tacles, interceptions et fautes de ton équipe dans cette zone. Deux cent quarante divisé par trente égale huit. Plus le nombre est petit, plus le pressing est fort."},
  {t:"Possession ou efficacité ?",h:ltab([["Stat","Ce qu’elle mesure","Son piège"],["possession","le temps avec le ballon","on peut avoir le ballon sans danger"],["tirs","le nombre de frappes","100 tirs de 30 m valent peu"],["xG","la qualité des occasions","un seul match reste du hasard"],["passes progressives","les passes qui avancent vraiment","ne dit pas si l’action finit bien"]])+KEY("Aucune stat ne dit tout seule qui a bien joué. Les analystes les <b>croisent</b> : c’est comme ça que les clubs choisissent leurs joueurs et préparent les matchs."),
   say:"La possession dit qui a le ballon, mais pas si c’est dangereux. Les tirs disent combien de fois on frappe, mais pas d’où. Le x G mesure la qualité des occasions. Aucune statistique ne dit tout seule qui a bien joué. Les analystes des clubs les croisent toutes, pour recruter des joueurs et préparer les matchs."}]}

function roseG(cx,cy,R){const k=R*.28;let s=`<g class="rose"><circle cx="${cx}" cy="${cy}" r="${R*.62}" class="rc"/>`;
  s+=`<path class="rn" d="M${cx} ${cy-R}L${cx+k} ${cy-k}L${cx} ${cy}Z"/><path class="rs" d="M${cx} ${cy-R}L${cx-k} ${cy-k}L${cx} ${cy}Z"/>`;
  s+=`<path class="rs" d="M${cx} ${cy+R}L${cx-k} ${cy+k}L${cx} ${cy}Z"/><path class="rn2" d="M${cx} ${cy+R}L${cx+k} ${cy+k}L${cx} ${cy}Z"/>`;
  s+=`<path class="rs" d="M${cx+R} ${cy}L${cx+k} ${cy+k}L${cx} ${cy}Z"/><path class="rn2" d="M${cx+R} ${cy}L${cx+k} ${cy-k}L${cx} ${cy}Z"/>`;
  s+=`<path class="rs" d="M${cx-R} ${cy}L${cx-k} ${cy-k}L${cx} ${cy}Z"/><path class="rn2" d="M${cx-R} ${cy}L${cx-k} ${cy+k}L${cx} ${cy}Z"/>`;

function roseBig(){const cx=160,cy=150,R=110,k=30;let s="";

  for(const [l,a] of d){const big=a%90===0,L=big?R:R*.62,ang=(a-90)*Math.PI/180,x=cx+Math.cos(ang)*L,y=cy+Math.sin(ang)*L;
    const pa=ang+Math.PI/2,kk=big?k:k*.6,xl=cx+Math.cos(ang)*kk*.9+Math.cos(pa)*kk*.5,yl=cy+Math.sin(ang)*kk*.9+Math.sin(pa)*kk*.5,xr=cx+Math.cos(ang)*kk*.9-Math.cos(pa)*kk*.5,yr=cy+Math.sin(ang)*kk*.9-Math.sin(pa)*kk*.5;

    const tx=cx+Math.cos(ang)*(L+16),ty=cy+Math.sin(ang)*(L+16)+6;s+=svgT(tx.toFixed(0),ty.toFixed(0),l,big?"lb rl":"lb sm")}
  const W=[["Nord",cx+150,40],["Sud",cx+150,270],["Est",cx+150,140],["Ouest",cx-150,140]];

/* frise : 5 périodes de même largeur, la date est placée dans sa période */
const PER=[["Préhistoire",-20000,-3000],["Antiquité",-3000,476],["Moyen Âge",476,1492],["Temps modernes",1492,1789],["Époque contemporaine",1789,2030]];
const perOf=y=>PER.findIndex(p=>y>=p[1]&&y<p[2]);
const yTxt=y=>y<0?`${-y} av. J.-C.`:String(y);
function frise(y,lbl){const W=700,x0=10,w=136;let s="";
  PER.forEach(([n,a,b],i)=>{s+=`<rect class="per p${i}${perOf(y)===i?" on":""}" x="${x0+i*w}" y="52" width="${w-2}" height="34" rx="6"/>`+svgT(x0+i*w+w/2-1,74,n,"lb sm pl"+(i===4?" pl2":""))});
  [["−3000",1],["476",2],["1492",3],["1789",4]].forEach(([t,i])=>s+=svgT(x0+i*w-1,104,t,"lb xs"));
  if(y!=null){const i=perOf(y),[,a,b]=PER[i],x=x0+i*w+(w-2)*Math.min(.96,Math.max(.04,(y-a)/(b-a)));
    s+=`<path class="fm" d="M${x.toFixed(1)} 50L${(x-8).toFixed(1)} 36L${(x+8).toFixed(1)} 36Z"/>`+svgT(Math.min(W-60,Math.max(60,x)).toFixed(1),26,lbl||yTxt(y),"lb fy")}
  return `<svg class="mp frise" viewBox="0 0 ${W} 112" role="img" aria-label="Frise chronologique">${s}</svg>`}

const vig=(k)=>`<svg class="vig" viewBox="0 0 200 150" role="img" aria-hidden="true">${VIGD[k]||""}</svg>`;

/* ---------- outils communs ---------- */
const MAPR=m=>!m?"":m.w==="F"?mapF(m):m.w==="E"?mapE(m):m.w==="W"?mapW(m):m.w==="frise"?frise(m.y,m.l):m.w==="rose"?roseBig():"";
const fig=(svg,cap)=>`<figure class="mapbox">${svg}${cap?`<figcaption>${cap}</figcaption>`:""}</figure>`;
const stripT=h=>String(h).replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim();
const sayY=y=>y<0?`${-y} avant Jésus-Christ`:String(y);
function STORY(o){return {t:o.t,get h(){return `<div class="story">${vig(o.vig)}<div class="story-txt"><span class="date">${esc(o.yl||yTxt(o.y))}</span>${o.where?`<span class="where">${esc(o.where)}</span>`:""}<p>${o.hook}</p></div></div>`
  +o.text.map(p=>`<p>${p}</p>`).join("")+(o.key?KEY(o.key):"")+fig(frise(o.y,o.yl),"Où se place cette histoire sur la frise du temps")+(o.map?fig(MAPR(o.map),o.cap):"")},
  say:o.say||stripT(`${o.sayDate||sayY(o.y)}. ${o.hook} ${o.text.join(" ")} ${o.key?"À retenir : "+o.key:""}`)}}
const legend=items=>`<div class="legend">${items.map(([c,t])=>`<span><i style="background:var(${c})"></i>${t}</span>`).join("")}</div>`;
const dirOf=(a,b)=>{const dx=b[0]-a[0],dy=a[1]-b[1];let ang=Math.atan2(dx,dy)*180/Math.PI;if(ang<0)ang+=360;return ["le nord","le nord-est","l’est","le sud-est","le sud","le sud-ouest","l’ouest","le nord-ouest"][Math.round(ang/45)%8]};

/* ================= GÉOGRAPHIE : générateurs illustrés ================= */
const WPOOL=["FR","ES","IT","DE","GB","PL","NO","SE","FI","UA","TR","MA","DZ","TN","LY","EG","ML","NE","TD","SD","NG","CD","ET","KE","ZA","MG","AO","US","CA","MX","BR","AR","CL","PE","CO","VE","BO","CN","IN","JP","MN","KZ","SA","IR","ID","AU","NZ","PK","TH","RU","GL"];
const contOf=c=>c==="RU"?"eu":GEO.W.c[c]?.[0];
const contNameOf=c=>c==="RU"?"l’Europe et l’Asie":CONT[contOf(c)];
G.hgMonde=()=>{const t=R(1,5);
  if(t===1){const k=pick(["af","na","sa","as","eu","oc","an"]);return mcq("Quel continent est colorié en rouge sur la carte ?",cap1(CONT[k]),shuffle(Object.keys(CONT).filter(x=>x!==k).map(x=>cap1(CONT[x]))),`C’est ${CONT[k]}. Il y a 7 continents : l’Afrique, l’Amérique du Nord, l’Amérique du Sud, l’Antarctique, l’Asie, l’Europe et l’Océanie.`,{map:{w:"W",cont:k},sig:"cont"+k})}
  if(t===2){const k=pick(Object.keys(OCEAN));const tip={pac:"C’est le plus grand : il couvre presque un tiers de la Terre.",atl:"Il sépare l’Europe et l’Afrique des Amériques. Christophe Colomb l’a traversé en 1492.",ind:"Il baigne l’Afrique de l’Est, l’Inde et l’Australie.",arc:"C’est l’océan du pôle Nord, couvert de glace une grande partie de l’année.",aus:"Il entoure l’Antarctique, tout au sud de la Terre."}[k];
    return mcq("Quel océan est marqué d’un point d’interrogation ?",cap1(OCEAN[k]),shuffle(Object.keys(OCEAN).filter(x=>x!==k).map(x=>cap1(OCEAN[x]))),`C’est ${OCEAN[k]}. ${tip}`,{map:{w:"W",ocean:k,oceanQ:1},sig:"oc"+k})}
  const c=pick(WPOOL.filter(x=>x!=="GL")),nm=CNAME(c);
  if(t===3&&c!=="RU"){const k=contOf(c);return mcq(`Le pays en rouge est : ${nm}. Sur quel continent se trouve-t-il ?`,cap1(CONT[k]),shuffle(["af","na","sa","as","eu","oc"].filter(x=>x!==k).map(x=>cap1(CONT[x]))),`${nm} est en ${CONTN[k]}.`,{map:{w:"W",hi:c},sig:"pc"+c})}
  const same=WPOOL.filter(x=>x!==c&&x!=="GL"&&contOf(x)===contOf(c)),other=WPOOL.filter(x=>x!==c&&x!=="GL"&&contOf(x)!==contOf(c));
  const wr=shuffle(same).slice(0,2).concat(shuffle(other).slice(0,2)).map(CNAME);
  const cp=CAPOF(nm);return mcq("Quel est ce pays, colorié en rouge ?",nm,wr,`C’est ${nm}, sur le continent ${c==="RU"?"européen et asiatique (la Russie est sur deux continents !)":"« "+CONTN[contOf(c)]+" »"}.${cp?` Sa capitale est ${cp.k}.`:""}`,{map:{w:"W",hi:c},sig:"pw"+c})};
const FCITY=["paris","marseille","lyon","toulouse","nice","nantes","strasbourg","bordeaux","lille","rennes","brest","montpellier"];
G.hgFrance=()=>{const t=R(1,6);
  if(t===1){const k=pick(Object.keys(RIVN)),info={loire:"C’est le plus long fleuve de France (environ 1 000 km). Il se jette dans l’océan Atlantique près de Nantes.",seine:"Elle traverse Paris et se jette dans la Manche, au Havre.",rhone:"Il vient de Suisse, passe à Lyon et se jette dans la mer Méditerranée.",garonne:"Elle naît en Espagne, passe à Toulouse et à Bordeaux, puis rejoint l’océan Atlantique.",rhin:"Il forme la frontière avec l’Allemagne, près de Strasbourg, et se jette dans la mer du Nord."}[k];
    return mcq("Quel fleuve est tracé en rouge ?",cap1(RIVN[k]),shuffle(Object.keys(RIVN).filter(x=>x!==k).map(x=>cap1(RIVN[x]))),`C’est ${RIVN[k]}. ${info}`,{map:{w:"F",allRiv:1,rivOn:k},sig:"riv"+k})}
  if(t===2){const k=pick(Object.keys(MTN)),info={alpes:"Les Alpes sont les plus hautes montagnes de France : le mont Blanc y culmine à environ 4 806 m.",pyrenees:"Les Pyrénées forment la frontière avec l’Espagne.",mc:"Le Massif central, au centre, est fait d’anciens volcans, comme le puy de Dôme.",jura:"Le Jura est à la frontière avec la Suisse.",vosges:"Les Vosges sont à l’est, en Alsace et en Lorraine. Leurs sommets sont arrondis car elles sont très anciennes.",armor:"Le Massif armoricain, en Bretagne, est si vieux qu’il est devenu presque plat."}[k];
    return mcq("Quel massif montagneux est marqué en rouge ?",cap1(MTN[k]),shuffle(Object.keys(MTN).filter(x=>x!==k).map(x=>cap1(MTN[x]))),`C’est ${MTN[k]}. ${info}`,{map:{w:"F",mtn:"all",mtnOn:k,mtnQ:k},sig:"mtn"+k})}
  if(t===3){const k=pick(FCITY);return mcq("Quelle ville est marquée en rouge sur la carte ?",CITY[k],shuffle(FCITY.filter(x=>x!==k).map(x=>CITY[x])),`C’est ${CITY[k]}.${k==="paris"?" C’est la capitale de la France.":""}`,{map:{w:"F",allRiv:1,pts:[{k,on:1,big:1}]},sig:"city"+k})}
  if(t===4){const k=pick(Object.keys(SEAN));return mcq("Quelle mer ou quel océan borde la France à l’endroit du point d’interrogation ?",cap1(SEAN[k]),shuffle(Object.keys(SEAN).filter(x=>x!==k).map(x=>cap1(SEAN[x]))),`C’est ${SEAN[k]}. La France est bordée par la mer du Nord, la Manche, l’océan Atlantique et la mer Méditerranée.`,{map:{w:"F",sea:k,seaQ:1},sig:"sea"+k})}
  if(t===5){const k=pick(["BE","LU","DE","CH","IT","ES","GB"]),nm=CNAME(k);return mcq("Quel pays voisin de la France est colorié en rouge ?",nm,shuffle(["BE","LU","DE","CH","IT","ES","GB"].filter(x=>x!==k).map(CNAME)),`C’est ${nm}.${k==="GB"?" Le Royaume-Uni est relié à la France par le tunnel sous la Manche.":""}`,{map:{w:"F",hi:k},sig:"nb"+k})}
  let a=pick(FCITY),b=pick(FCITY);while(b===a)b=pick(FCITY);const P=GEO.F.P,d=dirOf(P[a],P[b]);
  return mcq(`Regarde la carte : ${CITY[b]} (point rouge) se trouve vers ___ de ${CITY[a]} (point noir).`,d,["le nord","le nord-est","l’est","le sud-est","le sud","le sud-ouest","l’ouest","le nord-ouest"].filter(x=>x!==d),`Sur une carte, le nord est en haut, le sud en bas, l’est à droite et l’ouest à gauche. ${CITY[b]} est vers ${d} de ${CITY[a]}.`,{map:{w:"F",rose:1,pts:[{k:a,lbl:CITY[a],big:1},{k:b,lbl:CITY[b],on:1,big:1}]},sig:"dir"+a+b})};
const EPOOL=["FR","ES","PT","IT","DE","GB","IE","BE","NL","CH","AT","PL","CZ","HU","RO","BG","GR","HR","RS","UA","BY","NO","SE","FI","DK","IS","LT","LV","EE","TR","MA","DZ","TN","LY","EG","SK"];
const EU27=["FR","DE","IT","ES","PT","BE","NL","LU","IE","AT","DK","SE","FI","PL","CZ","SK","HU","SI","HR","RO","BG","GR","CY","MT","EE","LV","LT"];
G.hgEurope=()=>{const c=pick(EPOOL),nm=CNAME(c),t=R(1,3),small=["BE","NL","CH","AT","CZ","HU","HR","RS","DK","LT","LV","EE","SK","IE"].includes(c);
  const cp=CAPOF(nm),near=shuffle(EPOOL.filter(x=>x!==c)).slice(0,3).map(CNAME);
  if(t===2&&cp)return mcq(`Quelle est la capitale du pays colorié en rouge ?`,cp.k,shuffle(CAPS.filter(x=>x!==cp&&(x.z==="eu"||x.z==="af")).map(x=>x.k)),`Le pays en rouge est ${nm}. Sa capitale est ${cp.k}. ${cp.a}`,{map:{w:"E",hi:c,small},sig:"ecap"+c});
  if(t===3){const inEU=EU27.includes(c);return mcq(`Le pays en rouge est : ${nm}. Fait-il partie de l’Union européenne ?`,inEU?"Oui":"Non",[inEU?"Non":"Oui"],inEU?`Oui, ${nm} fait partie des 27 pays de l’Union européenne.`:`Non. ${nm} ne fait pas partie de l’Union européenne${c==="GB"?" : le Royaume-Uni en est sorti en 2020 (le Brexit)":["NO","CH","IS"].includes(c)?", même s’il est en Europe et travaille beaucoup avec elle":["MA","DZ","TN","LY","EG"].includes(c)?" : il est en Afrique, de l’autre côté de la Méditerranée":""}.`,{map:{w:"E",hi:c,soft:EU27,small},sig:"eue"+c})}
  return mcq("Quel est ce pays, colorié en rouge ?",nm,near,`C’est ${nm}.${cp?` Sa capitale est ${cp.k}.`:""}`,{map:{w:"E",hi:c,small},sig:"epc"+c})};

const GLESS=[
 {id:"g_monde",sub:"hg",lvl:"CM2",title:"Les continents et les océans",desc:"La carte du monde en 5 étapes",gen:G.hgMonde,steps:[
  {t:"La Terre mise à plat",get h(){return `<p>La Terre est une boule. Pour la voir en entier sur une feuille, on la « déplie » : c’est un <b>planisphère</b>. En bleu, les océans. En beige, les terres.</p>`+fig(mapW({}),"Un planisphère : toute la Terre sur une seule image.")+KEY("Les océans couvrent environ 70 % de la Terre. Les terres, seulement 30 % !")},say:"La Terre est une grosse boule. Pour la voir en entier sur une feuille de papier, on la déplie, un peu comme une peau d’orange qu’on étale. Cette carte s’appelle un planisphère. En bleu, ce sont les océans. En beige, ce sont les terres. Regarde bien : il y a beaucoup plus de bleu ! Les océans couvrent environ soixante-dix pour cent de la Terre."},
  {t:"Les 7 continents",get h(){return fig(mapW({cont:"all",contLbl:1}),"Chaque couleur est un continent.")+ltab([["Continent","Le savais-tu ?"],["Asie","Le plus grand et le plus peuplé (la Chine, l’Inde, le Japon)"],["Afrique","Le Sahara, le plus grand désert chaud du monde"],["Amérique du Nord","Le Canada, les États-Unis, le Mexique"],["Amérique du Sud","La forêt amazonienne, au Brésil"],["Antarctique","Le continent glacé du pôle Sud, sans habitants permanents"],["Europe","Notre continent, avec la France"],["Océanie","Le plus petit : l’Australie et des milliers d’îles"]])},say:"Les terres sont découpées en sept continents. L’Asie est le plus grand et le plus peuplé. L’Afrique, avec le grand désert du Sahara. L’Amérique du Nord et l’Amérique du Sud. L’Antarctique, le continent glacé du pôle Sud. L’Europe, notre continent. Et l’Océanie, le plus petit, avec l’Australie. Une astuce pour les retenir : A, A, A, A, A, E, O. Cinq continents commencent par la lettre A !"},
  {t:"Les 5 océans",get h(){return fig(mapW({ocean:"all"}),"Le Pacifique est si grand qu’on le voit des deux côtés de la carte.")+KEY("Les 5 océans : <b>Pacifique</b> (le plus grand), <b>Atlantique</b>, <b>Indien</b>, <b>Arctique</b> (au nord) et <b>Austral</b> (au sud).")},say:"Il y a cinq océans. Le Pacifique est le plus grand : il est tellement immense qu’on le voit à gauche et à droite de la carte. L’Atlantique est entre l’Europe et l’Amérique. L’océan Indien est sous l’Inde. L’océan Arctique est tout en haut, au pôle Nord, et l’océan Austral tout en bas, autour de l’Antarctique."},
  {t:"Les lignes imaginaires",get h(){return fig(mapW({eq:1,grid:1,gr:1,hemi:1}),"L’équateur en rouge, le méridien de Greenwich en bleu, les tropiques en pointillés.")+`<p>L’<b>équateur</b> coupe la Terre en deux moitiés : l’<b>hémisphère Nord</b> et l’<b>hémisphère Sud</b>. Près de l’équateur, il fait chaud toute l’année.</p>`+KEY("Le méridien de Greenwich passe près de Londres… et aussi par la France ! C’est lui qui sert de départ pour compter les fuseaux horaires.")},say:"Sur les cartes, on trace des lignes imaginaires pour se repérer. L’équateur, en rouge, coupe la Terre en deux moitiés : l’hémisphère Nord en haut, et l’hémisphère Sud en bas. Près de l’équateur, il fait chaud toute l’année. Les deux lignes en pointillés sont les tropiques. Et la ligne bleue, c’est le méridien de Greenwich : il passe près de Londres, et aussi par la France !"},
  {t:"Et la France, alors ?",get h(){return fig(mapW({hi:"FR",pts:[{k:"paris",lbl:"Paris"}],ringR:20}),"La France, entourée en rouge.")+`<p>La France est en <b>Europe</b>, dans l’<b>hémisphère Nord</b>. Elle est bordée par l’océan <b>Atlantique</b> et par la mer <b>Méditerranée</b>.</p>`+KEY("Pour dire où se trouve un pays : son continent, son hémisphère, et les océans ou mers qui le bordent.")},say:"Et la France ? Elle est en Europe, dans l’hémisphère Nord. On voit un petit morceau rouge en Amérique du Sud : c’est la Guyane, qui est aussi française ! La France est bordée par l’océan Atlantique à l’ouest et par la mer Méditerranée au sud."}]},
 {id:"g_france",sub:"hg",lvl:"CM2",title:"Fleuves, montagnes et mers de France",desc:"La carte de France illustrée",gen:G.hgFrance,steps:[
  {t:"Une France en forme d’hexagone",get h(){return fig(mapF({sea:"all",nbLbl:1,pts:[{k:"paris",lbl:"Paris"}]}),"La France métropolitaine et ses voisins. En bas à droite : la Corse.")+`<p>On surnomme la France l’<b>Hexagone</b>, car elle a à peu près 6 côtés : 3 côtés de mer et 3 côtés de terre.</p>`+KEY("Mers et océan : la mer du Nord, la Manche, l’océan Atlantique, la mer Méditerranée.")},say:"Regarde la forme de la France : elle a à peu près six côtés, comme un hexagone. C’est pour ça qu’on l’appelle l’Hexagone ! Trois côtés touchent la mer : la Manche et la mer du Nord au nord, l’océan Atlantique à l’ouest, la mer Méditerranée au sud. Trois côtés touchent d’autres pays : la Belgique, le Luxembourg, l’Allemagne, la Suisse, l’Italie et l’Espagne."},
  {t:"Les 5 grands fleuves",get h(){return fig(mapF({allRiv:1,rivLbl:1,pts:[{k:"paris",lbl:"Paris"},{k:"lyon",lbl:"Lyon"},{k:"bordeaux",lbl:"Bordeaux"},{k:"nantes",lbl:"Nantes"}]}),"Les fleuves vont toujours de la montagne vers la mer.")+ltab([["Fleuve","Longueur","Il se jette dans…"],["La Loire","≈ 1 000 km","l’océan Atlantique"],["La Seine","≈ 780 km","la Manche"],["Le Rhône","≈ 810 km","la mer Méditerranée"],["La Garonne","≈ 530 km","l’océan Atlantique"],["Le Rhin","≈ 1 230 km","la mer du Nord"]])+KEY("Un <b>fleuve</b> se jette dans la mer. Une <b>rivière</b> se jette dans un autre cours d’eau.")},say:"La France a cinq grands fleuves. La Loire est le plus long fleuve qui coule entièrement en France : environ mille kilomètres. La Seine traverse Paris et se jette dans la Manche. Le Rhône passe à Lyon et va jusqu’à la Méditerranée. La Garonne passe à Toulouse et à Bordeaux. Et le Rhin fait la frontière avec l’Allemagne. Retiens bien : un fleuve se jette dans la mer, alors qu’une rivière se jette dans un autre cours d’eau."},
  {t:"Les montagnes",get h(){return fig(mapF({mtn:"all",mtnLbl:1,pts:[{k:"mtblanc",lbl:"Mont Blanc",on:1}]}),"Triangles pointus : montagnes jeunes. Triangles plats : montagnes anciennes.")+`<div class="duo">${KEY("<b>Montagnes jeunes</b> : hautes et pointues. Les Alpes, les Pyrénées, le Jura.")}${KEY("<b>Montagnes anciennes</b> : usées par le temps, arrondies. Le Massif central, les Vosges, le Massif armoricain.")}</div><p>Le plus haut sommet de France est le <b>mont Blanc</b> (environ 4 806 m), dans les Alpes.</p>`},say:"La France a deux sortes de montagnes. Les montagnes jeunes sont hautes et pointues : les Alpes, les Pyrénées et le Jura. Les montagnes anciennes ont été usées pendant des millions d’années par la pluie et le vent : elles sont plus basses et arrondies. Ce sont le Massif central, les Vosges et le Massif armoricain en Bretagne. Le plus haut sommet de France est le mont Blanc, dans les Alpes : environ quatre mille huit cents mètres !"},
  {t:"Les grandes villes",get h(){return fig(mapF({allRiv:1,pts:FCITY.map(k=>({k,lbl:CITY[k]}))}),"Beaucoup de grandes villes sont construites au bord d’un fleuve ou de la mer.")+KEY("Les 3 plus grandes villes : <b>Paris</b>, <b>Marseille</b>, <b>Lyon</b>.")+`<p>Regarde : Paris est sur la Seine, Lyon sur le Rhône, Bordeaux sur la Garonne, Nantes sur la Loire. Autrefois, les fleuves servaient de routes pour transporter les marchandises en bateau.</p>`},say:"Voici les grandes villes de France. Les trois plus grandes sont Paris, Marseille et Lyon. Tu remarques quelque chose ? Beaucoup de villes sont au bord d’un fleuve : Paris sur la Seine, Lyon sur le Rhône, Bordeaux sur la Garonne, Nantes sur la Loire. Autrefois, il n’y avait ni camions ni trains, et les bateaux sur les fleuves servaient à transporter les marchandises."},
  {t:"Se repérer : la rose des vents",get h(){return `<div class="duo">${fig(roseBig(),"La rose des vents")}${fig(mapF({rose:1,pts:[{k:"paris",lbl:"Paris",big:1},{k:"marseille",lbl:"Marseille",on:1,big:1},{k:"brest",lbl:"Brest",big:1},{k:"strasbourg",lbl:"Strasbourg",big:1}]}),"Marseille est au sud de Paris.")}</div>`+KEY("En haut : le <b>nord</b>. En bas : le <b>sud</b>. À droite : l’<b>est</b>. À gauche : l’<b>ouest</b>. Astuce : « <b>N</b>e <b>E</b>ntre <b>S</b>ans <b>O</b>uvrir » en tournant comme les aiguilles d’une montre.")},say:"Pour se repérer sur une carte, on utilise la rose des vents. En haut, c’est le nord. En bas, le sud. À droite, l’est, et à gauche, l’ouest. Une astuce : en tournant comme les aiguilles d’une montre depuis le haut, on lit N, E, S, O : Ne Entre Sans Ouvrir ! Sur la carte, Marseille est au sud de Paris, Strasbourg est à l’est, et Brest est à l’ouest. Entre deux directions, on dit par exemple sud-est ou nord-ouest."}]},
 {id:"g_europe",sub:"hg",lvl:"CM2",title:"Les pays d’Europe sur la carte",desc:"Voisins, Union européenne, Méditerranée",gen:G.hgEurope,steps:[
  {t:"L’Europe, notre continent",get h(){return fig(mapE({lbl:["FR","ES","IT","DE","GB","PL","NO","SE","FI","UA","TR","GR","RU"]}),"L’Europe et la mer Méditerranée.")+`<p>L’Europe est un petit continent, mais il compte une quarantaine de pays ! La <b>Russie</b> est le plus grand : elle continue très loin en Asie.</p>`},say:"Voici l’Europe, notre continent. Il est petit comparé à l’Asie ou à l’Afrique, mais il compte une quarantaine de pays. Le plus grand pays d’Europe est la Russie : il est si grand qu’il continue en Asie, jusqu’à l’océan Pacifique ! En Europe de l’Ouest, on trouve la France, l’Espagne, l’Italie, l’Allemagne et le Royaume-Uni."},
  {t:"Nos voisins",get h(){return fig(mapE({hi:["BE","LU","DE","CH","IT","ES","AD","MC"],soft:["FR"],lbl:["FR","BE","DE","CH","IT","ES"]}),"En rouge : les pays qui touchent la France.")+KEY("La France a 8 voisins en Europe : la Belgique, le Luxembourg, l’Allemagne, la Suisse, l’Italie, Monaco, l’Espagne et Andorre.")},say:"La France touche huit pays en Europe. Au nord, la Belgique et le Luxembourg. À l’est, l’Allemagne, la Suisse et l’Italie. Au sud, l’Espagne, et deux tout petits pays : Monaco, au bord de la Méditerranée, et Andorre, dans les Pyrénées. Ces deux-là sont si petits qu’on les voit à peine sur la carte !"},
  {t:"L’Union européenne",get h(){return fig(mapE({soft:EU27,hi:["FR"],lbl:["FR","DE","IT","ES","PL","SE"]}),"En rose : les 27 pays de l’Union européenne.")+`<p>Depuis 1957, des pays d’Europe se sont unis pour travailler ensemble et vivre en paix. Aujourd’hui, ils sont <b>27</b>. Beaucoup utilisent la même monnaie : l’<b>euro</b>.</p>`+KEY("Le Royaume-Uni a quitté l’Union européenne en 2020 : c’est le « Brexit ». La Suisse et la Norvège n’en ont jamais fait partie.")},say:"Après les terribles guerres du vingtième siècle, des pays d’Europe ont décidé de travailler ensemble pour vivre en paix. Cela a commencé en mille neuf cent cinquante-sept avec six pays, dont la France. Aujourd’hui, ils sont vingt-sept : c’est l’Union européenne. Beaucoup utilisent la même monnaie, l’euro. Le Royaume-Uni en est sorti en deux mille vingt : c’est ce qu’on a appelé le Brexit."},
  {t:"De l’autre côté de la Méditerranée",get h(){return fig(mapE({hi:["MA","DZ","TN"],soft:["LY","EG"],lbl:["MA","DZ","TN","LY","EG","FR","IT"],medLbl:1,pts:[{k:"tunis",lbl:"Tunis"}]}),"Le Maghreb (en rouge) fait face à l’Europe.")+`<p>Au sud de la Méditerranée commence l’<b>Afrique</b>. Le Maroc, l’Algérie et la Tunisie forment le <b>Maghreb</b>, ce qui veut dire « le couchant » en arabe : le pays où le soleil se couche.</p>`+KEY("Entre l’Espagne et le Maroc, le <b>détroit de Gibraltar</b> ne mesure que 14 km de large !")},say:"Au sud de la mer Méditerranée, c’est déjà l’Afrique. Le Maroc, l’Algérie et la Tunisie forment le Maghreb, un mot arabe qui veut dire le couchant : l’endroit où le soleil se couche, à l’ouest. La Méditerranée relie l’Europe et l’Afrique depuis l’Antiquité. Entre l’Espagne et le Maroc, au détroit de Gibraltar, les deux continents ne sont séparés que par quatorze kilomètres de mer !"}]}
];

/* ================= HISTOIRE : petites histoires illustrées ================= */
const HLESS=[
 {id:"hs_anti",sub:"hg",lvl:"CM2",title:"Histoires de la Préhistoire et de l’Antiquité",desc:"Lascaux, Toutânkhamon, Hannibal, Alésia, Pompéi",steps:[
  {t:"La frise du temps",get h(){return `<p>Les historiens découpent le passé en <b>5 grandes périodes</b>. Chaque histoire de ce cours sera placée sur cette frise.</p>`+fig(frise(null),"Les dates marquent le passage d’une période à l’autre.")+ltab([["Date","Ce qui change"],["vers 3000 av. J.-C.","L’invention de l’écriture : fin de la Préhistoire"],["476","La chute de l’Empire romain d’Occident"],["1492","Christophe Colomb arrive en Amérique"],["1789","La Révolution française"]])+KEY("« av. J.-C. » veut dire « avant Jésus-Christ ». Plus le nombre est grand, plus c’est ancien : −17 000, c’est bien plus vieux que −52 !")},say:"Avant les histoires, voici la frise du temps. Les historiens découpent le passé en cinq grandes périodes : la Préhistoire, l’Antiquité, le Moyen Âge, les Temps modernes et l’Époque contemporaine, celle où nous vivons. On passe de la Préhistoire à l’Antiquité quand l’écriture est inventée, vers trois mille ans avant Jésus-Christ. Attention au piège : avant Jésus-Christ, plus le nombre est grand, plus c’est ancien !"},
  STORY({t:"Le chien qui découvrit Lascaux",vig:"lascaux",y:-17000,yl:"vers 17 000 av. J.-C.",sayDate:"Il y a environ dix-neuf mille ans",where:"Montignac, Dordogne",hook:"Un jour de septembre 1940, quatre adolescents se promènent dans les bois avec un chien nommé Robot.",
   text:["Selon la légende, Robot disparaît dans un trou caché sous un arbre tombé. En cherchant à le sauver, Marcel, 18 ans, et ses amis se glissent sous terre…","À la lumière d’une lampe, ils découvrent des murs couverts de <b>chevaux</b>, de <b>taureaux</b> et de <b>cerfs</b> peints il y a environ 19 000 ans par des hommes de la Préhistoire !","Les peintres utilisaient de la terre colorée (l’ocre) et du charbon de bois, et soufflaient parfois la peinture autour de leur main pour la dessiner."],
   key:"Pour protéger les vraies peintures, la grotte est fermée au public. On visite une copie parfaite : Lascaux 4.",map:{w:"F",pts:[{k:"lascaux",lbl:"Lascaux",on:1,big:1},{k:"paris",lbl:"Paris"}]},cap:"Lascaux est dans le sud-ouest de la France."}),
  STORY({t:"Le trésor du jeune pharaon",vig:"egypte",y:-1330,yl:"vers 1330 av. J.-C.",sayDate:"Vers mille trois cent trente avant Jésus-Christ",where:"Vallée des Rois, Égypte",hook:"Toutânkhamon devient pharaon d’Égypte à seulement 9 ans environ : à peu près ton âge !",
   text:["Il meurt jeune, vers 19 ans. On l’enterre dans un tombeau creusé dans la roche, rempli de trésors pour son voyage dans l’au-delà.","Plus de 3 000 ans plus tard, en 1922, l’archéologue anglais <b>Howard Carter</b> découvre l’entrée. Il perce un petit trou, approche une bougie… et voit briller de l’or partout !","Dans le tombeau : des chars, des bijoux, des jeux… et un masque en or massif d’environ 10 kg posé sur la momie du roi."],
   key:"Les Égyptiens écrivaient avec des <b>hiéroglyphes</b>. C’est grâce à l’écriture qu’on connaît si bien leur histoire.",map:{w:"E",pts:[{k:"thebes",lbl:"Vallée des Rois",on:1,big:1},{k:"gizeh",lbl:"Pyramides de Gizeh"}]},cap:"L’Égypte, au bord du Nil, en Afrique."}),
  STORY({t:"Hannibal et les éléphants",vig:"hannibal",y:-218,yl:"218 av. J.-C.",where:"De Carthage (Tunisie) jusqu’en Italie",hook:"Carthage, une puissante cité près de l’actuelle Tunis, est en guerre contre Rome.",
   text:["Le général carthaginois <b>Hannibal</b> a une idée folle : attaquer Rome par surprise, en passant par la terre, avec une armée et environ <b>37 éléphants de guerre</b>.","Il traverse l’Espagne, les Pyrénées, le fleuve Rhône sur des radeaux… puis les <b>Alpes</b> enneigées. Le froid et les chemins glissants sont terribles : beaucoup de soldats et presque tous les éléphants meurent.","Mais Hannibal arrive en Italie et bat les Romains plusieurs fois, notamment à Cannes en 216 av. J.-C. Rome finira pourtant par gagner la guerre."],
   key:"Hannibal est considéré comme l’un des plus grands chefs militaires de l’histoire. Ses tactiques sont encore étudiées aujourd’hui.",map:{w:"E",route:"hannibal",pts:[{k:"carthage",lbl:"Carthage",on:1,big:1},{k:"carthagene",lbl:"Carthagène"},{k:"rome",lbl:"Rome"}]},cap:"Le long voyage d’Hannibal, en pointillés rouges."}),
  STORY({t:"Vercingétorix à Alésia",vig:"alesia",y:-52,yl:"52 av. J.-C.",where:"Alésia, en Bourgogne",hook:"Jules César, un général romain, veut conquérir la Gaule, notre pays à l’époque.",
   text:["Un jeune chef gaulois, <b>Vercingétorix</b>, réunit de nombreux peuples gaulois et bat César à Gergovie.","Mais César l’enferme dans la ville fortifiée d’<b>Alésia</b>. Ses soldats construisent deux longues palissades tout autour : une pour empêcher les Gaulois de sortir, une autre pour bloquer ceux qui viennent les aider !","Affamé, Vercingétorix se rend. Il jette ses armes aux pieds de César. La Gaule devient romaine pour presque 500 ans : les <b>Gallo-Romains</b>."],
   key:"De cette époque, on garde des routes, des arènes (Nîmes), des aqueducs (le pont du Gard)… et beaucoup de mots venus du latin !",map:{w:"F",pts:[{k:"alesia",lbl:"Alésia",on:1,big:1},{k:"paris",lbl:"Paris"}]},cap:"Alésia, près de Dijon."}),
  STORY({t:"Pompéi, la ville figée",vig:"pompei",y:79,yl:"79 après J.-C.",sayDate:"En l’an soixante-dix-neuf après Jésus-Christ",where:"Pompéi, Italie",hook:"Pompéi est une ville romaine animée, au pied d’une montagne tranquille : le Vésuve.",
   text:["Un matin, le Vésuve se réveille : c’est un volcan ! Une énorme colonne de fumée monte dans le ciel, puis des pierres et des cendres brûlantes tombent sur la ville.","En quelques heures, Pompéi est recouverte par plusieurs mètres de cendres. Un jeune Romain, Pline, observe tout de l’autre côté de la baie et le raconte dans des lettres.","Pompéi est redécouverte 1 700 ans plus tard : les rues, les maisons, les boulangeries avec leur pain, tout est resté en place !"],
   key:"Grâce à Pompéi, on sait comment vivaient les Romains : leurs maisons, leurs repas, leurs jeux.",map:{w:"E",pts:[{k:"pompei",lbl:"Pompéi",on:1,big:1},{k:"rome",lbl:"Rome"}]},cap:"Pompéi, au sud de Rome, près de Naples."})]},
 {id:"hs_ma",sub:"hg",lvl:"CM2",title:"Histoires du Moyen Âge",desc:"Clovis, Charlemagne, Guillaume, Ibn Battuta, Jeanne d’Arc",steps:[
  STORY({t:"Le vase de Soissons",vig:"soissons",y:486,where:"Soissons",hook:"Clovis est le roi des Francs, un peuple qui a donné son nom à la France.",
   text:["Après une victoire, ses soldats partagent le butin. Clovis demande pour lui un beau vase, pour le rendre à un évêque.","Un soldat refuse : « Tu n’auras que ce que le sort te donnera ! » et il frappe le vase avec sa hache.","Un an plus tard, en passant ses soldats en revue, Clovis reconnaît cet homme. Il jette ses armes par terre et le punit en disant : « Souviens-toi du vase de Soissons ! »"],
   key:"Clovis est baptisé chrétien à Reims. Ensuite, presque tous les rois de France seront sacrés dans la cathédrale de Reims.",map:{w:"F",pts:[{k:"soissons",lbl:"Soissons",on:1,big:1},{k:"reims",lbl:"Reims"},{k:"paris",lbl:"Paris"}]},cap:"Soissons et Reims, au nord-est de Paris."}),
  STORY({t:"Charlemagne, empereur à Noël",vig:"charlemagne",y:800,where:"Rome et Aix-la-Chapelle",hook:"Le jour de Noël de l’an 800, à Rome, le pape pose une couronne sur la tête de Charlemagne.",
   text:["Charlemagne, roi des Francs, devient <b>empereur</b> : il règne sur une grande partie de l’Europe, de l’Espagne jusqu’à l’Allemagne. Sa capitale est Aix-la-Chapelle.","Il veut que ses fonctionnaires sachent lire et écrire. Il ouvre des écoles dans les monastères.","Une légende raconte qu’il visitait les écoles et félicitait les bons élèves, même pauvres. Lui-même a appris à écrire très tard : il gardait des tablettes sous son oreiller pour s’entraîner la nuit !"],
   key:"C’est pour cela que la chanson dit « Sacré Charlemagne » : on le présente comme l’inventeur de l’école.",map:{w:"E",pts:[{k:"aix",lbl:"Aix-la-Chapelle",on:1,big:1},{k:"rome",lbl:"Rome",on:1,big:1},{k:"paris",lbl:"Paris"}]},cap:"Couronné à Rome, Charlemagne vivait à Aix-la-Chapelle."}),
  STORY({t:"Guillaume traverse la Manche",vig:"guillaume",y:1066,where:"De la Normandie à Hastings",hook:"Guillaume, duc de Normandie, affirme que le roi d’Angleterre lui avait promis sa couronne.",
   text:["Mais un autre, Harold, devient roi. Furieux, Guillaume fait construire des centaines de bateaux et traverse la <b>Manche</b> avec ses chevaliers et ses chevaux.","Le 14 octobre 1066, à <b>Hastings</b>, la bataille dure toute la journée. Harold est tué : Guillaume devient roi d’Angleterre. On l’appelle désormais Guillaume le Conquérant.","Toute l’histoire est brodée sur une immense bande de tissu de presque 70 m de long : la <b>tapisserie de Bayeux</b>, une vraie bande dessinée du Moyen Âge !"],
   key:"Après 1066, la langue anglaise a emprunté des milliers de mots au français : « castle », « justice », « beef »…",map:{w:"F",route:"guillaume",pts:[{k:"bayeux",lbl:"Bayeux"},{k:"hastings",lbl:"Hastings",on:1,big:1}]},cap:"La traversée de Guillaume, en pointillés rouges."}),
  STORY({t:"Ibn Battuta, le grand voyageur",vig:"battuta",y:1325,where:"De Tanger jusqu’en Chine",hook:"En 1325, un jeune Marocain de 21 ans, Ibn Battuta, quitte sa ville de Tanger pour le pèlerinage à La Mecque.",
   text:["Il part pour un an ou deux… et revient 24 ans plus tard ! Il a traversé l’Afrique du Nord, l’Égypte, l’Arabie, l’Inde et même la Chine.","À dos de chameau, en bateau ou à pied, il a parcouru environ 120 000 km : trois fois le tour de la Terre !","De retour au Maroc, il raconte ses aventures à un écrivain. Ce livre, la <b>Rihla</b> (« le voyage »), nous apprend comment on vivait dans tous ces pays au Moyen Âge."],
   key:"Au Moyen Âge, les savants du monde arabe étaient très en avance en astronomie, en médecine et en mathématiques. Les chiffres que tu utilises sont appelés « chiffres arabes ».",map:{w:"E",route:"battuta",pts:[{k:"tanger",lbl:"Tanger",on:1,big:1},{k:"lecaire",lbl:"Le Caire"}]},cap:"Le début de son voyage, de Tanger vers l’Égypte et l’Arabie."}),
  STORY({t:"Jeanne d’Arc délivre Orléans",vig:"jeanne",y:1429,where:"Orléans",hook:"La France et l’Angleterre sont en guerre depuis près de 100 ans. Les Anglais assiègent la ville d’Orléans.",
   text:["Jeanne, une jeune paysanne de Domrémy, affirme entendre des voix qui lui demandent de sauver le royaume.","À 17 ans, elle convainc le futur roi Charles VII, à Chinon, de lui confier une armée. Avec son étendard blanc, elle redonne courage aux soldats : le 8 mai 1429, Orléans est libérée !","Elle conduit ensuite Charles VII à Reims pour qu’il soit sacré roi. Capturée plus tard, elle est condamnée et brûlée à Rouen en 1431, à 19 ans."],
   key:"La guerre de Cent Ans a duré de 1337 à 1453 (en réalité 116 ans !). Jeanne d’Arc est devenue un symbole de courage.",map:{w:"F",route:"jeanne",pts:[{k:"domremy",lbl:"Domrémy"},{k:"chinon",lbl:"Chinon"},{k:"orleans",lbl:"Orléans",on:1,big:1},{k:"reims",lbl:"Reims"}]},cap:"Le chemin de Jeanne : Domrémy, Chinon, Orléans, puis Reims."})]},
 {id:"hs_mod",sub:"hg",lvl:"CM2",title:"Histoires des Temps modernes",desc:"Colomb, Léonard de Vinci, Louis XIV, la Bastille, Napoléon",steps:[
  STORY({t:"Christophe Colomb et la route des Indes",vig:"colomb",y:1492,where:"De l’Espagne aux Bahamas",hook:"Christophe Colomb est sûr d’une chose : la Terre est ronde. En allant tout droit vers l’ouest, on doit arriver en Asie, aux « Indes ».",
   text:["Le 3 août 1492, il part d’Espagne avec trois navires : la <b>Santa María</b>, la <b>Pinta</b> et la <b>Niña</b>. Le voyage est long ; les marins ont peur et veulent faire demi-tour.","Le 12 octobre 1492, un marin crie « Terre ! ». Colomb débarque sur une île des Bahamas. Il croit être en Asie et appelle les habitants les « Indiens ».","En réalité, il a atteint un continent que les Européens ne connaissaient pas : l’<b>Amérique</b>. Il ne l’a jamais su !"],
   key:"1492 marque le début des Temps modernes. Le continent porte le nom d’un autre explorateur, Amerigo Vespucci, qui comprit que c’était un « Nouveau Monde ».",map:{w:"W",route:"colomb",pts:[{k:"palos",lbl:"Palos (Espagne)"},{k:"guanahani",lbl:"Bahamas",on:1,big:1}]},cap:"La traversée de l’océan Atlantique : environ 2 mois."}),
  STORY({t:"Léonard de Vinci chez le roi de France",vig:"leonard",y:1516,where:"Amboise, sur la Loire",hook:"Léonard de Vinci est un génie italien : peintre, inventeur, ingénieur… Il dessine des machines volantes 400 ans avant les avions !",
   text:["Le jeune roi <b>François Ier</b> l’admire tellement qu’il l’invite en France en 1516. Léonard traverse les Alpes à dos de mule, avec trois tableaux dans ses bagages.","Parmi eux : la <b>Joconde</b>. Il vit ses dernières années au château du Clos Lucé, à Amboise, tout près du roi qui vient souvent discuter avec lui.","Voilà pourquoi la Joconde, le tableau le plus célèbre du monde, est aujourd’hui à Paris, au musée du Louvre."],
   key:"Cette époque s’appelle la <b>Renaissance</b> : on redécouvre l’art et les savoirs de l’Antiquité, et l’imprimerie fait circuler les livres.",map:{w:"E",pts:[{k:"vinci",lbl:"Vinci (Italie)"},{k:"amboise",lbl:"Amboise",on:1,big:1},{k:"paris",lbl:"Paris"}]},cap:"De Vinci, en Toscane, jusqu’à Amboise."}),
  STORY({t:"Louis XIV, le Roi-Soleil",vig:"louis14",y:1682,where:"Versailles",hook:"Louis XIV devient roi en 1643… à l’âge de 4 ans !",
   text:["Il règne 72 ans : c’est le plus long règne de l’histoire de France. Il choisit le <b>soleil</b> comme symbole : tout tourne autour de lui, comme les planètes autour du Soleil.","En 1682, il installe la cour au château de <b>Versailles</b>. La galerie des Glaces compte 357 miroirs, un luxe incroyable à l’époque.","Chaque jour, des centaines de nobles assistent à son lever, à ses repas, à son coucher… Louis XIV décide de tout seul : c’est la <b>monarchie absolue</b>."],
   key:"Versailles a coûté une fortune. Les impôts payés par le peuple vont nourrir une colère qui éclatera un siècle plus tard.",map:{w:"F",pts:[{k:"versailles",lbl:"Versailles",on:1,big:1},{k:"paris",lbl:"Paris"}]},cap:"Versailles, à l’ouest de Paris."}),
  STORY({t:"Le 14 juillet 1789",vig:"bastille",y:1789,where:"La Bastille, Paris",hook:"En 1789, le pain coûte très cher et le peuple a faim. Il réclame plus de justice.",
   text:["Le 14 juillet, des milliers de Parisiens marchent sur la <b>Bastille</b>, une forteresse-prison qui symbolise le pouvoir du roi. Ils y cherchent de la poudre pour leurs fusils.","Après plusieurs heures de combat, la Bastille est prise. Il n’y avait que 7 prisonniers à l’intérieur, mais la nouvelle fait le tour de la France !","Quelques semaines plus tard, les députés écrivent la <b>Déclaration des droits de l’homme et du citoyen</b> : « Les hommes naissent et demeurent libres et égaux en droits »."],
   key:"Le 14 juillet est devenu la fête nationale. Le drapeau bleu, blanc, rouge et la devise « Liberté, Égalité, Fraternité » viennent de la Révolution.",map:{w:"F",pts:[{k:"paris",lbl:"Paris",on:1,big:1},{k:"versailles",lbl:"Versailles"}]},cap:"Paris, cœur de la Révolution."}),
  STORY({t:"Napoléon prend la couronne",vig:"napoleon",y:1804,where:"Notre-Dame de Paris",hook:"Napoléon Bonaparte est né en Corse, à Ajaccio. Jeune général, il gagne bataille après bataille.",
   text:["Le 2 décembre 1804, à Notre-Dame de Paris, il est sacré <b>empereur</b>. Le pape est venu de Rome pour la cérémonie…","Mais au moment décisif, Napoléon prend lui-même la couronne et la pose sur sa tête ! Une façon de montrer qu’il ne doit son pouvoir à personne.","Napoléon crée le <b>Code civil</b>, les lycées et la Légion d’honneur, qui existent encore. Mais ses guerres font des millions de morts, et il finit exilé sur une île, Sainte-Hélène."],
   key:"Napoléon est un personnage à double face : un grand organisateur, mais aussi un conquérant qui a mis l’Europe en guerre.",map:{w:"F",pts:[{k:"ajaccio",lbl:"Ajaccio",big:1},{k:"paris",lbl:"Paris",on:1,big:1}]},cap:"D’Ajaccio, en Corse, jusqu’à Paris."})]},
 {id:"hs_xx",sub:"hg",lvl:"CM2",title:"Histoires des XIXe et XXe siècles",desc:"Pasteur, Jules Ferry, la tour Eiffel, 1918, la Lune, 1998",steps:[
  STORY({t:"Pasteur sauve Joseph",vig:"pasteur",y:1885,where:"Paris",hook:"Le 6 juillet 1885, un garçon de 9 ans, Joseph Meister, arrive à Paris avec sa mère. Il a été mordu par un chien enragé.",
   text:["À l’époque, la <b>rage</b> est une maladie mortelle : personne n’en guérit. Le savant <b>Louis Pasteur</b> travaille depuis des années sur un remède, testé seulement sur des animaux.","C’est un choix difficile, mais Pasteur accepte d’essayer. Pendant dix jours, Joseph reçoit des piqûres…","Joseph guérit ! C’est le premier <b>vaccin</b> contre la rage. Devenu adulte, Joseph a travaillé comme gardien à l’Institut Pasteur toute sa vie."],

/* ---------- xT : la valeur de chaque zone du terrain (valeurs simplifiées, en %) ---------- */
const XTV=[[0.5,0.7,1,1.6,3,6],[0.6,0.9,1.4,2.5,5,15],[0.5,0.7,1,1.6,3,6]];
const XTROW=["couloir gauche","axe","couloir droit"],XTCOL=["sa surface","son camp","avant le rond central","après le rond central","l’entrée de la zone de vérité","la surface adverse"];
const XTS={};
function xtGrid(id){XTS[id]={a:null};const cw=105/6,rh=68/3;let z="";
  for(let r=0;r<3;r++)for(let c=0;c<6;c++){const v=XTV[r][c],op=Math.min(.75,.08+v/16);
    z+=`<g class="xtz" data-xt="${id}:${r}:${c}"><rect x="${TPX(c*cw)+1}" y="${TPY(r*rh)+1}" width="${cw*S11-2}" height="${rh*S11-2}" rx="5" style="fill:rgba(255,225,77,${op.toFixed(2)})"/><text class="xtv" x="${TPX(c*cw+cw/2)}" y="${TPY(r*rh+rh/2)+7}" text-anchor="middle">${fmt(v)} %</text></g>`}
  return `<div class="xtw" id="xtw-${id}"><svg class="tfig xtsvg" viewBox="0 0 639 428" role="img" aria-label="Terrain découpé en zones, avec la valeur xT de chaque zone">${tacPitch("xt"+id)}${z}<g class="xtar"></g></svg>
  <p class="xgout" id="xtout-${id}"><b>Touche une zone de départ</b>, puis une zone d’arrivée : je calcule ce que vaut ta passe.</p></div>`}
function xtTap(g){const [id,r,c]=g.dataset.xt.split(":"),S=XTS[id];if(!S)return;const root=document.getElementById("xtw-"+id),out=document.getElementById("xtout-"+id);
  root.querySelectorAll(".xtz").forEach(e=>e.classList.remove("on","on2"));const cw=105/6,rh=68/3,ctr=(r,c)=>[TPX(c*cw+cw/2),TPY(r*rh+rh/2)];
  if(!S.a){S.a=[+r,+c];g.classList.add("on");root.querySelector(".xtar").innerHTML="";out.innerHTML=`Départ : <b>${XTROW[r]}</b>, ${XTCOL[c]} (xT ${fmt(XTV[r][c])} %). Touche maintenant la zone d’arrivée.`;beep([[440,0,.06]]);return}
  const [r0,c0]=S.a,v0=XTV[r0][c0],v1=XTV[r][c],d=Math.round((v1-v0)*10)/10;S.a=null;
  root.querySelector(`[data-xt="${id}:${r0}:${c0}"]`).classList.add("on");g.classList.add("on2");
  const [x1,y1]=ctr(r0,c0),[x3,y3]=ctr(+r,+c),dl=Math.hypot(x3-x1,y3-y1)||1,x2=x3-(x3-x1)*26/dl,y2=y3-(y3-y1)*26/dl;root.querySelector(".xtar").innerHTML=(r0==r&&c0==c)?"":`<line class="ar pass" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" marker-end="url(#tmp-xt${id})"/>`;
  out.innerHTML=`xT arrivée ${fmt(v1)} % − xT départ ${fmt(v0)} % = <b>${d>0?"+":""}${fmt(d)} %</b>. ${d>2?"Superbe passe : elle rapproche vraiment ton équipe du but !":d>0?"Passe utile : elle fait progresser l’équipe.":d===0?"Passe neutre : on garde le ballon, sans danger en plus.":"Passe en arrière : elle fait baisser la menace (parfois utile pour mieux repartir)."}`;
  beep([[d>0?660:330,0,.1]])}

/* ---------- Elo : prédire un match ---------- */
const eloE=d=>1/(1+10**(-d/400));
function eloWidget(id,d){return `<div class="poi" id="elo-${id}"><label class="pl-sl"><span><b>Écart Elo</b> (bleus − rouges) : <span id="ev-${id}">${d>0?"+":""}${d}</span></span><input type="range" min="-600" max="600" step="25" value="${d}" data-elo="${id}"></label><div class="poibars" id="eb-${id}"></div></div>`}
function eloRender(id,d){const el=document.getElementById("eb-"+id);if(!el)return;const e=eloE(d),pc=Math.round(e*100);
  document.getElementById("ev-"+id).textContent=(d>0?"+":"")+d;
  el.innerHTML=[["Score attendu bleus",pc,"#1c7ed6"],["Score attendu rouges",100-pc,"#e03131"]].map(([t,p,c])=>`<div class="pbar"><span>${t}</span><i><b style="width:${p}%;background:${c}"></b></i><em>${p} %</em></div>`).join("")}

/* ---------- générateurs ---------- */
function xtGen(){const r0=R(0,2),c0=R(0,4),r1=R(0,2),c1=R(c0,5),v0=XTV[r0][c0],v1=XTV[r1][c1],d=Math.round((v1-v0)*10)/10;
  return inp(`Une passe part de la zone « ${XTROW[r0]}, ${XTCOL[c0]} » (xT ${fmt(v0)} %) et arrive dans la zone « ${XTROW[r1]}, ${XTCOL[c1]} » (xT ${fmt(v1)} %). Combien de xT (en %) a-t-elle ajouté ?`,d,`Valeur d’une action = xT d’arrivée − xT de départ = ${fmt(v1)} − ${fmt(v0)} = ${fmt(d)} %.`,{tol:.051,unit:"%"})}
function per90Gen(){const [p,n]=pick([[.5,12],[.5,20],[.75,12],[.75,20],[.25,20],[.6,15],[.4,15],[.3,20],[.9,10],[1.2,10]]),g=Math.round(p*n),m=90*n;
  return inp(`Un attaquant a marqué ${g} buts en ${fmt(m)} minutes. Combien de buts marque-t-il par 90 minutes ?`,p,`Nombre de matchs complets : ${fmt(m)} ÷ 90 = ${n}. Puis ${g} ÷ ${n} = ${fmt(p)} but par 90 minutes.`,{tol:.011})}
function psxgGen(){const g=R(22,45),d=pick([-6,-4,-3,3,4,5,7,8]),ps=g+d;
  return inp(`Sur la saison, les tirs cadrés contre un gardien valaient ${ps} PSxG. Il a encaissé ${g} buts. Combien de buts a-t-il « évités » ? (négatif s’il en a laissé passer trop)`,d,`Buts évités = PSxG − buts encaissés = ${ps} − ${g} = ${d}. ${d>0?"Il a sauvé son équipe : c’est un très bon gardien cette saison.":"Il a encaissé plus que prévu : saison difficile."}`)}
function eloGen(){const t=R(1,2);
  if(t===1){const d=pick([0,100,200,300,400]),pc=Math.round(eloE(d)*100);return mcq(`Une équipe a ${d} points Elo de plus que son adversaire. Quel est son score attendu (environ) ?`,`${pc} %`,shuffle(["50 %","64 %","76 %","85 %","91 %","100 %"].filter(x=>x!==`${pc} %`)),`Formule : 1 ÷ (1 + 10^(−${d}/400)) ≈ ${pc} %. ${d?"Plus l’écart est grand, plus l’équipe est favorite… mais jamais à 100 %.":"Même niveau : 50 % chacun."}`)}
  const [E,res,ch]=pick([[.5,"gagne",25],[.5,"perd",-25],[.76,"gagne",12],[.24,"gagne",38],[.76,"perd",-38]]),r0=pick([1650,1700,1800,1850,1900]);
  return inp(`Avec K = 50 : une équipe à ${r0} points avait un score attendu de ${fmt(E)} et elle ${res}. Quel est son nouveau classement Elo ?`,r0+ch,`Nouveau = ${r0} + 50 × (${res==="gagne"?1:0} − ${fmt(E)}) = ${r0} ${ch>0?"+":"−"} ${Math.abs(ch)} = ${r0+ch}. ${E<.5&&res==="gagne"?"Battre un plus fort rapporte beaucoup de points !":""}`)}
const fxDataGen=()=>pick([xtGen,per90Gen,psxgGen,eloGen])();

   say:"Les détails qui font marquer : le corner rentrant, qui file vers le but, ou sortant, qui s’éloigne du gardien. L’écran, qui libère un coéquipier. Un joueur placé près du gardien pour le gêner, sans le toucher. Un joueur à l’entrée de la surface pour le deuxième ballon. Et toujours deux ou trois joueurs derrière, contre la contre-attaque. Sur coup de pied arrêté, chaque joueur connaît sa course au centimètre près."}]},
 {id:"fx_xt",sub:"foot",lvl:"Expert",title:"Data pro : xT, xA et PSxG",desc:"Ce que vaut une passe, un passeur, un gardien",gen:()=>pick([xtGen,psxgGen])(),bank:FXB.data.slice(0,4),steps:[
  {t:"La carte de la menace (xT)",h:`<p>Le xG ne note que les tirs. Mais une passe qui met un coéquipier à l’entrée de la surface a aussi de la valeur ! En 2018, l’analyste Karun Singh a popularisé le <b>xT</b> (expected threat, « menace attendue ») : chaque zone du terrain reçoit la probabilité qu’on marque bientôt depuis là.</p>`+xtGrid("xt1")+`<p class="muted">Les bleus attaquent vers la droite. Valeurs simplifiées pour l’exercice.</p>`,
   say:"Le x G ne note que les tirs. Mais une passe qui met un coéquipier à l’entrée de la surface a aussi de la valeur. Le x T, la menace attendue, donne à chaque zone du terrain la probabilité qu’on marque bientôt depuis là. Plus on est près du but adverse et dans l’axe, plus la zone vaut cher. Touche une zone de départ, puis une zone d’arrivée : je calcule ce que vaut ta passe."},
  {t:"Calculer la valeur d’une action",h:CALC("valeur d’une passe = xT d’arrivée − xT de départ")+EX(CALC("Passe de l’axe, avant le rond central (1,4 %)\nvers l’axe, entrée de la zone de vérité (5 %) :\n5 − 1,4 = + 3,6 %"))+KEY("Une passe en arrière fait <b>baisser</b> le xT. Ce n’est pas forcément une erreur : parfois on recule pour mieux repartir."),
   say:"Pour calculer la valeur d’une passe, on fait x T d’arrivée moins x T de départ. Une passe de l’axe, avant le rond central, qui vaut un virgule quatre pour cent, vers l’entrée de la zone de vérité, qui vaut cinq pour cent, rapporte plus trois virgule six pour cent. Une passe en arrière fait baisser le x T, mais ce n’est pas forcément une erreur : parfois on recule pour mieux repartir."},
  {t:"xA et PSxG",h:ltab([["Stat","Elle mesure…","Pour juger…"],["xG","la chance qu’un tir devienne but","les attaquants"],["xA","le xG du tir qui suit la passe","les passeurs"],["xT","la menace créée par une action","les porteurs et les passeurs"],["PSxG","la difficulté du tir là où il arrive dans le but","les gardiens"]])+CALC("buts évités = PSxG − buts encaissés")+EX(`<p>Un gardien reçoit des tirs cadrés qui valent 38 PSxG et encaisse 31 buts : 38 − 31 = <b>+7 buts évités</b>. Il a fait gagner des points à son équipe.</p>`),
   say:"Le x A, les passes décisives attendues, c’est le x G du tir qui suit une passe : un passeur peut avoir un gros x A même si ses attaquants ratent tout. Le P S x G regarde où le tir arrive dans le but : une lucarne vaut plus qu’un tir sur le gardien. Pour juger un gardien, on fait P S x G moins buts encaissés. Trente-huit moins trente et un : plus sept buts évités. C’est un excellent gardien."}]},
 {id:"fx_scout",sub:"foot",lvl:"Expert",title:"Data pro : recruter comme un club",desc:"Stats par 90 minutes, percentiles, pièges",gen:per90Gen,bank:FXB.data.slice(4,7),steps:[
  {t:"Comparer avec les stats par 90",h:`<p>Joueur A : 10 buts en 2 700 minutes. Joueur B : 7 buts en 1 260 minutes. Qui est le plus efficace ?</p>`+CALC("par 90 = total ÷ (minutes ÷ 90)\n\nA : 2 700 ÷ 90 = 30 matchs → 10 ÷ 30 ≈ 0,33 but par 90\nB : 1 260 ÷ 90 = 14 matchs →  7 ÷ 14 = 0,5 but par 90")+KEY("B marque moins au total… mais il est <b>plus efficace</b>. Les recruteurs comparent toujours <b>par 90 minutes</b>."),
   say:"Joueur A : dix buts en deux mille sept cents minutes. Joueur B : sept buts en mille deux cent soixante minutes. Qui est le plus efficace ? On divise les minutes par quatre-vingt-dix pour avoir le nombre de matchs complets. A a joué trente matchs : zéro virgule trois trois but par match. B a joué quatorze matchs : zéro virgule cinq. B marque moins au total, mais il est plus efficace. Les recruteurs comparent toujours par quatre-vingt-dix minutes."},
  {t:"Les percentiles",h:`<p>Un recruteur compare un joueur aux autres joueurs <b>du même poste</b>. Le <b>percentile</b> dit quelle part des joueurs il dépasse.</p>`+ltab([["Stat (ailier)","Valeur par 90","Percentile","Lecture"],["dribbles réussis","3,1","96e","meilleur que 96 % des ailiers"],["passes progressives","4,0","80e","très bon"],["xG","0,18","45e","moyen"],["ballons récupérés","2,2","88e","il défend beaucoup"]])+KEY("Profil : un ailier dribbleur qui défend… mais qui doit progresser devant le but."),
   say:"Un recruteur compare un joueur à ceux du même poste. Le percentile dit quelle part des joueurs il dépasse. Quatre-vingt-seizième percentile aux dribbles, cela veut dire qu’il dribble mieux que quatre-vingt-seize pour cent des ailiers. En lisant toutes les lignes, on dessine un profil : ici, un ailier dribbleur qui défend beaucoup, mais qui doit progresser devant le but."},
  {t:"Les pièges des stats",h:ltab([["Piège","Exemple","Ce qu’il faut faire"],["trop peu de minutes","2 buts en 150 minutes = 1,2 par 90","attendre au moins 900 minutes"],["championnat différent","briller en D2 n’est pas briller en Ligue des champions","comparer des niveaux proches"],["rôle dans l’équipe","un milieu défensif fait peu de dribbles","comparer au même poste"],["penalties","un tireur de penalties gonfle ses buts","regarder les buts sans penalty"]])+KEY("Les données disent <b>où regarder</b>. Ensuite, les recruteurs vont voir le joueur en <b>vidéo</b> et au <b>stade</b>."),
   say:"Attention aux pièges. Sur trop peu de minutes, le hasard fausse tout : on attend souvent au moins neuf cents minutes. Briller en deuxième division n’est pas briller en Ligue des champions. On compare toujours au même poste. Et un tireur de penalties gonfle ses buts : on regarde aussi les buts sans penalty. Les données disent où regarder. Ensuite, les recruteurs vont voir le joueur en vidéo et au stade."}]},
 {id:"fx_elo",sub:"foot",lvl:"Expert",title:"Data pro : prédire un match (Elo)",desc:"Le classement Elo et ses calculs",gen:eloGen,bank:FXB.data.slice(7,10),steps:[
  {t:"Le classement Elo",h:`<p>Le professeur Arpad Elo a inventé ce classement pour les <b>échecs</b>. Il est aussi utilisé pour les équipes nationales de football. Chaque équipe a un nombre de points : plus il est grand, plus elle est forte.</p>`+CALC("score attendu = 1 ÷ (1 + 10^(−écart ÷ 400))")+eloWidget("el1",200)+KEY("Le « score attendu » compte la victoire comme 1 et le nul comme ½. Avec 200 points d’écart : environ <b>76 %</b>."),
   say:"Le professeur Arpad Elo a inventé ce classement pour les échecs. On l’utilise aussi pour les équipes nationales de football. Plus une équipe a de points, plus elle est forte. Avec la formule, on calcule le score attendu à partir de l’écart de points. Avec deux cents points d’écart, l’équipe favorite a un score attendu d’environ soixante-seize pour cent. Bouge le curseur pour voir ce qui change."},
  {t:"Gagner des points",h:CALC("nouveau classement = ancien + K × (résultat − score attendu)\n\nrésultat : victoire = 1   nul = 0,5   défaite = 0\nK = importance du match (plus grand en Coupe du monde)")+EX(CALC("K = 50. L’équipe a 1 700 points, score attendu 0,24.\nElle gagne !  1 700 + 50 × (1 − 0,24) = 1 700 + 38 = 1 738"))+KEY("Battre un plus fort rapporte <b>beaucoup</b>. Battre un plus faible rapporte <b>peu</b>. C’est la <b>surprise</b> qui fait gagner des points."),
   say:"Après le match, on met à jour le classement : nouveau égale ancien plus K fois, résultat moins score attendu. Une victoire vaut un, un nul un demi, une défaite zéro. Exemple : une équipe à mille sept cents points, avec un score attendu de zéro virgule deux quatre, gagne. Elle prend cinquante fois zéro virgule sept six, soit trente-huit points. Battre un plus fort rapporte beaucoup : c’est la surprise qui fait gagner des points."},
  {t:"Combiner Elo et xG",h:ltab([["Outil","Ce qu’il dit","Sa limite"],["Elo","la force d’une équipe dans le temps","ne voit pas les blessés ou les transferts"],["xG","la qualité du jeu dans un match","un match, c’est peu"],["Poisson","les probabilités de chaque score","suppose que les buts arrivent au hasard"],["avantage du terrain","jouer chez soi aide","souvent ajouté au calcul Elo"]])+KEY("Les analystes <b>combinent</b> ces outils. Mais le foot reste le sport où l’outsider gagne souvent : c’est ce qui le rend génial."),
   say:"Les analystes combinent plusieurs outils : le classement Elo pour la force dans le temps, le x G pour la qualité du jeu, la loi de Poisson pour les probabilités de chaque score, et l’avantage du terrain. Mais le foot reste le sport où l’outsider gagne souvent. C’est ce qui le rend génial."}]}
];

/* heure et fuseaux (heure d’hiver en France, en janvier) */
const TZC=[["Paris",1],["Londres",0],["New York",-5],["Los Angeles",-8],["Mexico",-6],["Rio de Janeiro",-3],["Dakar",0],["Le Caire",2],["Moscou",3],["Dubaï",4],["Pékin",8],["Tokyo",9]];
G.hgHeure=()=>{const t=R(1,5);
  if(t<=2){let a=pick(TZC),b=pick(TZC);while(b===a)b=pick(TZC);if(t===1)a=TZC[0];const h=R(0,23),d=b[1]-a[1];let r=h+d,j="";if(r>=24){r-=24;j=" (le lendemain)"}if(r<0){r+=24;j=" (la veille)"}
    const u=x=>x===0?"UTC":`UTC${x>0?"+":"−"}${Math.abs(x)}`;
    return inp(`En janvier, il est ${h} h à ${a[0]} (${u(a[1])}). Quelle heure est-il à ${b[0]} (${u(b[1])}) ? Réponds avec un nombre de 0 à 23.`,r,`Décalage : ${u(b[1])} − (${u(a[1])}) = ${d>0?"+":""}${d} h. ${h} ${d>=0?"+":"−"} ${Math.abs(d)} = ${r} h${j}.`,{unit:"h",sig:"tz"+a[0]+b[0]+h})}
  if(t===3){const n=pick([1,2,3,4,5,6,8,9]),deg=n*15;return inp(`Deux villes sont séparées de ${deg}° de longitude. Combien d’heures de décalage cela fait-il (en théorie) ?`,n,`La Terre tourne de 360° en 24 h, soit 15° par heure. ${deg} ÷ 15 = ${n} h.`,{unit:"h"})}
  if(t===4){const h=pick([9,12,15,18,20]),m=h+4;return mcq(`En janvier, il est ${h} h à Paris (UTC+1). En Inde, l’heure est UTC+5 h 30. Quelle heure est-il à New Delhi ?`,`${m} h 30`,[`${m} h`,`${m+1} h`,`${h+5} h 30`,`${h-4} h 30`],`Décalage : 5 h 30 − 1 h = 4 h 30. ${h} h + 4 h 30 = ${m} h 30. Certains pays ont des fuseaux à la demi-heure !`)}
  const [c,ans]=pick([["AR","Sud"],["AU","Sud"],["ZA","Sud"],["NZ","Sud"],["CL","Sud"],["MG","Sud"],["CA","Nord"],["MN","Nord"],["NO","Nord"],["JP","Nord"],["MX","Nord"],["EG","Nord"],["BR","Les deux"],["ID","Les deux"],["CD","Les deux"],["KE","Les deux"],["EC","Les deux"],["CO","Les deux"]]);
  return mcq(`Le pays en rouge est : ${CNAME(c)}. Dans quel hémisphère est-il ?`,ans,["Nord","Sud","Les deux"].filter(x=>x!==ans),`${CNAME(c)} : ${ans==="Les deux"?"l’équateur (la ligne rouge) le traverse, il est dans les deux hémisphères !":"hémisphère "+ans+"."}${ans==="Sud"?" Là-bas, Noël tombe en été !":""}`,{map:{w:"W",hi:c,eq:1},sig:"he"+c})};

function densGen(){const t=R(1,2);
  if(t===1){const [p,a,d]=pick([[60,300,200],[90,450,200],[20,500,40],[150,100,1500],[10,2000,5],[50,250,200],[120,400,300]]);return inp(`Un pays a ${p} millions d’habitants et une superficie de ${fmt(a*1000)} km². Quelle est sa densité (habitants par km²) ?`,d,`Densité = ${fmt(p*1e6)} ÷ ${fmt(a*1000)} = ${fmt(d)} habitants par km².`,{unit:"hab/km²"})}
  const T=R(10,28),h=pick([1,2,3,4,5]),r=T-6*h;return inp(`Il fait ${T} °C au pied d’une montagne. Quelle température fait-il (environ) ${fmt(h*1000)} m plus haut ? (−6 °C tous les 1 000 m)`,r,`${T} − 6 × ${h} = ${r} °C.`,{unit:"°C"})}
const hgPlaneteGen=()=>pick([densGen,()=>fromBank(pick(PLB.rec)),()=>fromBank(pick(PLB.clim))])();
