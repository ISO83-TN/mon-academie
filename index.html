const CLUBS=[["Bayern Munich","Allemagne","Munich",0],["Juventus","Italie","Turin",0],["Benfica","Portugal","Lisbonne",1],["Galatasaray","Turquie","Istanbul",0],["Boca Juniors","Argentine","Buenos Aires",1],["Flamengo","Brésil","Rio de Janeiro",0],["Al Ahly","Égypte","Le Caire",1],["Celtic","Écosse","Glasgow",0],["Ajax","Pays-Bas","Amsterdam",1],["PSV","Pays-Bas","Eindhoven",0],["FC Porto","Portugal","Porto",0],["Naples","Italie","Naples",0],["Borussia Dortmund","Allemagne","Dortmund",0],["Club América","Mexique","Mexico",1],["Al-Hilal","Arabie saoudite","Riyad",1],["Wydad","Maroc","Casablanca",0],["Espérance de Tunis","Tunisie","Tunis",1],["Real Madrid","Espagne","Madrid",1],["FC Barcelone","Espagne","Barcelone",0]];
G.hgFoot=()=>{const t=R(1,4);
  if(t<=2){const [c,y,n]=pick(WCH);return mcq(`Le pays en rouge a organisé la Coupe du monde en ${y}${y==="2034"?" (prévue)":""}. Quel est-il ?`,n,shuffle(WCH.filter(w=>w[2]!==n).map(w=>w[2])),`C’est ${n === "Angleterre"?"l’Angleterre (au Royaume-Uni)":n}. ${n==="Uruguay"?"La toute première Coupe du monde, gagnée par l’Uruguay.":n==="France"?"En 1998, la France gagne à domicile, au Stade de France.":n==="Qatar"?"La première en hiver (novembre-décembre), à cause de la chaleur.":""}`,{map:{w:"W",hi:c,ringR:20},sig:"wc"+c})}
  const [cl,p,v,isCap]=pick(CLUBS);
  if(t===3)return mcq(`Dans quel pays joue le club ${cl} ?`,p,shuffle(CLUBS.filter(x=>x[1]!==p).map(x=>x[1])),`${cl} joue à ${v}, ${p==="Écosse"?"en Écosse (au Royaume-Uni)":"pays : "+p}.`,{sig:"cl"+cl});
  return mcq(`${cl} joue à ${v}. Est-ce la capitale de son pays (${p}) ?`,isCap?"Oui":"Non",[isCap?"Non":"Oui"],isCap?`Oui, ${v} est la capitale.`:`Non ! ${v} n’est pas la capitale.${CAPOF(p)?` La capitale est ${CAPOF(p).k}.`:p==="Écosse"?" La capitale de l’Écosse est Édimbourg.":""}`,{sig:"cc"+cl})};

 {id:"gx_caps",sub:"hg",lvl:"Expert",title:"Capitales du monde : niveau expert",desc:"65 nouvelles capitales et les grands pièges",gen:G.hgXcaps,steps:[

 {id:"gx_heure",sub:"hg",lvl:"Expert",title:"Latitude, longitude et fuseaux horaires",desc:"Se repérer sur la Terre et calculer l’heure partout",gen:G.hgHeure,bank:[],steps:[
  {t:"La grille de la Terre",get h(){return fig(mapW({eq:1,grid:1,gr:1,hemi:1,pts:[{k:"paris",lbl:"Paris ≈ 49° N, 2° E",on:1}]}),"L’équateur (latitude 0°) et le méridien de Greenwich (longitude 0°).")+ltab([["","Latitude","Longitude"],["mesure","l’écart au nord ou au sud de l’équateur","l’écart à l’est ou à l’ouest de Greenwich"],["de… à…","0° à 90° N ou S","0° à 180° E ou O"],["lignes","les parallèles","les méridiens"],["Paris","≈ 49° Nord","≈ 2° Est"]])+KEY("Avec une latitude et une longitude, on trouve <b>n’importe quel point</b> de la Terre : c’est ce que fait ton GPS.")},
   say:"Pour se repérer sur la Terre, on utilise une grille. La latitude dit si on est au nord ou au sud de l’équateur, de zéro à quatre-vingt-dix degrés. La longitude dit si on est à l’est ou à l’ouest du méridien de Greenwich, de zéro à cent quatre-vingts degrés. Paris est à environ quarante-neuf degrés nord et deux degrés est. Avec ces deux nombres, on trouve n’importe quel point de la Terre : c’est ce que fait un GPS."},
  {t:"Pourquoi l’heure change",h:CALC("La Terre fait un tour (360°) en 24 heures.\n360 ÷ 24 = 15° par heure\n\n→ 24 fuseaux horaires d’environ 15° chacun")+ltab([["Ville (en janvier)","Décalage avec Londres","Quand il est midi à Paris…"],...TZC.map(([n,o])=>[n,o===0?"UTC":`UTC${o>0?"+":"−"}${Math.abs(o)}`,`${((12+o-1)%24+24)%24} h`])])+KEY("Quand on va vers l’<b>est</b>, on <b>avance</b> sa montre. Vers l’<b>ouest</b>, on la <b>recule</b>."),
   say:"La Terre fait un tour complet, trois cent soixante degrés, en vingt-quatre heures. Trois cent soixante divisé par vingt-quatre, cela fait quinze degrés par heure. On a donc découpé la Terre en vingt-quatre fuseaux horaires. Quand il est midi à Paris en janvier, il est six heures du matin à New York, et vingt heures à Tokyo. Vers l’est, on avance sa montre. Vers l’ouest, on la recule."},
  {t:"Calculer l’heure d’un match",h:EX(CALC("Match de Ligue des champions à 21 h à Paris (UTC+1).\nQuelle heure à Rio (UTC−3) ?\n−3 − (+1) = −4 h   →   21 − 4 = 17 h\n\nEt à Tokyo (UTC+9) ?\n+9 − (+1) = +8 h   →   21 + 8 = 29 h = 5 h du matin, le lendemain !"))+KEY("Si on dépasse 24 h, on enlève 24 et c’est <b>le lendemain</b>. Si on passe sous 0 h, on ajoute 24 et c’est <b>la veille</b>."),
   say:"Un match de Ligue des champions commence à vingt et une heures à Paris. À Rio, le décalage est de moins quatre heures : il est dix-sept heures. À Tokyo, c’est plus huit heures : vingt et un plus huit égale vingt-neuf. On enlève vingt-quatre : il est cinq heures du matin, le lendemain ! Les supporters japonais se lèvent très tôt."},
  {t:"La ligne de changement de date",get h(){return fig(mapW({ocean:"pac"}),"La ligne de changement de date traverse l’océan Pacifique.")+`<p>De l’autre côté de la Terre, vers 180° de longitude, passe la <b>ligne de changement de date</b>. Quand on la traverse vers l’ouest, on saute un jour ; vers l’est, on revit la même journée !</p>`+KEY("En 2011, les îles <b>Samoa</b> ont changé de côté de la ligne : elles ont sauté directement du 29 au 31 décembre. Le 30 décembre 2011 n’a jamais existé là-bas !")},
   say:"Au milieu de l’océan Pacifique, vers cent quatre-vingts degrés de longitude, passe la ligne de changement de date. Quand on la traverse vers l’ouest, on saute un jour. Vers l’est, on revit la même journée. En deux mille onze, les îles Samoa ont décidé de changer de côté : elles sont passées directement du vingt-neuf au trente et un décembre. Là-bas, le trente décembre deux mille onze n’a jamais existé !"}]},

function buildQuestions(t,n=t.n||10){
  const out=[],seen=new Set();const add=q=>{const k=qkey(q);if(!seen.has(k)){seen.add(k);out.push(q)}};
  const bank=t.bank?shuffle(t.bank):[];
  if(t.gen&&t.bank){bank.slice(0,Math.ceil(n/2)).forEach(e=>add(fromBank(e)));let g=0;while(out.length<n&&g++<200)add(t.gen())}
  else if(t.gen){let g=0;while(out.length<n&&g++<200)add(t.gen())}
  else bank.slice(0,n).forEach(e=>add(fromBank(e)));
  return shuffle(out);
}

  return `<div class="banner" role="status">${glyph(s.sub)}<div class="grow"><b>C’est l’heure : ${si.label}</b><p>Séance de ${s.min} min prévue à ${s.t.replace(":"," h ")}.</p></div><button class="btn small" data-slot="${s.id}">Commencer</button><button class="x" data-dismiss="${s.id}" aria-label="Plus tard">Plus tard</button></div>`}

function vSetup(){return `<header class="top"><div><p class="eyebrow">Bienvenue</p><h1>Mon <span class="mark">Académie</span></h1></div></header>
  <section class="card" style="padding:22px;display:flex;flex-direction:column;gap:16px;max-width:560px">
   <h2>Tablette de l’enfant</h2><p>Avant de commencer, un parent règle l’appli.</p>
   <div class="field"><label for="w-name">Prénom de l’enfant</label><input class="input" id="w-name" autocomplete="off"></div>
   <div class="field"><label for="w-cl">Classe</label><select class="input" id="w-cl">${CLASSES.map(l=>`<option>${l}</option>`).join("")}</select></div>
   <div class="field"><label for="w-pin">Code parent (4 chiffres)</label><input class="input" id="w-pin" inputmode="numeric" maxlength="4" autocomplete="off"></div>
   <div><button class="btn" data-setup="1">C’est parti</button></div></section>
  <section class="card" style="padding:22px;display:flex;flex-direction:column;gap:16px;max-width:560px">
   <h2>Je suis parent</h2><p>Pour suivre un enfant depuis ce téléphone, tape le code famille affiché dans l’Espace parents de sa tablette.</p>
   <div class="field"><label for="w-code">Code famille</label><input class="input" id="w-code" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX"></div>
   <div><button class="btn ghost" data-join="1">Suivre cet enfant</button></div></section>`}
let installEvt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;if(!quiz)render()});
window.addEventListener("appinstalled",()=>{installEvt=null;if(!quiz)render()});
function render(){renderNav();const m=document.getElementById("main");
  if(!state.name||!state.pin){document.getElementById("nav").hidden=true;m.innerHTML=`<div class="wrap">${vSetup()}</div>`;return}
  document.getElementById("nav").hidden=false;
  m.innerHTML=`<div class="wrap">${view==="home"?vHome():view==="subjects"?vSubjects():view==="subject"?vSubject():view==="progress"?vProgress():view==="planning"?vPlanning():vParents()}</div>`}

/* ---------- Accueil ---------- */
function vHome(){const lv=levelInfo(state.xp),st=streak(),td=state.days[todayKey()]||{quiz:0,xp:0},slots=todaySlots(),nx=nextSlot();
  const d=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  const goalPct=Math.min(100,Math.round(td.quiz/state.goal*100));
  const sugg=Object.keys(SUBJECTS).map(k=>({k,m:subMastery(k)})).sort((a,b)=>(a.m.pct??-1)-(b.m.pct??-1)).slice(0,2).map(x=>recommend(x.k));
  return `<header class="top"><div><p class="eyebrow">${d}</p><h1>Salut <span class="mark">${esc(state.name)}</span> !</h1></div>${installEvt?`<button class="btn fluo small" data-install="1">Installer l’appli</button>`:syncPill()}</header>
  ${reminderHTML()}
  <section class="stats">
    <div class="card stat"><span class="eyebrow">Niveau ${lv.L} · ${lv.title}</span><span class="big num">${state.xp} <small style="font-size:16px" class="muted">XP</small></span><div class="bar" aria-label="Progression du niveau"><i style="width:${Math.round(lv.into/lv.need*100)}%"></i></div><span class="muted num" style="font-size:14px">Encore ${lv.need-lv.into} XP pour le niveau ${lv.L+1}</span></div>
    <div class="card stat"><span class="eyebrow">Série</span><span class="big num">${st} jour${st>1?"s":""}</span><span class="muted" style="font-size:14px">${st?"Fais au moins un quiz chaque jour pour la garder.":"Fais un quiz aujourd’hui pour lancer ta série."}</span></div>
    <div class="card stat"><span class="eyebrow">Objectif du jour</span><span class="big num">${td.quiz} / ${state.goal} <small style="font-size:16px" class="muted">quiz</small></span><div class="bar"><i style="width:${goalPct}%;background:${goalPct>=100?"var(--good)":"var(--accent)"}"></i></div><span class="muted" style="font-size:14px">${goalPct>=100?"Objectif atteint, bravo !":"+"+td.xp+" XP gagnés aujourd’hui"}</span></div>
  </section>
  <section class="section"><div class="section-head"><h2>Au programme aujourd’hui</h2>${nx?`<span class="muted">Prochaine séance à ${nx.t.replace(":"," h ")}</span>`:""}</div>
    <div class="card slots">${slots.length?slots.map(s=>`<div class="slot ${s.done?"done":""}"><span class="time">${s.t.replace(":"," h ")}</span>${glyph(s.sub)}<div><div class="ttl"><b>${SUBINFO(s.sub).label}</b></div><span class="muted" style="font-size:14px">${s.min} min</span></div>${s.done?`<span class="tag good">Fait</span>`:`<button class="btn small" data-slot="${s.id}">Commencer</button>`}</div>`).join(""):`<p class="empty">Rien de prévu aujourd’hui. Profites-en pour un quiz libre ou un défi !</p>`}</div></section>
  <section class="section"><h2>Pour progresser</h2><div class="grid">
    <button class="tile" data-rev="1" style="--sc:var(--c-rev)"><div class="tile-head">${glyph("rev")}<div><h3>Révisions</h3><span class="muted">${state.deck.length?`${state.deck.length} question${state.deck.length>1?"s":""} à revoir`:"Aucune erreur à revoir pour l’instant"}</span></div></div></button>
    ${(()=>{const L=nextLesson();return L?`<button class="tile" data-lesson="${L.id}" style="--sc:${SUBINFO(L.sub).c}"><div class="tile-head">${glyph(L.sub)}<div><h3>Cours : ${L.title}</h3><span class="muted">${L.lvl} · avec explications audio</span></div></div></button>`:""})()}
    ${sugg.map(t=>`<button class="tile" data-theme="${t.id}" style="--sc:${SUBJECTS[t.sub].c}"><div class="tile-head">${glyph(t.sub)}<div><h3>${t.title}</h3><span class="muted">${SUBJECTS[t.sub].label} · ${state.themes[t.id]?"à renforcer":"nouveau thème"}</span></div></div></button>`).join("")}
  </div></section>`}

/* ---------- Matières ---------- */
function vSubjects(){return `<header class="top"><div><p class="eyebrow">Toutes les matières</p><h1>Choisis ta matière</h1></div>${syncPill()}</header>${reminderHTML()}
  <div class="grid">${Object.entries(SUBJECTS).map(([k,s])=>{const m=subMastery(k);return `<button class="tile" data-sub="${k}" style="--sc:${s.c}"><div class="tile-head">${glyph(k)}<div><h3>${s.label}</h3><span class="muted">${m.played} / ${m.total} thèmes explorés</span></div></div><div class="bar"><i style="width:${m.pct??0}%;background:${s.c}"></i></div><span class="muted num" style="font-size:14px">${m.pct===null?"Pas encore commencé":"Maîtrise : "+m.pct+" %"}</span></button>`}).join("")}</div>`}
function vSubject(){const s=SUBJECTS[curSub],ci=lvlIdx(state.classe);
  const ts=THEMES.filter(t=>t.sub===curSub&&(lvlFilter==="Tout"||t.lvl===lvlFilter));
  const aiDisabled=!sample;
  return `<header class="top"><div><button class="link" data-go="subjects">← Matières</button><h1 style="display:flex;gap:14px;align-items:center">${glyph(curSub)} ${s.label}</h1></div></header>
  <div class="chips" role="group" aria-label="Filtrer par niveau">${["Tout",...LEVELS].map(l=>`<button class="chip" data-lvl="${l}" aria-pressed="${lvlFilter===l}">${l==="Tout"?"Tous les niveaux":l}</button>`).join("")}</div>
  ${lessonsSection(curSub)}${LESSONS.some(L=>L.sub===curSub)?`<h2>Quiz d’entraînement</h2>`:""}
  <div class="card">${ts.length?ts.map(t=>{const a=themeAvg(t.id),md=medal(t.id),li=lvlIdx(t.lvl);return `<div class="theme-row"><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div class="meta"><h3>${t.title}</h3><span class="tag ${li>ci?"beyond":""}">${t.lvl}${li>ci?" · au-delà":""}</span>${md?`<span class="medal ${md[0]}">${md[1]}</span>`:""}</div><span class="muted">${t.desc}</span>${a!==null?`<div class="bar"><i style="width:${Math.round(a)}%;background:${s.c}"></i></div><span class="muted num" style="font-size:13px">Moyenne ${Math.round(a)} % · meilleur ${state.themes[t.id].best} % · ${state.themes[t.id].plays} quiz</span>`:""}</div><button class="btn small" data-theme="${t.id}" style="background:${s.c}">${a===null?"Commencer":"Rejouer"}</button></div>`}).join(""):`<p class="empty">Pas de thème à ce niveau pour cette matière.</p>`}</div>
  ${!window.claude?"":`<section class="card ai-card" aria-labelledby="aih"><div class="tile-head">${glyph("defi")}<div><h3 id="aih">Défi Claude : des questions toutes neuves</h3><span class="muted">Claude invente un quiz sur le sujet de ton choix, à n’importe quel niveau.</span></div></div>
   ${aiDisabled?`<p class="muted">Ce défi s’active quand l’appli est ouverte dans Claude.</p>`:`<div class="row"><div class="field"><label for="ai-topic">Sujet (facultatif)</label><input class="input" id="ai-topic" placeholder="${curSub==="hg"?"ex. les châteaux forts, les volcans":curSub==="en"?"ex. le sport, les métiers":curSub==="prog"?"ex. les boucles, Internet":"ex. les fractions, les angles"}"></div><div class="field" style="max-width:160px"><label for="ai-lvl">Niveau</label><select class="input" id="ai-lvl">${LEVELS.map(l=>`<option ${l===LEVELS[Math.min(ci+1,3)]?"selected":""}>${l}</option>`).join("")}</select></div><button class="btn fluo" data-ai="${curSub}" ${aiBusy?"disabled":""}>${aiBusy?"Claude prépare…":"Créer mon défi"}</button></div>${aiBusy?`<p class="muted" id="ai-status">Claude écrit tes questions. Ça peut prendre une minute.</p>`:""}`}
  </section>`}`}

/* ---------- Progrès ---------- */
function vProgress(){const H=state.history;const totalQ=H.length,totalMin=Math.round(H.reduce((a,h)=>a+(h.sec||0),0)/60),succ=H.length?Math.round(H.reduce((a,h)=>a+h.c,0)/H.reduce((a,h)=>a+h.n,0)*100):null;
  const days=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push({d,v:state.days[dkey(d)]?.xp||0,today:i===0})}
  const weak=THEMES.filter(t=>state.themes[t.id]&&themeAvg(t.id)<60);
  return `<header class="top"><div><p class="eyebrow">Mon suivi</p><h1>Mes progrès</h1></div>${syncPill()}</header>
  <section class="stats" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">
   <div class="card stat"><span class="eyebrow">Quiz terminés</span><span class="big num">${totalQ}</span></div>
   <div class="card stat"><span class="eyebrow">Temps de travail</span><span class="big num">${totalMin} <small style="font-size:16px" class="muted">min</small></span></div>
   <div class="card stat"><span class="eyebrow">Bonnes réponses</span><span class="big num">${succ===null?"–":succ+" %"}</span></div>
   <div class="card stat"><span class="eyebrow">Médailles</span><span class="big num">${THEMES.filter(t=>medal(t.id)).length}</span></div>
  </section>
  <section class="section"><h2>XP des 14 derniers jours</h2><div class="card" style="padding:14px">${chart(days)}</div></section>
  <section class="section"><h2>Maîtrise par matière</h2><div class="card">${Object.entries(SUBJECTS).map(([k,s])=>{const m=subMastery(k);return `<div class="mastery">${glyph(k)}<div><b>${s.label}</b><div class="bar" style="margin-top:6px"><i style="width:${m.pct??0}%;background:${s.c}"></i></div></div><span class="num" style="text-align:right;font-weight:700">${m.pct===null?"–":m.pct+" %"}</span></div>`}).join("")}</div></section>
  ${weak.length?`<section class="section"><h2>À retravailler</h2><div class="grid">${weak.map(t=>`<button class="tile" data-theme="${t.id}" style="--sc:${SUBJECTS[t.sub].c}"><div class="tile-head">${glyph(t.sub)}<div><h3>${t.title}</h3><span class="muted">Moyenne ${Math.round(themeAvg(t.id))} %</span></div></div></button>`).join("")}</div></section>`:""}
  <section class="section"><h2>Derniers quiz</h2><div class="card tbl-wrap">${H.length?`<table><thead><tr><th>Date</th><th>Matière</th><th>Thème</th><th style="text-align:right">Score</th></tr></thead><tbody>${H.slice(-12).reverse().map(h=>`<tr><td>${new Date(h.d).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}</td><td>${SUBINFO(h.sub).short}</td><td>${esc(h.title)}</td><td class="num">${fmt(h.c)} / ${h.n}</td></tr>`).join("")}</tbody></table>`:`<p class="empty">Tes résultats apparaîtront ici après ton premier quiz.</p>`}</div></section>`}
function chart(days){const W=700,Hh=190,pl=34,pb=26,pt=18,max=Math.max(100,Math.ceil(Math.max(...days.map(x=>x.v))/50)*50),bw=(W-pl-10)/days.length;
  const y=v=>pt+(Hh-pt-pb)*(1-v/max);const L=["D","L","M","M","J","V","S"];
  let s=`<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="XP gagnés par jour sur 14 jours">`;
  [0,max/2,max].forEach(v=>{s+=`<line class="g" x1="${pl}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`});
  days.forEach((d,i)=>{const x=pl+i*bw+bw*.18,w=bw*.64;if(d.v>0){s+=`<rect class="b ${d.today?"today":""}" x="${x}" y="${y(d.v)}" width="${w}" height="${y(0)-y(d.v)}" rx="4"/><text class="v" x="${x+w/2}" y="${y(d.v)-5}" text-anchor="middle">${d.v}</text>`}
    s+=`<text x="${x+w/2}" y="${Hh-8}" text-anchor="middle">${L[d.d.getDay()]}${d.d.getDate()}</text>`});
  return s+"</svg>"}

/* ---------- Planning ---------- */
function vPlanning(){const di=(new Date().getDay()+6)%7;const td=todaySlots();
  return `<header class="top"><div><p class="eyebrow">Ma semaine</p><h1>Planning</h1></div>${parentOK?`<span class="pill ok"><span class="dot"></span>Mode parent : modification possible</span>`:`<button class="btn ghost small" data-go="parents">Modifier (parents)</button>`}</header>${reminderHTML()}
  <div class="week">${DAYS.map((name,d)=>{const sl=state.planning.filter(s=>s.d===d).sort((a,b)=>a.t.localeCompare(b.t));return `<div class="card day ${d===di?"today":""}"><h3>${name}${d===di?' <span class="tag">aujourd’hui</span>':""}</h3>${sl.length?sl.map(s=>{const done=d===di&&td.find(x=>x.id===s.id)?.done;return `<div class="pslot" style="--sc:${SUBINFO(s.sub).c}"><span class="muted num">${s.t.replace(":"," h ")} · ${s.min} min</span><b>${SUBINFO(s.sub).short}${done?" ✓":""}</b>${parentOK?`<button class="del" data-del="${s.id}">Retirer</button>`:""}</div>`}).join(""):`<span class="muted" style="font-size:14px">Repos</span>`}</div>`}).join("")}</div>
  ${parentOK?`<section class="card" style="padding:18px;display:flex;flex-direction:column;gap:14px"><h2>Ajouter une séance</h2><div class="row">
   <div class="field"><label for="p-d">Jour</label><select class="input" id="p-d">${DAYS.map((n,i)=>`<option value="${i}">${n}</option>`).join("")}</select></div>
   <div class="field"><label for="p-t">Heure</label><input class="input" id="p-t" type="time" value="17:30"></div>
   <div class="field"><label for="p-s">Matière</label><select class="input" id="p-s">${Object.entries({...SUBJECTS,...EXTRA}).map(([k,s])=>`<option value="${k}">${s.label}</option>`).join("")}</select></div>
   <div class="field" style="max-width:130px"><label for="p-m">Durée (min)</label><input class="input" id="p-m" type="number" min="5" max="90" step="5" value="20"></div>
   <button class="btn" data-addslot="1">Ajouter</button></div></section>`:""}
  <p class="muted" style="font-size:15px">Quand l’appli est ouverte à l’heure d’une séance, un rappel s’affiche en haut de l’écran avec un petit signal sonore. Une séance est cochée dès qu’un quiz de la matière est terminé ce jour-là.</p>`}

/* ---------- Parents ---------- */
function vParents(){if(!parentOK)return `<header class="top"><div><p class="eyebrow">Espace parents</p><h1>Code parent</h1></div></header>
  <div class="card" style="padding:26px;display:flex;flex-direction:column;gap:18px;align-items:center;max-width:420px;margin:0 auto;width:100%">
   <p class="muted" style="text-align:center">Entre le code à 4 chiffres pour voir le bilan et modifier le planning.</p>
   <div class="pin-dots">${[0,1,2,3].map(i=>`<i class="${i<pinBuf.length?"on":""}"></i>`).join("")}</div>
   <div class="pin">${[1,2,3,4,5,6,7,8,9,"C",0,"←"].map(k=>`<button data-pin="${k}" aria-label="${k==="C"?"Effacer":k==="←"?"Retour":k}">${k}</button>`).join("")}</div></div>`;
  const since=Date.now()-7*864e5,W=state.history.filter(h=>h.d>=since);
  const rows=Object.entries({...SUBJECTS,rev:EXTRA.rev}).map(([k,s])=>{const h=W.filter(x=>x.sub===k);const n=h.reduce((a,x)=>a+x.n,0),c=h.reduce((a,x)=>a+x.c,0);return {k,s,q:h.length,min:Math.round(h.reduce((a,x)=>a+(x.sec||0),0)/60),pct:n?Math.round(c/n*100):null}});
  const weak=THEMES.filter(t=>state.themes[t.id]&&themeAvg(t.id)<60).map(t=>t.title);
  const beyond=THEMES.filter(t=>lvlIdx(t.lvl)>lvlIdx(state.classe)&&state.themes[t.id]).length;
  return `<header class="top"><div><p class="eyebrow">Espace parents</p><h1>Bilan de ${esc(state.name)}</h1></div><button class="btn ghost small" data-lock="1">Verrouiller</button></header>
  <section class="section"><h2>Les 7 derniers jours</h2><div class="card tbl-wrap"><table><thead><tr><th>Matière</th><th style="text-align:right">Quiz</th><th style="text-align:right">Minutes</th><th style="text-align:right">Réussite</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.s.label}</td><td class="num">${r.q}</td><td class="num">${r.min}</td><td class="num" style="color:${r.pct===null?"var(--muted)":r.pct>=80?"var(--good)":r.pct<60?"var(--bad)":"var(--warn)"}">${r.pct===null?"–":r.pct+" %"}</td></tr>`).join("")}</tbody></table></div>
  <p class="muted">${weak.length?"Points faibles : "+weak.join(", ")+".":"Aucun point faible repéré pour l’instant."} ${beyond} thème${beyond>1?"s":""} au-delà du ${state.classe} déjà exploré${beyond>1?"s":""}.</p></section>
  <section class="section"><h2>Cours</h2><div class="card tbl-wrap"><table><thead><tr><th>Cours</th><th>Matière</th><th>Niveau</th><th style="text-align:right">Meilleur score</th><th style="text-align:right">Essais</th></tr></thead><tbody>${LESSONS.map(L=>{const s=state.lessons?.[L.id];return `<tr><td>${L.title}</td><td>${SUBINFO(L.sub).short}</td><td>${L.lvl}</td><td class="num" style="color:${s?.best==null?"var(--muted)":s.best>=80?"var(--good)":s.best<50?"var(--bad)":"var(--warn)"}">${s?.best==null?(s?"cours lu":"–"):s.best+" %"}</td><td class="num">${s?.tries||0}</td></tr>`}).join("")}</tbody></table></div></section>
  <section class="card" style="padding:18px;display:flex;flex-direction:column;gap:14px"><h2>Réglages</h2><div class="row">
   <div class="field"><label for="s-name">Prénom</label><input class="input" id="s-name" value="${esc(state.name)}"></div>
   <div class="field"><label for="s-cl">Classe actuelle</label><select class="input" id="s-cl">${CLASSES.map(l=>`<option ${l===state.classe?"selected":""}>${l}</option>`).join("")}</select></div>
   <div class="field"><label for="s-goal">Objectif quotidien (quiz)</label><select class="input" id="s-goal">${[1,2,3,4,5].map(n=>`<option ${n===state.goal?"selected":""}>${n}</option>`).join("")}</select></div>
   <div class="field"><label for="s-pin">Nouveau code parent</label><input class="input" id="s-pin" inputmode="numeric" maxlength="4" placeholder="4 chiffres"></div>
   <div class="field" style="max-width:150px"><label for="s-snd">Sons</label><select class="input" id="s-snd"><option value="1" ${state.sound?"selected":""}>Activés</option><option value="0" ${!state.sound?"selected":""}>Coupés</option></select></div>
  </div><div><button class="btn" data-savesettings="1">Enregistrer</button></div></section>
  ${famSection()}${isParentDevice()?"":`<section class="card" style="padding:18px;display:flex;flex-direction:column;gap:12px"><h2>Sauvegarde</h2><p class="muted">Les progrès sont gardés sur cette tablette. Fais une sauvegarde de temps en temps, ou avant de changer de tablette.</p><div class="tools"><button class="btn ghost small" data-export="1">Télécharger une sauvegarde</button><label class="btn ghost small" for="imp-file" style="cursor:pointer">Restaurer une sauvegarde</label><input type="file" id="imp-file" accept="application/json,.json" hidden></div></section>`}
  ${isParentDevice()?"":`<section class="card" style="padding:18px;display:flex;flex-direction:column;gap:12px"><h2>Données</h2><p class="muted">Efface les XP, les scores, l’historique et les révisions. Le planning et les réglages sont gardés.</p><div><button class="btn danger small" data-reset="1" id="reset-btn">Effacer la progression</button></div></section>`}`}

/* ================= quiz ================= */
function startTheme(id){const t=THEME[id];if(!t)return;openQuiz({title:t.title,sub:t.sub,th:id,qs:buildQuestions(t)})}
function startRevision(){if(!state.deck.length){toast("Aucune question à revoir : voici un thème conseillé.");const k=Object.keys(SUBJECTS).sort((a,b)=>(subMastery(a).pct??-1)-(subMastery(b).pct??-1))[0];return startTheme(recommend(k).id)}
  const items=shuffle(state.deck).slice(0,10);openQuiz({title:"Révisions",sub:"rev",th:"rev",qs:items.map(x=>x.q),rev:items.map(x=>x.key)})}
function startSlot(id){const s=state.planning.find(x=>x.id===id);if(!s)return;dismissed.add(id);
  if(SUBJECTS[s.sub])return startTheme(recommend(s.sub).id);if(s.sub==="rev")return startRevision();

function answer(val){const q=quiz.qs[quiz.i];if(quiz.answered)return;if(quiz.retry&&q.type==="mcq"&&quiz.retry.out.includes(val))return;const ok=isRight(q,val);if(q.type==="draw")quiz.drawMsg=evalDraw(q,val).msg;

function finishQuiz(){const n=quiz.qs.length,c=quiz.c,pct=Math.round(c/n*100),sec=Math.round((Date.now()-quiz.start)/1000);

  if(quiz.th!=="rev"){const t=state.themes[quiz.th]||(state.themes[quiz.th]={scores:[],best:0,plays:0});t.scores=[...t.scores,pct].slice(-5);t.best=Math.max(t.best,pct);t.plays++}

async function aiQuiz(sub){if(!sample||aiBusy)return;const topic=(document.getElementById("ai-topic")?.value||"").trim(),lvl=document.getElementById("ai-lvl")?.value||"6e";
  aiBusy=new AbortController();render();
  const prompt=`Tu es un professeur bienveillant et rigoureux. Prépare un quiz pour ${state.name}, élève français de ${state.classe} (environ 10 ans) qui veut aller plus loin que son programme.
Matière : ${SUBJECTS[sub].label}. Niveau visé : ${lvl} (programmes officiels de l’Éducation nationale). Sujet : ${topic||"au choix, varié dans la matière"}.
Écris 8 questions à choix multiples, de difficulté progressive. Chaque fait doit être exact et vérifié ; une seule bonne réponse par question ; mauvaises réponses plausibles.
${sub==="en"?"Les questions testent l’anglais : consignes en français, réponses en anglais quand c’est pertinent.":"Tout en français."}
Réponds uniquement par un tableau JSON : [{"q":"question","choices":["A","B","C","D"],"answer":0,"expl":"explication courte et claire (1 à 2 phrases)"}] où "answer" est l’indice (0 à 3) de la bonne réponse dans "choices".`;
  try{const data=await sample.json(prompt,{signal:aiBusy.signal,cache:false});
    const qs=(Array.isArray(data)?data:[]).filter(x=>x&&typeof x.q==="string"&&Array.isArray(x.choices)&&x.choices.length>=2&&x.choices.length<=4&&Number.isInteger(x.answer)&&x.answer>=0&&x.answer<x.choices.length)
      .map(x=>{const good=String(x.choices[x.answer]);return mcq(x.q,good,x.choices.filter((_,i)=>i!==x.answer).map(String),String(x.expl||""))});
    aiBusy=null;if(qs.length<3){render();return toast("Claude n’a pas réussi ce quiz. Réessaie avec un autre sujet.")}
    openQuiz({title:"Défi "+(topic||SUBJECTS[sub].short)+" ("+lvl+")",sub,th:"ai_"+sub,ai:true,qs});
  }catch(e){aiBusy=null;render();if(e&&e.code==="not_granted"||e&&e.code==="sampling_disabled"){sample=null;render();toast("Le défi Claude n’est pas autorisé sur cet appareil.")}else if(e&&e.code==="rate_limited")toast("Trop de défis d’un coup. Réessaie dans un moment.");else if(e&&e.code!=="cancelled")toast("Le défi n’a pas pu être créé. Réessaie.")}}
async function aiExplain(){const q=quiz.qs[quiz.i];quiz.explain="";renderQuiz();
  const given=q.type==="mcq"?q.choices[quiz.picked]:quiz.typed;
  try{await sample(`Explique simplement à un enfant de 10 ans pourquoi la bonne réponse à la question « ${q.q}${q.code?"\n"+q.code:""} » est « ${goodText(q)} ». Il a répondu « ${given} ». Montre où est son erreur, sans le gronder. 3 phrases maximum, en français, sans mise en forme.`,{modelTier:"quick",onText:({text})=>{if(quiz){quiz.explain=text;renderQuiz()}}})}
  catch(e){if(quiz){quiz.explain="Claude n’a pas pu répondre cette fois.";renderQuiz()}}}

/* ================= synchro famille (Firebase, REST) ================= */
const FB={key:"AIzaSyBKqzsPSnOxh-LrvR1FSvkdvq3IgbSAl4M",project:"mon-academie-3b3ab"};
const FAM_LS="mon-academie-famille",AUTH_LS="mon-academie-auth";
let fam=null;try{fam=JSON.parse(localStorage.getItem(FAM_LS)||"null")}catch(e){}
const isParentDevice=()=>!!(fam&&fam.role==="parent");
const fsync={status:fam?"wait":"off",last:0,busy:false,pending:false,timer:null};
const PROG=["xp","themes","days","history","deck","lessons"],SETK=["name","classe","pin","goal","sound","planning","voiceAuto"];
function saveFam(){try{if(fam)localStorage.setItem(FAM_LS,JSON.stringify(fam));else localStorage.removeItem(FAM_LS)}catch(e){}}
function newCode(){const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",b=new Uint8Array(24);crypto.getRandomValues(b);return [...b].map(x=>A[x%32]).join("")}
const fmtCode=c=>c.match(/.{1,4}/g).join("-");
const normCode=c=>String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
async function fbToken(){let a=null;try{a=JSON.parse(localStorage.getItem(AUTH_LS)||"null")}catch(e){}
  if(a&&a.exp>Date.now()+60000)return a.id;let r;
  if(a&&a.refresh){r=await fetch(`https://securetoken.googleapis.com/v1/token?key=${FB.key}`,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(a.refresh)});
    if(r.ok){const j=await r.json();a={id:j.id_token,refresh:j.refresh_token,exp:Date.now()+Number(j.expires_in)*1000}}else a=null}
  if(!a){r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FB.key}`,{method:"POST",headers:{"Content-Type":"application/json"},body:'{"returnSecureToken":true}'});
    if(!r.ok)throw new Error("auth");const j=await r.json();a={id:j.idToken,refresh:j.refreshToken,exp:Date.now()+Number(j.expiresIn)*1000}}
  try{localStorage.setItem(AUTH_LS,JSON.stringify(a))}catch(e){}return a.id}
const fbDoc=c=>`https://firestore.googleapis.com/v1/projects/${FB.project}/databases/(default)/documents/familles/${c}`;
async function fbPull(code){const t=await fbToken();const r=await fetch(fbDoc(code),{headers:{Authorization:"Bearer "+t},cache:"no-store"});
  if(r.status===404)return null;if(!r.ok)throw new Error("get "+r.status);const j=await r.json();try{return JSON.parse(j.fields.state.stringValue)}catch(e){return null}}
async function fbPush(code,st){const t=await fbToken();const body={fields:{state:{stringValue:JSON.stringify(st)},updatedAt:{integerValue:String(Date.now())},device:{stringValue:fam?fam.role:"?"}}};
  const r=await fetch(fbDoc(code),{method:"PATCH",headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"},body:JSON.stringify(body)});if(!r.ok)throw new Error("patch "+r.status)}
/* La tablette fait foi pour les progrès ; le plus récent l’emporte pour le planning et les réglages. */
function mergeStates(local,remote){if(!remote)return local;const out={...local};
  if((remote.settingsAt||0)>(local.settingsAt||0)){SETK.forEach(k=>{if(k in remote)out[k]=remote[k]});out.settingsAt=remote.settingsAt}
  if(isParentDevice())PROG.forEach(k=>{if(k in remote)out[k]=remote[k]});
  return out}
let lastSetSig=null;const setSig=()=>JSON.stringify(SETK.map(k=>state[k]));
const _saveBase=save;
save=function(){const sig=setSig();if(lastSetSig!==null&&sig!==lastSetSig)state.settingsAt=Date.now();lastSetSig=sig;_saveBase();scheduleSync()};
function scheduleSync(ms=1500){if(!fam)return;clearTimeout(fsync.timer);fsync.timer=setTimeout(doSync,ms)}
async function doSync(){if(!fam)return;if(fsync.busy){fsync.pending=true;return}fsync.busy=true;
  try{const remote=await fbPull(fam.code);
    if(!remote&&isParentDevice()){fsync.status="err";fsync.msg="code introuvable";return}
    const merged=mergeStates(state,remote),changed=JSON.stringify(merged)!==JSON.stringify(state);
    if(changed){state=Object.assign(defaults(),merged);saveLocal();lastSetSig=setSig();if(!quiz&&!lesson)render()}
    const parentHasNewer=isParentDevice()&&(state.settingsAt||0)>(remote?.settingsAt||0);
    if((!isParentDevice()||parentHasNewer)&&JSON.stringify(state)!==JSON.stringify(remote))await fbPush(fam.code,state);
    fsync.status="ok";fsync.msg="";fsync.last=Date.now()}
  catch(e){fsync.status=navigator.onLine===false?"offline":"err";fsync.msg=""}
  finally{fsync.busy=false;if(fsync.pending){fsync.pending=false;scheduleSync(300)}
    if(fsync.status!==fsync.prev&&view==="parents"&&!quiz&&!lesson)render();else{const p=document.getElementById("sync-pill");if(p)p.outerHTML=syncPill()}fsync.prev=fsync.status}}
const ago=t=>{const s=Math.round((Date.now()-t)/1000);return s<60?"à l’instant":s<3600?`il y a ${Math.round(s/60)} min`:`il y a ${Math.round(s/3600)} h`};
function famStatusText(){if(!fam)return "Progrès gardés sur cette tablette";
  if(fsync.status==="ok")return (isParentDevice()?`Suivi de ${esc(state.name)} · à jour `:"Synchronisé ")+ago(fsync.last);
  if(fsync.status==="offline")return isParentDevice()?"Hors ligne : dernières données affichées":"Hors ligne : envoi dès le retour d’Internet";
  if(fsync.status==="err")return fsync.msg?"Synchronisation : "+fsync.msg:"Synchronisation en attente";
  return "Synchronisation…"}
setInterval(()=>{if(fam&&document.visibilityState==="visible")doSync()},isParentDevice()?30000:60000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")scheduleSync(200)});
window.addEventListener("online",()=>scheduleSync(200));
const PARENT_MSG="Sur ce téléphone, tu suis les progrès. Les quiz et les exercices se font sur la tablette de l’enfant.";
for(const fnName of ["startTheme","startRevision","startSlot","startLessonEx","aiQuiz"]){const orig=window[fnName];if(typeof orig==="function")window[fnName]=function(...a){if(isParentDevice())return toast(PARENT_MSG);return orig.apply(this,a)}}
if(isParentDevice())parentOK=true;
async function famJoin(code,role){code=normCode(code);if(code.length<20)return toast("Le code famille fait 24 caractères.");
  const prev=fam;fam={code,role};toast("Connexion…");
  try{const remote=await fbPull(code);if(!remote){fam=prev;return toast("Aucun enfant trouvé avec ce code. Vérifie-le sur la tablette.")}
    saveFam();state=Object.assign(defaults(),remote);saveLocal();lastSetSig=setSig();if(role==="parent")parentOK=true;fsync.status="ok";fsync.last=Date.now();toast(role==="parent"?`Tu suis maintenant ${remote.name||"l’enfant"}.`:"Tablette reliée, progrès récupérés.");go("home")}
  catch(e){fam=prev;toast("Pas de connexion. Réessaie avec Internet.")}}
function famSection(){
  if(isParentDevice())return `<section class="card" style="padding:18px;display:flex;flex-direction:column;gap:12px"><h2>Suivi à distance</h2><p>Ce téléphone suit les progrès de <b>${esc(state.name)}</b>. Les données se mettent à jour toutes les 30 secondes quand l’appli est ouverte. Tu peux modifier le planning ici : la tablette le reçoit automatiquement.</p><p class="muted">Code famille : <span class="code">${fmtCode(fam.code)}</span></p><div><button class="btn ghost small" data-famoff="1">Ne plus suivre sur ce téléphone</button></div></section>`;
  if(!fam)return `<section class="card" style="padding:18px;display:flex;flex-direction:column;gap:12px"><h2>Suivre depuis un téléphone</h2><p class="muted">Active le suivi pour voir les progrès, les cours et le planning depuis ton téléphone. Les données sont envoyées en ligne, protégées par un code famille secret.</p><div class="tools"><button class="btn" data-famon="1">Activer le suivi</button></div>
    <details><summary class="muted" style="cursor:pointer">J’ai déjà un code famille (nouvelle tablette)</summary><div class="row" style="margin-top:10px"><div class="field"><label for="fam-link">Code famille</label><input class="input" id="fam-link" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX"></div><button class="btn ghost" data-famlink="1">Relier cette tablette</button></div><p class="muted" style="font-size:14px">Les progrès enregistrés en ligne remplaceront ceux de cette tablette.</p></details>
    <details${state.history.length?"":" open"}><summary style="cursor:pointer"><b>Je suis parent : suivre l’enfant depuis cet appareil</b> (téléphone, PC)</summary><p class="muted" style="font-size:14px;margin-top:8px">Tape le code famille affiché dans l’Espace parents de la <b>tablette</b> de l’enfant. Cet appareil affichera alors ses progrès à la place des siens.</p><div class="row"><div class="field"><label for="fam-follow">Code famille</label><input class="input" id="fam-follow" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX"></div><button class="btn" data-famfollow="1">Suivre l’enfant</button></div></details></section>`;
  return `<section class="card" style="padding:18px;display:flex;flex-direction:column;gap:12px"><h2>Suivre depuis un téléphone</h2><p>Sur ton téléphone, ouvre <b>iso83-tn.github.io/mon-academie</b>, choisis « Je suis parent », puis tape ce code :</p><p class="code big" id="fam-code">${fmtCode(fam.code)}</p><p class="muted" style="font-size:14px">Plus simple : envoie-toi ce lien et ouvre-le sur ton téléphone ou ton PC, il se relie tout seul.</p><div class="tools"><button class="btn" data-famshare="1">Envoyer le lien de suivi</button><button class="btn ghost small" data-famcopy="1">Copier le code</button><button class="btn ghost small" data-famoff="1">Désactiver le suivi</button></div><p class="muted" style="font-size:14px">Garde ce code pour toi : il donne accès aux progrès. ${esc(famStatusText())}.</p></section>`}

function followURL(){return location.origin+location.pathname+"#suivre="+fmtCode(fam.code)}
render();
initCloud();
lastSetSig=setSig();if(fam)scheduleSync(400);

  if(fam&&fam.role==="enfant")return toast("Cet appareil est la tablette de l’enfant : ouvre ce lien sur ton téléphone ou ton PC.");
  if(isParentDevice()&&normCode(m[1])===fam.code)return;

if("serviceWorker" in navigator&&location.protocol.startsWith("http")){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{});
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!had)return;const t=document.getElementById("toast");t.innerHTML='Nouvelle version disponible <button class="btn small fluo" data-reload="1" style="margin-left:10px">Mettre à jour</button>';t.hidden=false;clearTimeout(toast.t)})}
